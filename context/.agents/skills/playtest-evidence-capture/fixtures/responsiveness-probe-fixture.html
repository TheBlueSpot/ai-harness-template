<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Responsiveness Probe Fixture</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f3efe6;
        color: #1f2933;
      }

      main {
        width: min(560px, calc(100vw - 48px));
        background: #fffaf0;
        border: 2px solid #1f2933;
        padding: 24px;
        box-shadow: 10px 10px 0 #d7c8aa;
      }

      button {
        font: inherit;
        padding: 12px 16px;
        margin-right: 12px;
        border: 2px solid #1f2933;
        background: #f59e0b;
        color: #1f2933;
        cursor: pointer;
      }

      .muted {
        color: #52606d;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Probe Fixture</h1>
      <p id="status">Idle</p>
      <p id="paint-count" class="muted">Paints: 0</p>
      <button id="start">Start</button>
      <button id="Restart">Restart</button>
      <p class="muted">Any click or key schedules visible work. Restart waits briefly before becoming ready again.</p>
    </main>
    <script>
      const status = document.getElementById("status");
      const paintCount = document.getElementById("paint-count");
      const startButton = document.getElementById("start");
      const restartButton = document.getElementById("Restart");
      let paints = 0;
      let armed = false;

      function render(label) {
        requestAnimationFrame(() => {
          paints += 1;
          status.textContent = label;
          paintCount.textContent = `Paints: ${paints}`;
          document.body.dataset.state = label.toLowerCase().replace(/\s+/g, "-");
        });
      }

      startButton.addEventListener("click", () => {
        armed = true;
        render("Started");
      });

      restartButton.addEventListener("click", () => {
        armed = false;
        status.textContent = "Restarting";
        setTimeout(() => {
          armed = true;
          render("Restarted");
        }, 120);
      });

      window.addEventListener("keydown", (event) => {
        if (!armed) {
          return;
        }

        render(`Key ${event.key}`);
      });

      window.addEventListener("pointerdown", () => {
        if (!armed) {
          return;
        }

        render("Pointer input");
      });
    </script>
  </body>
</html>
