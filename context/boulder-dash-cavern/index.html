<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boulder Dash Cavern Run</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="hud">
        <div class="brand">
          <p class="eyebrow">Catalog Entry</p>
          <h1>Boulder Dash Cavern Run</h1>
          <p class="summary">Dig dirt, route gems, dodge patrols, and let falling rocks do the dirty work.</p>
        </div>
        <div class="stats" id="stats"></div>
        <div class="guide-card" id="guide"></div>
        <div class="controls">
          <p><strong>Move</strong> Arrow keys or WASD</p>
          <p><strong>Start / Confirm</strong> Enter or Space</p>
          <p><strong>Restart</strong> R</p>
        </div>
      </aside>
      <main class="stage">
        <canvas id="game" width="960" height="640" aria-label="Boulder Dash Cavern Run"></canvas>
        <div class="overlay" id="overlay"></div>
      </main>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
