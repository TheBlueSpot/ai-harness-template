<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centipede Webline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07130d;
        --panel: rgba(8, 24, 16, 0.82);
        --ink: #d7ffe8;
        --muted: #87b79b;
        --accent: #8cff7a;
        --danger: #ff7a7a;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 50% 0%, #133625 0%, transparent 36%),
          linear-gradient(180deg, #05100b 0%, #06130d 100%);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
