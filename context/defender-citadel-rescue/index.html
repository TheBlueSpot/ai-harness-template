<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Defender Citadel Rescue</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #06111f;
        --panel: rgba(6, 13, 28, 0.8);
        --panel-border: rgba(162, 224, 255, 0.2);
        --sky: #7be8ff;
        --sun: #ffd275;
        --amber: #ffd86b;
        --danger: #ff7373;
        --mint: #88ffba;
        --white: #f4fbff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 15%, rgba(255, 210, 117, 0.18), transparent 18%),
          radial-gradient(circle at 20% 20%, rgba(123, 232, 255, 0.12), transparent 24%),
          linear-gradient(180deg, #15324d 0%, #081323 60%, #04070d 100%);
        color: var(--white);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      main {
        width: min(100vw, 1180px);
        padding: 16px;
      }

      canvas {
        width: 100%;
        display: block;
        border-radius: 20px;
        border: 1px solid var(--panel-border);
        background: #07111c;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.46);
      }

      .shell {
        position: relative;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        border-radius: 20px;
        background: rgba(3, 7, 13, 0.35);
        pointer-events: none;
      }

      .overlay.hidden {
        display: none;
      }

      .card {
        width: min(560px, 100%);
        padding: 26px 28px;
        border-radius: 22px;
        border: 1px solid var(--panel-border);
        background: rgba(6, 13, 28, 0.9);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.32);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 8px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--sky);
        font-size: 11px;
      }

      .card h1,
      .card h2 {
        margin: 0 0 12px;
        font-size: clamp(28px, 4vw, 48px);
      }

      .card p {
        margin: 0 0 12px;
        line-height: 1.55;
        color: rgba(244, 251, 255, 0.8);
      }

      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin: 16px 0 18px;
      }

      .controls span {
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(123, 232, 255, 0.09);
        border: 1px solid rgba(123, 232, 255, 0.16);
        font-size: 12px;
        color: var(--white);
      }

      .cta {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font: inherit;
        font-weight: 700;
        color: #07111f;
        background: linear-gradient(90deg, var(--sun), var(--amber));
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shell">
        <canvas id="game" width="960" height="600" aria-label="Defender Citadel Rescue" role="img"></canvas>
        <div class="overlay" id="menuOverlay">
          <div class="card">
            <p class="eyebrow">Catalog Entry</p>
            <h1>Defender Citadel Rescue</h1>
            <p>Sweep low, tag abductors before they clear the ridge, and bank survivors back into the citadel. The first pass is slow on purpose so the rescue loop reads before the ridge stacks up.</p>
            <div class="controls" aria-label="Controls">
              <span>Move WASD / arrows</span>
              <span>Fire Space / J</span>
              <span>Bomb X / Shift</span>
              <span>Enter or click to start</span>
            </div>
            <button class="cta" id="startButton" type="button">Start Rescue</button>
          </div>
        </div>
      </div>
    </main>
    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const menuOverlay = document.getElementById("menuOverlay");
      const startButton = document.getElementById("startButton");

      const worldWidth = 3200;
      const keys = new Set();
      const terrain = [];

      const state = {
        mode: "title",
        wave: 1,
        score: 0,
        lives: 3,
        bombs: 3,
        rescued: 0,
        civiliansLost: 0,
        citadelHealth: 8,
        message: "Sweep low, tag abductors before they clear the ridge, and carry survivors back to the citadel.",
        player: null,
        cameraX: 0,
        particles: [],
        bullets: [],
        enemies: [],
        civilians: [],
        rescueText: [],
        flash: 0,
        shake: 0,
        spawnClock: 0,
        spawnBudget: 0,
        totalCivilians: 0,
        citadelPulse: 0,
        introTimer: 0,
      };

      function buildTerrain() {
        terrain.length = 0;
        for (let x = 0; x <= worldWidth; x += 80) {
          const height =
            455 +
            Math.sin(x * 0.004) * 54 +
            Math.sin(x * 0.0105 + 0.8) * 18 +
            Math.cos(x * 0.0025 + 1.2) * 38;
          terrain.push({ x, y: height });
        }
      }

      function terrainHeightAt(x) {
        const wrapped = ((x % worldWidth) + worldWidth) % worldWidth;
        for (let i = 0; i < terrain.length - 1; i += 1) {
          const a = terrain[i];
          const b = terrain[i + 1];
          if (wrapped >= a.x && wrapped <= b.x) {
            const t = (wrapped - a.x) / (b.x - a.x);
            return a.y + (b.y - a.y) * t;
          }
        }
        return terrain[terrain.length - 1].y;
      }

      function createPlayer() {
        return {
          x: 280,
          y: 210,
          vx: 0,
          vy: 0,
          dir: 1,
          cooldown: 0,
          shootHeld: false,
          rescueCooldown: 0,
          carrier: null,
          invuln: 0,
          thrust: 0,
        };
      }

      function resetGame() {
        buildTerrain();
        state.mode = "title";
        state.wave = 1;
        state.score = 0;
        state.lives = 3;
        state.bombs = 3;
        state.rescued = 0;
        state.civiliansLost = 0;
        state.citadelHealth = 8;
        state.message = "Sweep low, tag abductors before they clear the ridge, and carry survivors back to the citadel.";
        state.player = createPlayer();
        state.cameraX = 0;
        state.particles = [];
        state.bullets = [];
        state.enemies = [];
        state.civilians = [];
        state.rescueText = [];
        state.flash = 0;
        state.shake = 0;
        state.spawnClock = 1.2;
        state.spawnBudget = 0;
        state.totalCivilians = 0;
        state.citadelPulse = 0;
        state.introTimer = 0;
        seedWave(1);
      }

      function seedWave(wave) {
        state.wave = wave;
        state.spawnClock = 1.15;
        state.spawnBudget = 7 + wave * 3;
        state.citadelPulse = 1;
        state.message =
          wave === 1
            ? "Abductors hook civilians from the ridgeline. Fly through survivors to load them, then touch the citadel beacon."
            : wave === 2
              ? "Hunters now dive low at the citadel. Save smart bombs for stacked kidnappers."
              : "Late waves stack abductors and hunters. Intercept early before the ridge line breaks.";
        state.civilians = [];
        const positions = [440, 760, 1080, 1360, 1820, 2170, 2490, 2860];
        const count = Math.min(positions.length, 5 + wave);
        state.totalCivilians = count;
        for (let i = 0; i < count; i += 1) {
          const x = positions[i];
          state.civilians.push({
            x,
            y: terrainHeightAt(x) - 14,
            state: "ground",
            vy: 0,
            carrierId: null,
            dir: Math.random() > 0.5 ? 1 : -1,
            step: Math.random() * Math.PI * 2,
          });
        }
      }

      function startRun() {
        resetGame();
        state.mode = "running";
        state.introTimer = 5;
        menuOverlay.classList.add("hidden");
      }

      function worldToScreen(x) {
        return x - state.cameraX;
      }

      function wrapX(x) {
        let value = x;
        while (value < 0) value += worldWidth;
        while (value >= worldWidth) value -= worldWidth;
        return value;
      }

      function signedWrapDistance(from, to) {
        let delta = wrapX(to) - wrapX(from);
        if (delta > worldWidth * 0.5) delta -= worldWidth;
        if (delta < -worldWidth * 0.5) delta += worldWidth;
        return delta;
      }

      function nearestWorldX(target, anchor) {
        return anchor + signedWrapDistance(anchor, target);
      }

      function spawnEnemy() {
        const player = state.player;
        const side = Math.random() > 0.5 ? 1 : -1;
        const type = state.wave >= 2 && Math.random() > 0.56 ? "hunter" : "abductor";
        const spawnX = wrapX(player.x + side * (440 + Math.random() * 170));
        const y = type === "hunter" ? 170 + Math.random() * 90 : 115 + Math.random() * 70;
        state.enemies.push({
          id: `${performance.now()}-${Math.random()}`,
          type,
          x: spawnX,
          y,
          vx: type === "hunter" ? side * -70 : side * -84,
          vy: 0,
          targetCivilian: null,
          targetTimer: 0,
          carrying: null,
          fireClock: 1 + Math.random() * 0.8,
          pulse: Math.random() * Math.PI * 2,
          hp: type === "hunter" ? 2 : 1,
          dead: false,
        });
      }

      function fireBullet() {
        const player = state.player;
        if (player.cooldown > 0 || state.mode !== "running") return;
        player.cooldown = 0.16;
        const speed = 420;
        state.bullets.push({
          x: player.x + player.dir * 22,
          y: player.y,
          vx: player.dir * speed,
          vy: 0,
          friendly: true,
          ttl: 1.6,
        });
        spawnBurst(player.x + player.dir * 18, player.y, "#a2e0ff", 5, 30, 110);
      }

      function useBomb() {
        if (state.mode !== "running" || state.bombs <= 0) return;
        state.bombs -= 1;
        state.flash = 0.8;
        state.shake = 1;
        state.message = "Smart bomb fired. Use the clear lane to scoop survivors.";
        let removed = 0;
        for (const enemy of state.enemies) {
          enemy.dead = true;
          removed += 1;
          if (enemy.carrying) {
            dropCivilian(enemy.carrying, enemy.x, enemy.y, true);
          }
          spawnBurst(enemy.x, enemy.y, enemy.type === "hunter" ? "#ff7373" : "#ffd86b", 14, 40, 170);
        }
        state.score += removed * 140;
      }

      function dropCivilian(civilian, x, y, safeDrop) {
        civilian.state = safeDrop ? "falling" : "lost";
        civilian.x = wrapX(x);
        civilian.y = y;
        civilian.vy = safeDrop ? 35 : 0;
        civilian.carrierId = null;
      }

      function findNearestGroundCivilian(enemyX) {
        let best = null;
        let bestDist = Infinity;
        for (const civilian of state.civilians) {
          if (civilian.state !== "ground") continue;
          const dist = Math.abs(signedWrapDistance(enemyX, civilian.x));
          if (dist < bestDist) {
            bestDist = dist;
            best = civilian;
          }
        }
        return best;
      }

      function update(dt) {
        state.flash = Math.max(0, state.flash - dt * 2.8);
        state.shake = Math.max(0, state.shake - dt * 3.8);
        state.citadelPulse = Math.max(0, state.citadelPulse - dt * 1.4);
        state.introTimer = Math.max(0, state.introTimer - dt);

        if (state.mode !== "running") {
          updateParticles(dt);
          updateRescueText(dt);
          return;
        }

        const player = state.player;
        player.cooldown = Math.max(0, player.cooldown - dt);
        player.rescueCooldown = Math.max(0, player.rescueCooldown - dt);
        player.invuln = Math.max(0, player.invuln - dt);

        const left = keys.has("ArrowLeft") || keys.has("KeyA");
        const right = keys.has("ArrowRight") || keys.has("KeyD");
        const up = keys.has("ArrowUp") || keys.has("KeyW");
        const down = keys.has("ArrowDown") || keys.has("KeyS");
        const shoot = keys.has("Space") || keys.has("KeyJ");

        const ax = (right ? 1 : 0) - (left ? 1 : 0);
        const ay = (down ? 1 : 0) - (up ? 1 : 0);
        player.vx += ax * 350 * dt;
        player.vy += ay * 340 * dt;
        player.vx *= 0.985;
        player.vy *= 0.985;
        player.vx = clamp(player.vx, -250, 250);
        player.vy = clamp(player.vy, -230, 230);
        player.x = wrapX(player.x + player.vx * dt);
        player.y = clamp(player.y + player.vy * dt, 70, 500);
        if (ax !== 0) player.dir = ax;
        player.thrust = Math.max(Math.abs(ax), Math.abs(ay));

        const floor = terrainHeightAt(player.x) - 26;
        if (player.y > floor) {
          player.y = floor;
          player.vy = Math.min(0, player.vy * -0.25);
        }

        if (shoot && !player.shootHeld) fireBullet();
        player.shootHeld = shoot;

        state.cameraX = player.x - canvas.width * 0.34;

        state.spawnClock -= dt;
        if (state.spawnBudget > 0 && state.spawnClock <= 0) {
          spawnEnemy();
          state.spawnBudget -= 1;
          state.spawnClock = Math.max(0.45, 1.15 - state.wave * 0.12) + Math.random() * 0.35;
        }

        updateBullets(dt);
        updateCivilians(dt);
        updateEnemies(dt);
        handlePlayerContacts();
        updateParticles(dt);
        updateRescueText(dt);
        cleanupState();
        checkWaveFlow();
      }

      function updateBullets(dt) {
        for (const bullet of state.bullets) {
          bullet.x = wrapX(bullet.x + bullet.vx * dt);
          bullet.y += bullet.vy * dt;
          bullet.ttl -= dt;
        }

        for (const bullet of state.bullets) {
          if (!bullet.friendly) {
            if (distanceWrapped(bullet.x, bullet.y, state.player.x, state.player.y) < 22) {
              bullet.ttl = 0;
              hitPlayer(state.player.x, state.player.y, "Hunter round caught the cockpit. Sweep wider before the next dive.");
            }
            continue;
          }
          for (const enemy of state.enemies) {
            if (enemy.dead) continue;
            if (distanceWrapped(bullet.x, bullet.y, enemy.x, enemy.y) < 22) {
              bullet.ttl = 0;
              enemy.hp -= 1;
              spawnBurst(enemy.x, enemy.y, "#a2e0ff", 5, 20, 110);
              if (enemy.hp <= 0) {
                enemy.dead = true;
                state.score += enemy.type === "hunter" ? 180 : 120;
                if (enemy.carrying) {
                  dropCivilian(enemy.carrying, enemy.x, enemy.y, true);
                }
                state.message =
                  enemy.type === "abductor"
                    ? "Abductor broken. Catch the falling civilian before the ridge does."
                    : "Hunter down. The citadel lane is open.";
                spawnBurst(enemy.x, enemy.y, enemy.type === "hunter" ? "#ff7373" : "#ffd86b", 12, 30, 160);
              }
              break;
            }
          }
        }

        state.bullets = state.bullets.filter((bullet) => bullet.ttl > 0 && bullet.y > 40 && bullet.y < canvas.height - 10);
      }

      function updateCivilians(dt) {
        for (const civilian of state.civilians) {
          civilian.step += dt * 3;
          if (civilian.state === "ground") {
            civilian.y = terrainHeightAt(civilian.x) - 14;
          } else if (civilian.state === "falling") {
            civilian.vy += 240 * dt;
            civilian.y += civilian.vy * dt;
            const ground = terrainHeightAt(civilian.x) - 14;
            if (civilian.y >= ground) {
              civilian.y = ground;
              civilian.vy = 0;
              civilian.state = "ground";
              state.message = "Dropped survivor back on the ridge. Scoop them cleanly next pass.";
            }
          } else if (civilian.state === "carried") {
            civilian.y += Math.sin(civilian.step * 1.7) * 0.18;
          } else if (civilian.state === "rescued") {
            civilian.y -= 15 * dt;
          }
        }
      }

      function updateEnemies(dt) {
        for (const enemy of state.enemies) {
          if (enemy.dead) continue;
          enemy.pulse += dt * 5.4;
          enemy.targetTimer -= dt;

          if (enemy.type === "abductor") {
            if (!enemy.carrying) {
              if (!enemy.targetCivilian || enemy.targetCivilian.state !== "ground" || enemy.targetTimer <= 0) {
                enemy.targetCivilian = findNearestGroundCivilian(enemy.x);
                enemy.targetTimer = 1;
              }
              if (enemy.targetCivilian) {
                const dx = signedWrapDistance(enemy.x, enemy.targetCivilian.x);
                enemy.vx += Math.sign(dx) * 95 * dt;
                enemy.vx = clamp(enemy.vx, -120, 120);
                enemy.y += (enemy.targetCivilian.y - 28 - enemy.y) * dt * 1.8;
                if (Math.abs(dx) < 18 && Math.abs(enemy.y - (enemy.targetCivilian.y - 18)) < 16) {
                  enemy.carrying = enemy.targetCivilian;
                  enemy.targetCivilian.state = "carried";
                  enemy.targetCivilian.carrierId = enemy.id;
                  state.message = "Abduction underway. Break the lifter or intercept the falling survivor.";
                }
              }
            } else {
              enemy.vx *= 0.99;
              enemy.y -= 62 * dt;
              enemy.vx += Math.sign(signedWrapDistance(enemy.x, state.player.x)) * -14 * dt;
              enemy.carrying.x = enemy.x;
              enemy.carrying.y = enemy.y + 20;
              if (enemy.y < 62) {
                enemy.dead = true;
                enemy.carrying.state = "lost";
                enemy.carrying.carrierId = null;
                state.civiliansLost += 1;
                state.message = "A civilian was taken off-world. Keep abductors low to the ridge.";
                spawnBurst(enemy.x, 78, "#ff7373", 8, 24, 120);
              }
            }
          } else {
            const targetX = nearestWorldX(120, enemy.x);
            const dx = targetX - enemy.x;
            enemy.vx += Math.sign(dx) * 90 * dt;
            enemy.vx = clamp(enemy.vx, -140, 140);
            const targetY = dx < 120 ? 220 : 170;
            enemy.y += (targetY - enemy.y) * dt * 1.4;
            enemy.fireClock -= dt;
            if (enemy.fireClock <= 0 && Math.abs(dx) < 300) {
              enemy.fireClock = 1.1 + Math.random() * 0.8;
              const angle = Math.atan2(state.player.y - enemy.y, signedWrapDistance(enemy.x, state.player.x));
              state.bullets.push({
                x: enemy.x,
                y: enemy.y,
                vx: Math.cos(angle) * 240,
                vy: Math.sin(angle) * 240,
                friendly: false,
                ttl: 2.4,
              });
            }
          }

          enemy.x = wrapX(enemy.x + enemy.vx * dt);
        }
      }

      function handlePlayerContacts() {
        const player = state.player;
        for (const civilian of state.civilians) {
          if (civilian.state !== "ground" && civilian.state !== "falling") continue;
          if (player.carrier || player.rescueCooldown > 0) break;
          if (distanceWrapped(player.x, player.y, civilian.x, civilian.y) < 24) {
            player.carrier = civilian;
            civilian.state = "rescued-carry";
            player.rescueCooldown = 0.2;
            state.message = "Survivor loaded. Touch the citadel beacon at the far left.";
          }
        }

        if (player.carrier) {
          player.carrier.x = player.x - player.dir * 12;
          player.carrier.y = player.y + 18;
        }

        const atCitadel = nearestWorldX(120, player.x);
        if (player.carrier && Math.abs(atCitadel - player.x) < 34 && player.y > 118 && player.y < 252) {
          state.score += 250;
          state.rescued += 1;
          state.message = "Citadel docked. Rescue chain intact.";
          state.rescueText.push({ x: 120, y: 160, text: "+250 rescue", life: 1.1, color: "#88ffba" });
          player.carrier.state = "rescued";
          player.carrier = null;
          state.citadelPulse = 1;
        }

        for (const enemy of state.enemies) {
          if (enemy.dead) continue;
          if (distanceWrapped(player.x, player.y, enemy.x, enemy.y) < 24) {
            enemy.dead = true;
            if (enemy.carrying) {
              dropCivilian(enemy.carrying, enemy.x, enemy.y, true);
            }
            spawnBurst(enemy.x, enemy.y, "#ff7373", 10, 24, 135);
            hitPlayer(enemy.x, enemy.y, "Hull clipped an alien craft. Reset spacing before the next pass.");
          }
        }

        for (const civilian of state.civilians) {
          if (civilian.state !== "lost") continue;
          civilian.state = "gone";
        }

        if (state.citadelHealth > 0) {
          for (const enemy of state.enemies) {
            if (enemy.dead) continue;
            const dx = Math.abs(nearestWorldX(120, enemy.x) - enemy.x);
            if (enemy.type === "hunter" && dx < 32 && enemy.y > 170 && enemy.y < 270) {
              enemy.dead = true;
              state.citadelHealth -= 1;
              state.shake = 0.9;
              state.flash = 0.45;
              state.message = "Hunter struck the citadel wall. Keep the left lane clean.";
              spawnBurst(120, 208, "#ff7373", 12, 30, 150);
            }
          }
        }
      }

      function cleanupState() {
        state.enemies = state.enemies.filter((enemy) => !enemy.dead);
        state.civilians = state.civilians.filter((civilian) => !["gone", "rescued"].includes(civilian.state));
      }

      function checkWaveFlow() {
        const remainingRidge = state.civilians.filter((civilian) =>
          ["ground", "falling", "rescued-carry", "carried"].includes(civilian.state),
        );
        if (state.citadelHealth <= 0 || state.civiliansLost >= 4 || state.lives <= 0) {
          state.mode = "gameover";
          state.message = "Citadel evacuation failed. Retry fast and hold the left lane.";
          return;
        }
        if (state.spawnBudget <= 0 && state.enemies.length === 0 && remainingRidge.length === 0) {
          if (state.wave >= 3) {
            state.mode = "victory";
            state.message = `Citadel clear. Rescued ${state.rescued} civilians for ${state.score} points.`;
          } else {
            seedWave(state.wave + 1);
          }
        }
      }

      function hitPlayer(x, y, message) {
        const player = state.player;
        if (player.invuln > 0 || state.mode !== "running") return;
        player.invuln = 1;
        player.vx = -player.dir * 120;
        player.vy = -60;
        state.lives -= 1;
        state.flash = 0.6;
        state.shake = 0.8;
        state.message = message;
        if (player.carrier) {
          player.carrier.state = "falling";
          player.carrier.vy = -30;
          player.carrier = null;
        }
        spawnBurst(x, y, "#ff7373", 18, 35, 170);
      }

      function updateParticles(dt) {
        for (const particle of state.particles) {
          particle.x = wrapX(particle.x + particle.vx * dt);
          particle.y += particle.vy * dt;
          particle.life -= dt;
        }
        state.particles = state.particles.filter((particle) => particle.life > 0);
      }

      function updateRescueText(dt) {
        for (const text of state.rescueText) {
          text.y -= 22 * dt;
          text.life -= dt;
        }
        state.rescueText = state.rescueText.filter((text) => text.life > 0);
      }

      function spawnBurst(x, y, color, count, minSpeed, maxSpeed) {
        for (let i = 0; i < count; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          const speed = minSpeed + Math.random() * (maxSpeed - minSpeed);
          state.particles.push({
            x: wrapX(x),
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color,
            life: 0.28 + Math.random() * 0.45,
          });
        }
      }

      function distanceWrapped(ax, ay, bx, by) {
        const dx = signedWrapDistance(ax, bx);
        const dy = by - ay;
        return Math.hypot(dx, dy);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const shakeX = state.shake > 0 ? (Math.random() - 0.5) * 10 * state.shake : 0;
        const shakeY = state.shake > 0 ? (Math.random() - 0.5) * 10 * state.shake : 0;
        ctx.save();
        ctx.translate(shakeX, shakeY);
        drawSky();
        drawStars();
        drawSun();
        drawCitadel();
        drawTerrain();
        drawCivilians();
        drawEnemies();
        drawBullets();
        drawPlayer();
        drawParticles();
        drawHud();
        drawGoalCue();
        drawIntroCard();
        drawOverlay();
        ctx.restore();
      }

      function drawSky() {
        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, "#1f587f");
        sky.addColorStop(0.42, "#0b2741");
        sky.addColorStop(1, "#050810");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function drawStars() {
        for (let i = 0; i < 56; i += 1) {
          const x = ((i * 173) % canvas.width) + Math.sin(i * 9.1) * 18;
          const y = 30 + ((i * 47) % 240);
          ctx.fillStyle = `rgba(244, 251, 255, ${0.15 + ((i % 5) / 5) * 0.28})`;
          ctx.fillRect(x, y, 2, 2);
        }
      }

      function drawSun() {
        const x = 690;
        const y = 116;
        const glow = ctx.createRadialGradient(x, y, 12, x, y, 110);
        glow.addColorStop(0, "rgba(255, 210, 117, 0.95)");
        glow.addColorStop(0.32, "rgba(255, 210, 117, 0.32)");
        glow.addColorStop(1, "rgba(255, 210, 117, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(x - 120, y - 120, 240, 240);
      }

      function drawCitadel() {
        const baseX = worldToScreen(nearestWorldX(120, state.player.x));
        ctx.save();
        ctx.translate(baseX, 0);
        ctx.fillStyle = "rgba(128, 215, 255, 0.16)";
        ctx.beginPath();
        ctx.arc(0, 202, 56 + state.citadelPulse * 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#19324f";
        ctx.fillRect(-18, 176, 36, 88);
        ctx.fillStyle = "#274d78";
        ctx.beginPath();
        ctx.moveTo(-42, 262);
        ctx.lineTo(0, 140);
        ctx.lineTo(42, 262);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#a2e0ff";
        ctx.fillRect(-5, 152, 10, 36);
        ctx.fillStyle = "#88ffba";
        ctx.fillRect(-2, 154, 4, 30);
        ctx.restore();
      }

      function drawTerrain() {
        ctx.beginPath();
        const first = terrain[0];
        ctx.moveTo(worldToScreen(nearestWorldX(first.x, state.player.x)), canvas.height);
        for (const point of terrain) {
          const x = worldToScreen(nearestWorldX(point.x, state.player.x));
          ctx.lineTo(x, point.y);
        }
        const wrapPoint = terrain[0];
        ctx.lineTo(worldToScreen(nearestWorldX(wrapPoint.x + worldWidth, state.player.x)), wrapPoint.y);
        ctx.lineTo(worldToScreen(nearestWorldX(wrapPoint.x + worldWidth, state.player.x)), canvas.height);
        ctx.closePath();
        const fill = ctx.createLinearGradient(0, 360, 0, 600);
        fill.addColorStop(0, "#162a1a");
        fill.addColorStop(0.55, "#0d160f");
        fill.addColorStop(1, "#050708");
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.strokeStyle = "#9adf78";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      function drawCivilians() {
        for (const civilian of state.civilians) {
          if (civilian.state === "gone") continue;
          const x = worldToScreen(nearestWorldX(civilian.x, state.player.x));
          ctx.save();
          ctx.translate(x, civilian.y);
          ctx.fillStyle = civilian.state === "rescued-carry" ? "#88ffba" : "#f4fbff";
          ctx.fillRect(-4, -8, 8, 12);
          ctx.fillStyle = "#ffd86b";
          ctx.beginPath();
          ctx.arc(0, -12, 4, 0, Math.PI * 2);
          ctx.fill();
          if (civilian.state === "ground") {
            ctx.strokeStyle = "rgba(255, 216, 107, 0.6)";
            ctx.beginPath();
            ctx.moveTo(-8, 10);
            ctx.lineTo(8, 10);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function drawEnemies() {
        for (const enemy of state.enemies) {
          const x = worldToScreen(nearestWorldX(enemy.x, state.player.x));
          ctx.save();
          ctx.translate(x, enemy.y);
          if (enemy.type === "abductor") {
            ctx.strokeStyle = "#ffd86b";
            ctx.lineWidth = 2.3;
            ctx.beginPath();
            ctx.moveTo(-18, 0);
            ctx.lineTo(0, -10);
            ctx.lineTo(18, 0);
            ctx.lineTo(0, 10);
            ctx.closePath();
            ctx.stroke();
            if (enemy.carrying) {
              ctx.strokeStyle = `rgba(255, 216, 107, ${0.3 + (Math.sin(enemy.pulse) * 0.5 + 0.5) * 0.4})`;
              ctx.beginPath();
              ctx.moveTo(0, 8);
              ctx.lineTo(0, 26);
              ctx.stroke();
            }
          } else {
            ctx.strokeStyle = "#ff7373";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(0, 0, 12, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-16, -7);
            ctx.lineTo(16, 7);
            ctx.moveTo(-16, 7);
            ctx.lineTo(16, -7);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function drawBullets() {
        for (const bullet of state.bullets) {
          const x = worldToScreen(nearestWorldX(bullet.x, state.player.x));
          ctx.fillStyle = bullet.friendly ? "#a2e0ff" : "#ff7373";
          ctx.fillRect(x - 3, bullet.y - 2, 6, 4);
        }
      }

      function drawPlayer() {
        const player = state.player;
        const x = worldToScreen(player.x);
        ctx.save();
        ctx.translate(x, player.y);
        if (player.invuln > 0) {
          ctx.globalAlpha = 0.45 + Math.sin(player.invuln * 28) * 0.2;
        }
        ctx.strokeStyle = "#f4fbff";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(player.dir * 18, 0);
        ctx.lineTo(-player.dir * 16, -11);
        ctx.lineTo(-player.dir * 8, 0);
        ctx.lineTo(-player.dir * 16, 11);
        ctx.closePath();
        ctx.stroke();
        ctx.strokeStyle = "#7be8ff";
        ctx.beginPath();
        ctx.moveTo(-player.dir * 20, -6);
        ctx.lineTo(-player.dir * 30, 0);
        ctx.lineTo(-player.dir * 20, 6);
        ctx.stroke();
        if (player.thrust > 0.1) {
          ctx.strokeStyle = "#ffd86b";
          ctx.beginPath();
          ctx.moveTo(-player.dir * 22, 0);
          ctx.lineTo(-player.dir * (28 + Math.random() * 8), 0);
          ctx.stroke();
        }
        ctx.restore();
        ctx.globalAlpha = 1;
      }

      function drawParticles() {
        for (const particle of state.particles) {
          const x = worldToScreen(nearestWorldX(particle.x, state.player.x));
          ctx.globalAlpha = Math.max(0, particle.life * 1.8);
          ctx.fillStyle = particle.color;
          ctx.fillRect(x, particle.y, 2.5, 2.5);
        }
        ctx.globalAlpha = 1;

        for (const text of state.rescueText) {
          const x = worldToScreen(nearestWorldX(text.x, state.player.x));
          ctx.globalAlpha = Math.max(0, text.life);
          ctx.fillStyle = text.color;
          ctx.font = "700 16px Trebuchet MS";
          ctx.fillText(text.text, x - 22, text.y);
        }
        ctx.globalAlpha = 1;
      }

      function drawHud() {
        ctx.fillStyle = "rgba(6, 13, 28, 0.82)";
        ctx.fillRect(18, 16, 262, 88);
        ctx.fillRect(canvas.width - 290, 16, 272, 88);
        ctx.fillStyle = "#f4fbff";
        ctx.font = "700 24px Trebuchet MS";
        ctx.fillText(`Score ${state.score}`, 34, 46);
        ctx.font = "600 16px Trebuchet MS";
        ctx.fillStyle = "#7be8ff";
        ctx.fillText(`Wave ${state.wave} / 3`, 34, 70);
        ctx.fillStyle = "#88ffba";
        ctx.fillText(`Rescued ${state.rescued}`, 120, 70);
        ctx.fillStyle = "#ff7373";
        ctx.fillText(`Lives ${Math.max(0, state.lives)}`, 34, 92);

        ctx.fillStyle = "#f4fbff";
        ctx.font = "700 22px Trebuchet MS";
        ctx.fillText(`Bombs ${state.bombs}`, canvas.width - 268, 46);
        ctx.font = "600 14px Trebuchet MS";
        ctx.fillStyle = "#ffd86b";
        ctx.fillText(`Citadel ${Math.max(0, state.citadelHealth)} / 8`, canvas.width - 268, 68);
        ctx.fillText(`Lost ${state.civiliansLost} / 4`, canvas.width - 268, 88);

        ctx.fillStyle = "rgba(244, 251, 255, 0.92)";
        ctx.font = "600 14px Trebuchet MS";
        ctx.fillText(state.message, 24, canvas.height - 22);
      }

      function drawGoalCue() {
        if (state.mode !== "running") return;

        const player = state.player;
        const cueTarget = player.carrier
          ? {
              worldX: 120,
              y: 152,
              color: "#88ffba",
              label: "Return survivor",
            }
          : state.enemies.some((enemy) => !enemy.dead && enemy.type === "hunter")
            ? {
                worldX: 120,
                y: 208,
                color: "#ff7373",
                label: "Protect citadel",
              }
            : null;

        if (!cueTarget) return;

        const targetX = nearestWorldX(cueTarget.worldX, player.x);
        const screenX = worldToScreen(targetX);
        if (screenX >= 56 && screenX <= canvas.width - 56) return;

        const placeLeft = screenX < canvas.width * 0.5;
        const cueX = placeLeft ? 40 : canvas.width - 40;
        const tipX = placeLeft ? cueX - 14 : cueX + 14;

        ctx.save();
        ctx.translate(cueX, cueTarget.y);
        ctx.fillStyle = cueTarget.color;
        ctx.beginPath();
        if (placeLeft) {
          ctx.moveTo(tipX, 0);
          ctx.lineTo(cueX + 8 - cueX, -12);
          ctx.lineTo(cueX + 8 - cueX, 12);
        } else {
          ctx.moveTo(tipX, 0);
          ctx.lineTo(cueX - 8 - cueX, -12);
          ctx.lineTo(cueX - 8 - cueX, 12);
        }
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "rgba(6, 13, 28, 0.82)";
        const panelX = placeLeft ? 14 : -128;
        ctx.fillRect(panelX, -18, 114, 36);
        ctx.strokeStyle = "rgba(162, 224, 255, 0.2)";
        ctx.strokeRect(panelX, -18, 114, 36);
        ctx.fillStyle = cueTarget.color;
        ctx.font = "700 13px Trebuchet MS";
        ctx.fillText(cueTarget.label, panelX + 10, 5);
        ctx.restore();
      }

      function drawIntroCard() {
        if (state.mode !== "running" || state.introTimer <= 0) return;
        const alpha = Math.min(1, state.introTimer / 0.4);
        const cardWidth = 432;
        const cardHeight = 68;
        const cardX = (canvas.width - cardWidth) * 0.5;
        const cardY = 108;
        ctx.save();
        ctx.globalAlpha = Math.min(0.94, alpha);
        ctx.fillStyle = "rgba(6, 13, 28, 0.8)";
        ctx.fillRect(cardX, cardY, cardWidth, cardHeight);
        ctx.strokeStyle = "rgba(162, 224, 255, 0.28)";
        ctx.strokeRect(cardX, cardY, cardWidth, cardHeight);
        ctx.fillStyle = "#f4fbff";
        ctx.font = "700 16px Trebuchet MS";
        ctx.fillText("Fly low. Break abductors early. Return survivors to the left beacon.", cardX + 18, cardY + 27);
        ctx.fillStyle = "#ffd86b";
        ctx.font = "600 14px Trebuchet MS";
        ctx.fillText("Move WASD/arrows   Fire Space/J   Bomb X/Shift   Retry R", cardX + 18, cardY + 50);
        ctx.restore();
      }

      function drawOverlay() {
        if (state.flash > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${state.flash * 0.18})`;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        if (state.mode === "running") return;
        ctx.fillStyle = "rgba(3, 7, 13, 0.72)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = "center";
        ctx.fillStyle = "#f4fbff";
        ctx.font = "700 42px Trebuchet MS";
        const title =
          state.mode === "title"
            ? "Defender Citadel Rescue"
            : state.mode === "victory"
              ? "Citadel Secure"
              : "Evacuation Lost";
        ctx.fillText(title, canvas.width * 0.5, 164);

        ctx.font = "600 21px Trebuchet MS";
        ctx.fillStyle = "#7be8ff";
        const subtitle =
          state.mode === "title"
            ? "Low-sweep the ridge, break abductors early, and ferry civilians into the left citadel."
            : `Score ${state.score}  |  Rescued ${state.rescued}  |  Wave ${state.wave} / 3`;
        ctx.fillText(subtitle, canvas.width * 0.5, 204);

        ctx.font = "600 18px Trebuchet MS";
        ctx.fillStyle = "#ffd86b";
        ctx.fillText("Move: WASD or arrows  |  Fire: Space or J  |  Smart bomb: X or Shift", canvas.width * 0.5, 264);
        ctx.fillText("Fly through survivors to load them. Touch the beacon tower to bank the rescue.", canvas.width * 0.5, 298);
        ctx.fillStyle = "#88ffba";
        ctx.fillText("Press Enter, Space, arrows, or click canvas to launch. Press R for instant retry.", canvas.width * 0.5, 336);
        ctx.textAlign = "left";
      }

      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.033, (now - last) / 1000);
        last = now;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      function maybeStartFromGameplayInput(code) {
        if (state.mode === "running") return false;
        if (
          [
            "Enter",
            "Space",
            "KeyJ",
            "KeyX",
            "ShiftLeft",
            "ShiftRight",
            "ArrowLeft",
            "ArrowRight",
            "ArrowUp",
            "ArrowDown",
            "KeyA",
            "KeyD",
            "KeyW",
            "KeyS",
          ].includes(code)
        ) {
          startRun();
          return true;
        }
        return false;
      }

      window.addEventListener("keydown", (event) => {
        if (
          ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space", "ShiftLeft", "ShiftRight"].includes(event.code)
        ) {
          event.preventDefault();
        }
        const started = maybeStartFromGameplayInput(event.code);
        keys.add(event.code);
        if (event.code === "KeyR") startRun();
        if (!started && (event.code === "KeyX" || event.code === "ShiftLeft" || event.code === "ShiftRight")) useBomb();
      });

      window.addEventListener("keyup", (event) => {
        keys.delete(event.code);
      });

      startButton.addEventListener("click", startRun);
      canvas.addEventListener("pointerdown", () => {
        if (state.mode !== "running") startRun();
      });

      menuOverlay.classList.remove("hidden");
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
