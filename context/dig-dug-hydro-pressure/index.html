<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dig Dug: Hydro-Pressure</title>
  <style>
    :root {
      --bg-0: #041217;
      --bg-1: #0a2630;
      --bg-2: #11414e;
      --panel: rgba(5, 15, 21, 0.8);
      --line: rgba(155, 227, 255, 0.18);
      --ink: #effcff;
      --muted: #9bc6d5;
      --sand-0: #3c2312;
      --sand-1: #5e3a1a;
      --sand-2: #9b672f;
      --water: #56d7ff;
      --danger: #ff8b5f;
      --ok: #8fff9b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(122, 226, 255, 0.12), transparent 26%),
        radial-gradient(circle at 20% 10%, rgba(255, 192, 120, 0.12), transparent 22%),
        linear-gradient(180deg, var(--bg-2), var(--bg-0) 68%);
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .shell::before,
    .shell::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(70px);
      opacity: 0.45;
      pointer-events: none;
    }

    .shell::before {
      width: 30vw;
      height: 30vw;
      left: -8vw;
      top: -8vh;
      background: rgba(99, 220, 255, 0.18);
    }

    .shell::after {
      width: 28vw;
      height: 28vw;
      right: -8vw;
      bottom: -8vh;
      background: rgba(255, 170, 84, 0.16);
    }

    .stage {
      position: relative;
      padding: 18px;
    }

    canvas {
      display: block;
      width: min(1280px, 96vw);
      height: auto;
      aspect-ratio: 16 / 9;
      border-radius: 22px;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at top, rgba(85, 194, 255, 0.09), transparent 30%),
        linear-gradient(180deg, rgba(8, 22, 30, 0.94), rgba(7, 18, 28, 0.98));
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .caption {
      position: absolute;
      top: 28px;
      left: 28px;
      max-width: min(420px, calc(100vw - 60px));
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.32);
      pointer-events: none;
    }

    .caption h1 {
      margin: 0 0 6px;
      font-size: 16px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .caption p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="stage">
      <canvas id="game" width="1280" height="720" aria-label="Dig Dug Hydro-Pressure game canvas"></canvas>
      <aside class="caption">
        <h1>Dig Dug: Hydro-Pressure</h1>
        <p>Arrow keys or WASD move and dig. Tap Space near blue pocket to rupture it. Water floods tunnels, erases enemies, and can trap you too.</p>
      </aside>
    </section>
  </main>
  <script type="module">
    (() => {
      "use strict";

      const CONFIG = Object.freeze({
        width: 1280,
        height: 720,
        cols: 30,
        rows: 18,
        tile: 40,
        hudHeight: 72,
        step: 1 / 60,
        maxFrame: 0.05,
        digRadius: 16,
        playerRadius: 15,
        enemyRadius: 14,
        playerSpeed: 168,
        enemySpeed: 88,
        carrySpeed: 84,
        floodTick: 0.08,
        floodDecay: 0.015,
        floodKill: 0.72,
        floodDanger: 0.34,
        floodMax: 1,
        playerBreathMax: 2.2,
        enemyBreathMax: 1.1
      });

      const STATES = Object.freeze({
        MENU: "MENU",
        PLAYING: "PLAYING",
        WIN: "WIN",
        LOSE: "LOSE"
      });

      const ASSET_MANIFEST = Object.freeze({
        attribution: "Kenney.nl public domain art and audio. Put files in local assets/kenney folders.",
        images: {
          player: {
            path: "./assets/kenney/images/player.png",
            source: "Kenney character sprite, transparent PNG"
          },
          enemy: {
            path: "./assets/kenney/images/enemy.png",
            source: "Kenney enemy sprite, transparent PNG"
          },
          pocket: {
            path: "./assets/kenney/images/water-pocket.png",
            source: "Kenney fluid or tile sprite, transparent PNG"
          },
          dirt: {
            path: "./assets/kenney/images/dirt-tile.png",
            source: "Kenney ground tile, transparent PNG"
          }
        },
        audio: {
          dig: {
            path: "./assets/kenney/audio/dig.ogg",
            source: "Kenney impact/mining style SFX"
          },
          burst: {
            path: "./assets/kenney/audio/burst.ogg",
            source: "Kenney water or impact burst SFX"
          },
          wash: {
            path: "./assets/kenney/audio/wash.ogg",
            source: "Kenney loop or splash SFX"
          },
          hit: {
            path: "./assets/kenney/audio/hit.ogg",
            source: "Kenney hit SFX"
          },
          win: {
            path: "./assets/kenney/audio/win.ogg",
            source: "Kenney jingle"
          },
          lose: {
            path: "./assets/kenney/audio/lose.ogg",
            source: "Kenney fail jingle"
          }
        }
      });

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = true;

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const lerp = (a, b, t) => a + (b - a) * t;
      const rand = (min, max) => min + Math.random() * (max - min);
      const pick = (items) => items[(Math.random() * items.length) | 0];
      const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

      const Input = (() => {
        const held = new Set();
        const pressed = new Set();
        const keyMap = {
          ArrowUp: "up",
          KeyW: "up",
          ArrowDown: "down",
          KeyS: "down",
          ArrowLeft: "left",
          KeyA: "left",
          ArrowRight: "right",
          KeyD: "right",
          Space: "action",
          Enter: "start"
        };

        window.addEventListener("keydown", (event) => {
          const code = keyMap[event.code];
          if (!code) {
            return;
          }
          event.preventDefault();
          if (!held.has(code)) {
            pressed.add(code);
          }
          held.add(code);
        });

        window.addEventListener("keyup", (event) => {
          const code = keyMap[event.code];
          if (!code) {
            return;
          }
          event.preventDefault();
          held.delete(code);
        });

        return {
          down: (key) => held.has(key),
          tap: (key) => pressed.has(key),
          endFrame: () => pressed.clear()
        };
      })();

      class AssetLoader {
        constructor(manifest) {
          this.manifest = manifest;
          this.images = new Map();
          this.audio = new Map();
          this.summary = { total: 0, loaded: 0, failed: 0 };
        }

        load() {
          const jobs = [];
          for (const [key, entry] of Object.entries(this.manifest.images)) {
            this.summary.total += 1;
            jobs.push(this.loadImage(key, entry.path));
          }
          for (const [key, entry] of Object.entries(this.manifest.audio)) {
            this.summary.total += 1;
            jobs.push(this.loadAudio(key, entry.path));
          }
          return Promise.allSettled(jobs);
        }

        loadImage(key, path) {
          return new Promise((resolve) => {
            const image = new Image();
            image.onload = () => {
              this.images.set(key, image);
              this.summary.loaded += 1;
              resolve(image);
            };
            image.onerror = () => {
              this.summary.failed += 1;
              resolve(null);
            };
            image.src = path;
          });
        }

        loadAudio(key, path) {
          return new Promise((resolve) => {
            const audio = new Audio();
            let settled = false;
            const done = (ok) => {
              if (settled) {
                return;
              }
              settled = true;
              audio.removeEventListener("canplaythrough", onReady);
              audio.removeEventListener("error", onError);
              if (ok) {
                this.audio.set(key, audio);
                this.summary.loaded += 1;
              } else {
                this.summary.failed += 1;
              }
              resolve(ok ? audio : null);
            };
            const onReady = () => done(true);
            const onError = () => done(false);
            audio.preload = "auto";
            audio.addEventListener("canplaythrough", onReady, { once: true });
            audio.addEventListener("error", onError, { once: true });
            audio.src = path;
            audio.load();
            window.setTimeout(() => done(false), 800);
          });
        }
      }

      class AudioSystem {
        constructor(loader) {
          this.loader = loader;
          this.ctx = null;
          this.master = null;
        }

        unlock() {
          if (this.ctx) {
            return;
          }
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) {
            return;
          }
          this.ctx = new AudioCtx();
          this.master = this.ctx.createGain();
          this.master.gain.value = 0.14;
          this.master.connect(this.ctx.destination);
        }

        play(name, opts = {}) {
          const audio = this.loader.audio.get(name);
          if (audio) {
            const clone = audio.cloneNode();
            clone.volume = opts.volume ?? 0.4;
            clone.play().catch(() => {});
            return;
          }
          this.synth(name, opts);
        }

        synth(name, opts) {
          if (!this.ctx || !this.master) {
            return;
          }
          const now = this.ctx.currentTime;
          const gain = this.ctx.createGain();
          gain.connect(this.master);
          const osc = this.ctx.createOscillator();
          osc.connect(gain);
          const volume = opts.volume ?? 0.5;
          if (name === "dig") {
            osc.type = "square";
            osc.frequency.setValueAtTime(240, now);
            osc.frequency.exponentialRampToValueAtTime(110, now + 0.08);
            gain.gain.setValueAtTime(volume * 0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
            osc.start(now);
            osc.stop(now + 0.09);
            return;
          }
          if (name === "burst" || name === "wash") {
            const noise = this.ctx.createBufferSource();
            const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.18, this.ctx.sampleRate);
            const channel = buffer.getChannelData(0);
            for (let i = 0; i < channel.length; i += 1) {
              channel[i] = (Math.random() * 2 - 1) * (1 - i / channel.length);
            }
            const filter = this.ctx.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.value = name === "burst" ? 980 : 620;
            noise.buffer = buffer;
            noise.connect(filter);
            filter.connect(gain);
            gain.gain.setValueAtTime(volume * (name === "burst" ? 0.22 : 0.1), now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + (name === "burst" ? 0.24 : 0.18));
            noise.start(now);
            noise.stop(now + 0.25);
            return;
          }
          osc.type = name === "win" ? "triangle" : "sawtooth";
          const a = name === "win" ? 392 : 220;
          const b = name === "win" ? 587 : 110;
          osc.frequency.setValueAtTime(a, now);
          osc.frequency.exponentialRampToValueAtTime(b, now + 0.4);
          gain.gain.setValueAtTime(volume * 0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
          osc.start(now);
          osc.stop(now + 0.43);
        }
      }

      class ParticleSystem {
        constructor() {
          this.items = [];
        }

        emit(x, y, config) {
          const count = config.count ?? 8;
          for (let i = 0; i < count; i += 1) {
            const angle = rand(0, Math.PI * 2);
            const speed = rand(config.speedMin ?? 20, config.speedMax ?? 120);
            this.items.push({
              x,
              y,
              vx: Math.cos(angle) * speed + (config.vx ?? 0),
              vy: Math.sin(angle) * speed + (config.vy ?? 0),
              life: rand(config.lifeMin ?? 0.25, config.lifeMax ?? 0.7),
              age: 0,
              size: rand(config.sizeMin ?? 2, config.sizeMax ?? 6),
              color: config.color ?? "#ffffff",
              gravity: config.gravity ?? 0,
              alpha: config.alpha ?? 1
            });
          }
        }

        update(dt) {
          this.items = this.items.filter((item) => {
            item.age += dt;
            if (item.age >= item.life) {
              return false;
            }
            item.vy += item.gravity * dt;
            item.x += item.vx * dt;
            item.y += item.vy * dt;
            return true;
          });
        }

        draw(ctx) {
          for (const item of this.items) {
            const t = 1 - item.age / item.life;
            ctx.globalAlpha = item.alpha * t;
            ctx.fillStyle = item.color;
            ctx.beginPath();
            ctx.arc(item.x, item.y, item.size * (0.6 + t * 0.4), 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }
      }

      class Grid {
        constructor() {
          this.cols = CONFIG.cols;
          this.rows = CONFIG.rows;
          this.tile = CONFIG.tile;
          this.solid = [];
          this.pockets = [];
          this.water = [];
          this.temp = [];
          this.flowTimer = 0;
          this.init();
        }

        init() {
          this.solid = new Array(this.cols * this.rows).fill(true);
          this.water = new Array(this.cols * this.rows).fill(0);
          this.temp = new Array(this.cols * this.rows).fill(0);
          this.pockets = [];
          this.carveRoom(2, 1, 4, 3);
          this.carveHorizontal(3, 6, 18);
          this.carveHorizontal(9, 5, 22);
          this.carveHorizontal(13, 4, 21);
          this.carveVertical(6, 2, 14);
          this.carveVertical(12, 6, 13);
          this.carveVertical(18, 5, 15);
          this.carveVertical(24, 3, 14);
          this.addPocket(8, 8, "left");
          this.addPocket(16, 4, "down");
          this.addPocket(23, 11, "left");
          this.addPocket(26, 6, "down");
        }

        index(col, row) {
          return row * this.cols + col;
        }

        inBounds(col, row) {
          return col >= 0 && row >= 0 && col < this.cols && row < this.rows;
        }

        cellAtPixel(x, y) {
          return {
            col: clamp(Math.floor(x / this.tile), 0, this.cols - 1),
            row: clamp(Math.floor((y - CONFIG.hudHeight) / this.tile), 0, this.rows - 1)
          };
        }

        centerOf(col, row) {
          return {
            x: col * this.tile + this.tile * 0.5,
            y: CONFIG.hudHeight + row * this.tile + this.tile * 0.5
          };
        }

        carveRoom(col, row, width, height) {
          for (let y = row; y < row + height; y += 1) {
            for (let x = col; x < col + width; x += 1) {
              if (this.inBounds(x, y)) {
                this.solid[this.index(x, y)] = false;
              }
            }
          }
        }

        carveHorizontal(row, colA, colB) {
          for (let col = Math.min(colA, colB); col <= Math.max(colA, colB); col += 1) {
            if (this.inBounds(col, row)) {
              this.solid[this.index(col, row)] = false;
            }
          }
        }

        carveVertical(col, rowA, rowB) {
          for (let row = Math.min(rowA, rowB); row <= Math.max(rowA, rowB); row += 1) {
            if (this.inBounds(col, row)) {
              this.solid[this.index(col, row)] = false;
            }
          }
        }

        addPocket(col, row, vent) {
          if (!this.inBounds(col, row)) {
            return;
          }
          this.solid[this.index(col, row)] = true;
          this.pockets.push({
            col,
            row,
            vent,
            ruptured: false,
            pressure: 1
          });
        }

        isPocket(col, row) {
          return this.pockets.find((pocket) => pocket.col === col && pocket.row === row) ?? null;
        }

        isSolid(col, row) {
          if (!this.inBounds(col, row)) {
            return true;
          }
          return this.solid[this.index(col, row)];
        }

        isTunnel(col, row) {
          return this.inBounds(col, row) && !this.solid[this.index(col, row)];
        }

        digAt(x, y, radius, particles) {
          const minCol = clamp(Math.floor((x - radius) / this.tile), 0, this.cols - 1);
          const maxCol = clamp(Math.floor((x + radius) / this.tile), 0, this.cols - 1);
          const minRow = clamp(Math.floor((y - CONFIG.hudHeight - radius) / this.tile), 0, this.rows - 1);
          const maxRow = clamp(Math.floor((y - CONFIG.hudHeight + radius) / this.tile), 0, this.rows - 1);
          let changed = false;
          for (let row = minRow; row <= maxRow; row += 1) {
            for (let col = minCol; col <= maxCol; col += 1) {
              const pocket = this.isPocket(col, row);
              if (pocket) {
                continue;
              }
              const center = this.centerOf(col, row);
              if (dist(x, y, center.x, center.y) <= radius + this.tile * 0.3 && this.isSolid(col, row)) {
                this.solid[this.index(col, row)] = false;
                changed = true;
                particles.emit(center.x, center.y, {
                  count: 4,
                  speedMin: 10,
                  speedMax: 70,
                  sizeMin: 2,
                  sizeMax: 5,
                  color: "#c98d45",
                  gravity: 110
                });
              }
            }
          }
          return changed;
        }

        ruptureNearby(x, y) {
          let best = null;
          for (const pocket of this.pockets) {
            if (pocket.ruptured) {
              continue;
            }
            const center = this.centerOf(pocket.col, pocket.row);
            const d = dist(x, y, center.x, center.y);
            if (d > this.tile * 1.1) {
              continue;
            }
            if (!best || d < best.distance) {
              best = { pocket, distance: d };
            }
          }
          if (!best) {
            return null;
          }
          best.pocket.ruptured = true;
          this.solid[this.index(best.pocket.col, best.pocket.row)] = false;
          return best.pocket;
        }

        ventTarget(pocket) {
          const offsets = {
            left: [-1, 0],
            right: [1, 0],
            up: [0, -1],
            down: [0, 1]
          };
          const [dx, dy] = offsets[pocket.vent] ?? [0, 1];
          return { col: pocket.col + dx, row: pocket.row + dy };
        }

        updateWater(dt) {
          this.flowTimer += dt;
          if (this.flowTimer < CONFIG.floodTick) {
            return;
          }
          this.flowTimer = 0;

          this.temp.fill(0);
          for (let row = 0; row < this.rows; row += 1) {
            for (let col = 0; col < this.cols; col += 1) {
              const idx = this.index(col, row);
              if (this.isSolid(col, row)) {
                continue;
              }
              let amount = this.water[idx];
              amount = Math.max(0, amount - CONFIG.floodDecay);
              if (amount <= 0.001) {
                continue;
              }

              const targets = [];
              const down = { col, row: row + 1, weight: 0.46 };
              const left = { col: col - 1, row, weight: 0.18 };
              const right = { col: col + 1, row, weight: 0.18 };
              const up = { col, row: row - 1, weight: 0.08 };
              for (const target of [down, left, right, up]) {
                if (this.isTunnel(target.col, target.row)) {
                  targets.push(target);
                }
              }

              if (!targets.length) {
                this.temp[idx] = clamp(this.temp[idx] + amount, 0, CONFIG.floodMax);
                continue;
              }

              let stay = amount * 0.28;
              let moved = 0;
              for (const target of targets) {
                const share = amount * target.weight;
                moved += share;
                this.temp[this.index(target.col, target.row)] = clamp(
                  this.temp[this.index(target.col, target.row)] + share,
                  0,
                  CONFIG.floodMax
                );
              }
              this.temp[idx] = clamp(this.temp[idx] + Math.max(stay, amount - moved), 0, CONFIG.floodMax);
            }
          }

          for (const pocket of this.pockets) {
            if (!pocket.ruptured) {
              continue;
            }
            const mouth = this.ventTarget(pocket);
            if (this.isTunnel(mouth.col, mouth.row)) {
              const idx = this.index(mouth.col, mouth.row);
              this.temp[idx] = clamp(this.temp[idx] + 0.8 * pocket.pressure, 0, CONFIG.floodMax);
            }
            const own = this.index(pocket.col, pocket.row);
            this.temp[own] = clamp(this.temp[own] + 1, 0, CONFIG.floodMax);
          }

          const swap = this.water;
          this.water = this.temp;
          this.temp = swap;
        }

        waterAtPixel(x, y) {
          const { col, row } = this.cellAtPixel(x, y);
          return this.water[this.index(col, row)] ?? 0;
        }

        flowVectorAt(x, y) {
          const { col, row } = this.cellAtPixel(x, y);
          const center = this.water[this.index(col, row)] ?? 0;
          const left = this.inBounds(col - 1, row) ? this.water[this.index(col - 1, row)] : center;
          const right = this.inBounds(col + 1, row) ? this.water[this.index(col + 1, row)] : center;
          const up = this.inBounds(col, row - 1) ? this.water[this.index(col, row - 1)] : center;
          const down = this.inBounds(col, row + 1) ? this.water[this.index(col, row + 1)] : center;
          return {
            x: (right - left) * 90,
            y: (down - up) * 120 + center * 24
          };
        }

        draw(ctx, assets, time) {
          const dirtImage = assets.images.get("dirt");
          for (let row = 0; row < this.rows; row += 1) {
            for (let col = 0; col < this.cols; col += 1) {
              const x = col * this.tile;
              const y = CONFIG.hudHeight + row * this.tile;
              const idx = this.index(col, row);
              const pocket = this.isPocket(col, row);

              if (this.solid[idx] && !pocket) {
                if (dirtImage) {
                  ctx.globalAlpha = 0.88;
                  ctx.drawImage(dirtImage, x, y, this.tile, this.tile);
                  ctx.globalAlpha = 1;
                } else {
                  const shade = (col * 13 + row * 19) % 3;
                  const fill = shade === 0 ? "#4a2d17" : shade === 1 ? "#72431f" : "#915c29";
                  ctx.fillStyle = fill;
                  ctx.fillRect(x, y, this.tile, this.tile);
                  ctx.strokeStyle = "rgba(255,255,255,0.03)";
                  ctx.strokeRect(x, y, this.tile, this.tile);
                }
              } else {
                ctx.fillStyle = "rgba(16, 28, 32, 0.92)";
                ctx.fillRect(x, y, this.tile, this.tile);
              }

              if (pocket) {
                const pocketImage = assets.images.get("pocket");
                const center = this.centerOf(col, row);
                const pulse = 0.92 + Math.sin(time * 3 + col * 0.6 + row * 0.35) * 0.08;
                if (pocketImage) {
                  ctx.globalAlpha = pocket.ruptured ? 0.85 : 1;
                  ctx.drawImage(
                    pocketImage,
                    center.x - this.tile * 0.45,
                    center.y - this.tile * 0.45,
                    this.tile * 0.9,
                    this.tile * 0.9
                  );
                  ctx.globalAlpha = 1;
                } else {
                  ctx.fillStyle = pocket.ruptured ? "rgba(86,215,255,0.55)" : "rgba(86,215,255,0.75)";
                  ctx.beginPath();
                  ctx.ellipse(center.x, center.y, this.tile * 0.34 * pulse, this.tile * 0.28 * pulse, 0, 0, Math.PI * 2);
                  ctx.fill();
                  ctx.strokeStyle = "rgba(196, 244, 255, 0.8)";
                  ctx.lineWidth = 2;
                  ctx.stroke();
                }
              }

              const water = this.water[idx];
              if (water > 0.02) {
                const h = this.tile * clamp(water, 0.08, 1);
                const shimmer = Math.sin(time * 6 + col * 0.7 + row * 0.3) * 4;
                ctx.fillStyle = `rgba(86, 215, 255, ${0.08 + water * 0.52})`;
                ctx.fillRect(x, y + this.tile - h, this.tile, h);
                ctx.fillStyle = `rgba(220, 248, 255, ${0.08 + water * 0.22})`;
                ctx.fillRect(x, y + this.tile - h, this.tile, 4 + shimmer);
              }
            }
          }
        }
      }

      class Actor {
        constructor(x, y, radius) {
          this.x = x;
          this.y = y;
          this.radius = radius;
          this.vx = 0;
          this.vy = 0;
          this.breath = CONFIG.playerBreathMax;
          this.dead = false;
        }

        move(grid, dt) {
          this.x = clamp(this.x + this.vx * dt, this.radius, CONFIG.width - this.radius);
          this.y = clamp(this.y + this.vy * dt, CONFIG.hudHeight + this.radius, CONFIG.height - this.radius);
          grid.digAt(this.x, this.y, CONFIG.digRadius, game.particles);
        }
      }

      class Player extends Actor {
        constructor(x, y) {
          super(x, y, CONFIG.playerRadius);
          this.breath = CONFIG.playerBreathMax;
          this.score = 0;
          this.releaseCooldown = 0;
        }

        update(grid, dt) {
          const ix = (Input.down("right") ? 1 : 0) - (Input.down("left") ? 1 : 0);
          const iy = (Input.down("down") ? 1 : 0) - (Input.down("up") ? 1 : 0);
          const len = Math.hypot(ix, iy) || 1;
          this.vx = (ix / len) * CONFIG.playerSpeed;
          this.vy = (iy / len) * CONFIG.playerSpeed;
          if (ix || iy) {
            const dug = grid.digAt(this.x + this.vx * dt, this.y + this.vy * dt, CONFIG.digRadius, game.particles);
            if (dug && Math.random() < 0.18) {
              game.audio.play("dig", { volume: 0.22 });
            }
          }
          this.move(grid, dt);

          this.releaseCooldown = Math.max(0, this.releaseCooldown - dt);
          if (Input.tap("action") && this.releaseCooldown <= 0) {
            const pocket = grid.ruptureNearby(this.x, this.y);
            this.releaseCooldown = 0.28;
            if (pocket) {
              const center = grid.centerOf(pocket.col, pocket.row);
              game.audio.unlock();
              game.audio.play("burst", { volume: 0.5 });
              game.audio.play("wash", { volume: 0.25 });
              game.particles.emit(center.x, center.y, {
                count: 24,
                speedMin: 30,
                speedMax: 180,
                sizeMin: 3,
                sizeMax: 7,
                color: "#79ebff",
                gravity: 30
              });
            }
          }

          const water = grid.waterAtPixel(this.x, this.y);
          const flow = grid.flowVectorAt(this.x, this.y);
          if (water > CONFIG.floodDanger) {
            this.vx += flow.x * dt * 3.5;
            this.vy += flow.y * dt * 3.8;
            this.x += flow.x * dt * 0.4;
            this.y += flow.y * dt * 0.4;
            this.breath -= dt * lerp(0.3, 1.3, water);
            if (Math.random() < 0.2) {
              game.particles.emit(this.x, this.y, {
                count: 2,
                speedMin: 4,
                speedMax: 22,
                sizeMin: 2,
                sizeMax: 4,
                color: "#d5fbff",
                gravity: -14
              });
            }
          } else {
            this.breath = Math.min(CONFIG.playerBreathMax, this.breath + dt * 0.8);
          }
          if (this.breath <= 0 || water >= 0.98) {
            this.dead = true;
          }
        }

        draw(ctx, assets, time) {
          const sprite = assets.images.get("player");
          if (sprite) {
            ctx.drawImage(sprite, this.x - 22, this.y - 24, 44, 48);
            return;
          }
          const bob = Math.sin(time * 10) * 1.5;
          ctx.fillStyle = "#ffd961";
          ctx.beginPath();
          ctx.arc(this.x, this.y - 5 + bob, 14, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#2b5ea8";
          ctx.fillRect(this.x - 12, this.y + 6 + bob, 24, 18);
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(this.x - 9, this.y + 11 + bob, 6, 6);
          ctx.fillRect(this.x + 3, this.y + 11 + bob, 6, 6);
        }
      }

      class Enemy extends Actor {
        constructor(x, y, hue) {
          super(x, y, CONFIG.enemyRadius);
          this.hue = hue;
          this.breath = CONFIG.enemyBreathMax;
          this.dirTimer = rand(0.3, 1.2);
          this.stunned = 0;
        }

        chooseDirection(grid, player) {
          const options = [];
          const current = grid.cellAtPixel(this.x, this.y);
          const dirs = [
            { x: 1, y: 0 },
            { x: -1, y: 0 },
            { x: 0, y: 1 },
            { x: 0, y: -1 }
          ];
          for (const dir of dirs) {
            const next = { col: current.col + dir.x, row: current.row + dir.y };
            if (grid.isTunnel(next.col, next.row)) {
              const center = grid.centerOf(next.col, next.row);
              const score = dist(center.x, center.y, player.x, player.y) + rand(-60, 30);
              options.push({ dir, score });
            }
          }
          if (!options.length) {
            this.vx = 0;
            this.vy = 0;
            return;
          }
          options.sort((a, b) => a.score - b.score);
          const choice = Math.random() < 0.72 ? options[0] : pick(options);
          this.vx = choice.dir.x * CONFIG.enemySpeed;
          this.vy = choice.dir.y * CONFIG.enemySpeed;
        }

        update(grid, dt, player) {
          this.dirTimer -= dt;
          if (this.dirTimer <= 0) {
            this.dirTimer = rand(0.35, 1.1);
            this.chooseDirection(grid, player);
          }

          const water = grid.waterAtPixel(this.x, this.y);
          const flow = grid.flowVectorAt(this.x, this.y);
          if (water > 0.18) {
            this.x += flow.x * dt * 0.8;
            this.y += flow.y * dt * 0.9;
            this.breath -= dt * lerp(0.4, 2, water);
            this.vx *= 0.94;
            this.vy *= 0.94;
          }
          if (this.breath <= 0 || water >= CONFIG.floodKill) {
            this.dead = true;
            return;
          }

          this.move(grid, dt);
          const d = dist(this.x, this.y, player.x, player.y);
          if (d < this.radius + player.radius + 6) {
            player.dead = true;
          }
        }

        draw(ctx, assets, time) {
          const sprite = assets.images.get("enemy");
          if (sprite) {
            ctx.drawImage(sprite, this.x - 22, this.y - 22, 44, 44);
            return;
          }
          const wobble = Math.sin(time * 8 + this.x * 0.01) * 2;
          ctx.fillStyle = this.hue;
          ctx.beginPath();
          ctx.arc(this.x, this.y + wobble, 14, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#162126";
          ctx.fillRect(this.x - 8, this.y - 2 + wobble, 4, 4);
          ctx.fillRect(this.x + 4, this.y - 2 + wobble, 4, 4);
        }
      }

      class Game {
        constructor() {
          this.state = STATES.MENU;
          this.assets = new AssetLoader(ASSET_MANIFEST);
          this.audio = new AudioSystem(this.assets);
          this.particles = new ParticleSystem();
          this.time = 0;
          this.accumulator = 0;
          this.last = performance.now();
          this.grid = null;
          this.player = null;
          this.enemies = [];
          this.message = "Tap space near water pocket. Flood enemies. Do not drown.";
          this.assetNotice = "Loading local Kenney assets...";
          this.wave = 1;
        }

        async boot() {
          await this.assets.load();
          const { loaded, total, failed } = this.assets.summary;
          this.assetNotice = failed ? `${loaded}/${total} Kenney assets ready. Missing files use fallback art/audio.` : `${loaded}/${total} Kenney assets ready.`;
          this.resetRun();
          requestAnimationFrame((stamp) => this.frame(stamp));
        }

        resetRun() {
          this.grid = new Grid();
          const start = this.grid.centerOf(3, 2);
          this.player = new Player(start.x, start.y);
          this.enemies = [];
          const spawns = [
            this.grid.centerOf(18, 6),
            this.grid.centerOf(24, 13),
            this.grid.centerOf(11, 12),
            this.grid.centerOf(26, 4)
          ];
          const palette = ["#ff8b5f", "#ff5f94", "#c99eff", "#ffbf69"];
          for (let i = 0; i < spawns.length; i += 1) {
            this.enemies.push(new Enemy(spawns[i].x, spawns[i].y, palette[i % palette.length]));
          }
          this.particles.items.length = 0;
          this.message = "Burst pockets with Space. Water hunts tunnel lows first.";
        }

        setState(next) {
          this.state = next;
          if (next === STATES.WIN) {
            this.audio.play("win", { volume: 0.4 });
            for (let i = 0; i < 9; i += 1) {
              this.particles.emit(rand(100, CONFIG.width - 100), rand(120, CONFIG.height - 80), {
                count: 18,
                speedMin: 30,
                speedMax: 200,
                sizeMin: 2,
                sizeMax: 7,
                color: pick(["#79ebff", "#8fff9b", "#ffd961"]),
                gravity: 55
              });
            }
          }
          if (next === STATES.LOSE) {
            this.audio.play("lose", { volume: 0.3 });
            this.particles.emit(this.player.x, this.player.y, {
              count: 28,
              speedMin: 20,
              speedMax: 180,
              sizeMin: 2,
              sizeMax: 6,
              color: "#79ebff",
              gravity: 35
            });
          }
        }

        update(dt) {
          this.time += dt;
          this.particles.update(dt);

          if (this.state === STATES.MENU) {
            if (Input.tap("start") || Input.tap("action")) {
              this.audio.unlock();
              this.resetRun();
              this.setState(STATES.PLAYING);
            }
            return;
          }

          if (this.state === STATES.WIN || this.state === STATES.LOSE) {
            if (Input.tap("start") || Input.tap("action")) {
              this.resetRun();
              this.setState(STATES.PLAYING);
            }
            return;
          }

          this.grid.updateWater(dt);
          this.player.update(this.grid, dt);
          for (const enemy of this.enemies) {
            enemy.update(this.grid, dt, this.player);
          }

          const before = this.enemies.length;
          this.enemies = this.enemies.filter((enemy) => {
            if (!enemy.dead) {
              return true;
            }
            this.player.score += 125;
            this.audio.play("hit", { volume: 0.3 });
            this.particles.emit(enemy.x, enemy.y, {
              count: 20,
              speedMin: 25,
              speedMax: 160,
              sizeMin: 2,
              sizeMax: 6,
              color: "#8edfff",
              gravity: 18
            });
            return false;
          });
          if (before !== this.enemies.length) {
            this.message = "Flood kill confirmed. Keep route open.";
          }

          if (this.player.dead) {
            this.setState(STATES.LOSE);
          } else if (!this.enemies.length) {
            this.setState(STATES.WIN);
          }
        }

        drawBackdrop() {
          ctx.clearRect(0, 0, CONFIG.width, CONFIG.height);
          const gradient = ctx.createLinearGradient(0, 0, 0, CONFIG.height);
          gradient.addColorStop(0, "#102e38");
          gradient.addColorStop(1, "#051116");
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

          ctx.fillStyle = "rgba(255,255,255,0.03)";
          for (let i = 0; i < 60; i += 1) {
            const x = (i * 173) % CONFIG.width;
            const y = ((i * 97) % (CONFIG.height - CONFIG.hudHeight)) + CONFIG.hudHeight;
            ctx.beginPath();
            ctx.arc(x, y, 1.4 + (i % 3), 0, Math.PI * 2);
            ctx.fill();
          }
        }

        drawHud() {
          ctx.fillStyle = "rgba(5, 15, 21, 0.86)";
          ctx.fillRect(0, 0, CONFIG.width, CONFIG.hudHeight);
          ctx.strokeStyle = "rgba(155, 227, 255, 0.18)";
          ctx.beginPath();
          ctx.moveTo(0, CONFIG.hudHeight + 0.5);
          ctx.lineTo(CONFIG.width, CONFIG.hudHeight + 0.5);
          ctx.stroke();

          ctx.fillStyle = "#effcff";
          ctx.font = "700 20px Trebuchet MS";
          ctx.fillText("DIG DUG: HYDRO-PRESSURE", 26, 30);
          ctx.font = "14px Trebuchet MS";
          ctx.fillStyle = "#9bc6d5";
          ctx.fillText(this.message, 26, 52);

          ctx.fillStyle = "#effcff";
          ctx.font = "700 16px Trebuchet MS";
          ctx.fillText(`Score ${this.player.score}`, 790, 29);
          ctx.fillText(`Enemies ${this.enemies.length}`, 790, 51);

          const breath = clamp(this.player.breath / CONFIG.playerBreathMax, 0, 1);
          ctx.fillStyle = "rgba(255,255,255,0.08)";
          ctx.fillRect(965, 24, 260, 16);
          ctx.fillStyle = breath > 0.35 ? "#79ebff" : "#ff8b5f";
          ctx.fillRect(965, 24, 260 * breath, 16);
          ctx.strokeStyle = "rgba(255,255,255,0.16)";
          ctx.strokeRect(965, 24, 260, 16);
          ctx.fillStyle = "#9bc6d5";
          ctx.fillText("Air", 965, 55);
        }

        drawOverlay(title, subtitle) {
          ctx.fillStyle = "rgba(4, 10, 14, 0.58)";
          ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
          ctx.fillStyle = "rgba(6, 18, 24, 0.9)";
          ctx.fillRect(330, 180, 620, 290);
          ctx.strokeStyle = "rgba(155, 227, 255, 0.2)";
          ctx.lineWidth = 1;
          ctx.strokeRect(330, 180, 620, 290);

          ctx.fillStyle = "#effcff";
          ctx.textAlign = "center";
          ctx.font = "700 44px Trebuchet MS";
          ctx.fillText(title, CONFIG.width / 2, 255);
          ctx.font = "18px Trebuchet MS";
          ctx.fillStyle = "#9bc6d5";
          ctx.fillText(subtitle, CONFIG.width / 2, 302);
          ctx.fillText(this.assetNotice, CONFIG.width / 2, 334);
          ctx.fillText(ASSET_MANIFEST.attribution, CONFIG.width / 2, 364);
          ctx.fillStyle = "#effcff";
          ctx.fillText("Move: WASD / Arrows", CONFIG.width / 2, 408);
          ctx.fillText("Rupture pocket: Space", CONFIG.width / 2, 438);
          ctx.fillText("Press Enter or Space", CONFIG.width / 2, 478);
          ctx.textAlign = "left";
        }

        draw() {
          this.drawBackdrop();
          this.grid.draw(ctx, this.assets, this.time);
          for (const pocket of this.grid.pockets) {
            if (!pocket.ruptured || Math.random() >= 0.08) {
              continue;
            }
            const center = this.grid.centerOf(pocket.col, pocket.row);
            this.particles.emit(center.x, center.y, {
              count: 1,
              speedMin: 2,
              speedMax: 12,
              sizeMin: 1,
              sizeMax: 3,
              color: "#e3fcff",
              gravity: -8,
              lifeMin: 0.35,
              lifeMax: 0.7
            });
          }
          for (const enemy of this.enemies) {
            enemy.draw(ctx, this.assets, this.time);
          }
          this.player.draw(ctx, this.assets, this.time);
          this.particles.draw(ctx);
          this.drawHud();

          if (this.state === STATES.MENU) {
            this.drawOverlay("PRESSURE BELOW", "Dig safe route first. Then tap pockets to weaponize tunnel water.");
          } else if (this.state === STATES.WIN) {
            this.drawOverlay("SEAM CLEARED", "All enemies washed out. Run again?");
          } else if (this.state === STATES.LOSE) {
            this.drawOverlay("TRAPPED", "Enemy touch or flood suffocation. Carve better escape path.");
          }
        }

        frame(stamp) {
          const dt = Math.min(CONFIG.maxFrame, (stamp - this.last) / 1000 || 0);
          this.last = stamp;
          this.accumulator += dt;
          while (this.accumulator >= CONFIG.step) {
            this.update(CONFIG.step);
            this.accumulator -= CONFIG.step;
            Input.endFrame();
          }
          this.draw();
          requestAnimationFrame((next) => this.frame(next));
        }
      }

      const game = new Game();
      game.boot();
    })();
  </script>
</body>
</html>
