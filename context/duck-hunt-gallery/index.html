        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(x, waterline + 8);
        ctx.lineTo(x + 12, waterline - height);
        ctx.lineTo(x + 24, waterline + 6);
        ctx.stroke();
      }

      ctx.fillStyle = "rgba(8, 27, 35, " + (0.76 + reveal * 0.1).toFixed(3) + ")";
      ctx.beginPath();
      ctx.moveTo(0, waterline + 10);
      ctx.lineTo(160, skylineY + 24);
      ctx.lineTo(320, skylineY + 42);
      ctx.lineTo(510, skylineY + 18);
      ctx.lineTo(690, skylineY + 46);
      ctx.lineTo(880, skylineY + 14);
      ctx.lineTo(1060, skylineY + 34);
      ctx.lineTo(1280, skylineY + 6);
      ctx.lineTo(1280, HEIGHT);
      ctx.lineTo(0, HEIGHT);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = scene === "lose" ? "rgba(65, 34, 28, 0.84)" : "rgba(16, 40, 48, 0.88)";
      ctx.fillRect(902, skylineY - 6, 118, 64);
      ctx.fillRect(922, skylineY - 54, 80, 48);
      ctx.fillStyle = scene === "lose" ? "rgba(255, 191, 152, 0.24)" : "rgba(255, 222, 140, 0.26)";
      ctx.fillRect(950, skylineY - 36, 18, 18);
      ctx.fillRect(980, skylineY - 36, 18, 18);

      const reflection = ctx.createLinearGradient(0, waterline - 4, 0, waterline + 64);
      reflection.addColorStop(0, accent);
      reflection.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = reflection;
      ctx.fillRect(0, waterline - 2, WIDTH, 66);

      ctx.strokeStyle = "rgba(223, 246, 255, 0.18)";
      ctx.lineWidth = 2;
      for (let index = 0; index < 10; index += 1) {
        const x = ((index * 132) + pan * 1.6) % (WIDTH + 110) - 55;
        ctx.beginPath();
        ctx.moveTo(x, waterline + 24 + (index % 3) * 8);
        ctx.lineTo(x + 56, waterline + 24 + (index % 3) * 8);
        ctx.stroke();
      }
    }

    function drawSceneMetricChip(x, y, width, label, value, accent, valueColor = "#f8fffc") {
      drawGlassPanel(x, y, width, 50, 16, accent);
      ctx.fillStyle = "#9fe7ff";
      ctx.font = "700 11px Trebuchet MS";
      ctx.fillText(label.toUpperCase(), x + 14, y + 17);
      ctx.fillStyle = valueColor;
      ctx.font = "700 16px Trebuchet MS";
      ctx.fillText(value, x + 14, y + 36);
    }

    function sceneStoryboardEntries(scene) {
      if (scene === "menu") {
        return [
          { label: "Route", value: "9 sets", detail: "Dawn to moonlight", glow: "#9fe7ff" },
          { label: "Caches", value: "Gold = shells", detail: "Clean clears bank ammo", glow: "#ffd86e" },
          { label: "Finale", value: "2-hit barons", detail: "Night pair closes run", glow: "#ffb890" }
        ];
      }

      if (scene === "briefing") {
        const def = activeStageDef();
        const special =
          def.specials.some((entry) => entry.kind === "ace")
            ? "baron pair"
            : def.specials.some((entry) => entry.kind === "golden")
              ? "gold cache"
              : def.specials.some((entry) => entry.kind === "swift")
                ? "swift cut"
                : "clean lane";
        return [
          { label: "Act", value: def.act.replace("Act ", ""), detail: def.chapter, glow: "#9fe7ff" },
          { label: "Pattern", value: def.pattern === "mixed" ? "split lanes" : def.pattern, detail: "Cross " + Math.round(def.crossChance * 100) + "%", glow: "#b8f6ff" },
          { label: "Priority", value: special, detail: "Quota " + def.quota + " before clock", glow: special === "baron pair" ? "#ffb890" : special === "gold cache" ? "#ffd86e" : "#b9f8c8" }
        ];
      }

      if (scene === "win") {
        return [
          { label: "Circuit", value: "Clear", detail: "Migration route broke clean", glow: "#ffd86e" },
          { label: "Score", value: String(state.score), detail: "Hits " + state.totalHits, glow: "#fff1b6" },
          { label: "Ledger", value: clearCount + " clear" + (clearCount === 1 ? "" : "s"), detail: "Run " + runCount + " attempt" + (runCount === 1 ? "" : "s"), glow: "#9fe7ff" }
        ];
      }

      const quotaLeft = Math.max(0, activeStageDef().quota - state.hits);
      return [
        { label: "Break", value: quotaLeft === 0 ? "late miss" : "quota slipped", detail: state.message || "Lane collapsed.", glow: "#ffb890" },
        { label: "Left", value: String(quotaLeft), detail: "Escaped " + state.escaped, glow: "#ffd1bf" },
        { label: "Reset", value: "full circuit", detail: "Retry starts on set one", glow: "#ffe0d0" }
      ];
    }

    function drawSceneStoryboard(cardX, cardY, cardWidth, reveal, accent) {
      const entries = sceneStoryboardEntries(state.scene);
      const stripX = cardX + 34;
      const stripY = cardY + 110 + (1 - reveal) * 12;
      const stripWidth = cardWidth - 68;
      const stripHeight = 60;
      const gap = 14;
      const panelWidth = (stripWidth - gap * (entries.length - 1)) / entries.length;

      entries.forEach((entry, index) => {
        const panelX = stripX + index * (panelWidth + gap);
        const drift = Math.sin(state.time * 2.2 + index * 0.9) * 2.5;
        const panelY = stripY + drift;
        const glow = ctx.createRadialGradient(panelX + panelWidth * 0.5, panelY + stripHeight * 0.42, 8, panelX + panelWidth * 0.5, panelY + stripHeight * 0.42, panelWidth * 0.6);
        glow.addColorStop(0, hexToRgba(entry.glow, 0.26));
        glow.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = glow;
        ctx.fillRect(panelX - 18, panelY - 16, panelWidth + 36, stripHeight + 32);

        drawGlassPanel(panelX, panelY, panelWidth, stripHeight, 14, accent + "16");
        ctx.fillStyle = entry.glow;
        ctx.fillRect(panelX + 12, panelY + 12, 44, 4);
        ctx.fillStyle = "#d4edf1";
        ctx.font = "700 10px Trebuchet MS";
        ctx.fillText(entry.label.toUpperCase(), panelX + 12, panelY + 24);
        ctx.fillStyle = "#f8fffc";
        ctx.font = "700 18px Trebuchet MS";
        ctx.fillText(entry.value, panelX + 12, panelY + 42);
        ctx.fillStyle = "rgba(214, 236, 241, 0.82)";
        ctx.font = "600 11px Trebuchet MS";
        ctx.fillText(entry.detail, panelX + 12, panelY + 53);
      });
    }

    function drawSceneMetrics(scene, cardX, cardY, cardWidth, reveal, accent) {
      const chips = [];
      if (scene === "menu") {
        chips.push(
          { label: "Campaign", value: "9 marsh sets" },
          { label: "Specials", value: "Gold caches + barons" },
          { label: "Retry", value: "Instant restart" }
        );
      } else if (scene === "briefing") {
        const def = activeStageDef();
        chips.push(
          { label: "Quota", value: String(def.quota) },
          { label: "Shells", value: String(def.shells + state.carryShells) },
          { label: "Pattern", value: def.pattern === "mixed" ? "split lanes" : def.pattern }
        );
      } else if (scene === "win") {
        chips.push(
          { label: "Score", value: String(state.score) },
          { label: "Total hits", value: String(state.totalHits) },
          { label: "Attempts", value: String(runCount) }
        );
      } else {
        const quotaLeft = Math.max(0, activeStageDef().quota - state.hits);
        chips.push(
          { label: "Quota left", value: String(quotaLeft), valueColor: "#ffd8c7" },
          { label: "Escaped", value: String(state.escaped), valueColor: "#ffd8c7" },
          { label: "Retry", value: "Enter / Space / R", valueColor: "#ffd8c7" }
        );
      }

      const chipWidth = 220;
      const gap = 14;
      const rowWidth = chipWidth * chips.length + gap * (chips.length - 1);
      const startX = cardX + (cardWidth - rowWidth) * 0.5;
      const y = cardY - 76 + (1 - reveal) * 18;
      chips.forEach((chip, index) => {
        const drift = Math.sin(state.time * 2.1 + index * 0.9) * (3 + state.sceneRipple * 4);
        const staggerLift = (1 - reveal) * (14 + index * 5);
        drawSceneMetricChip(
          startX + index * (chipWidth + gap),
          y + drift + staggerLift,
          chipWidth,
          chip.label,
          chip.value,
          accent + "1a",
          chip.valueColor || "#f8fffc"
        );
      });
    }

    function drawSceneCard() {
      if (state.scene === "play") {
        return;
      }

      const badge =
        state.scene === "menu"
          ? "Opening Brief"
          : state.scene === "briefing"
            ? stageDefs[state.stage].chapter
            : state.scene === "win"
              ? "Victory Cut"
              : "Game Over";
      const title =
        state.scene === "menu"
          ? "Duck Hunt Gallery"
          : state.scene === "briefing"
            ? state.cardTitle
            : state.scene === "win"
              ? "Gallery clear."
              : stageDefs[state.stage].title;
      const sub =
        state.scene === "menu"
          ? "Nine connected marsh sets. Follow Warden Nia from dawn count to moonlit finale."
          : state.scene === "briefing"
            ? state.cardText
            : state.scene === "win"
              ? "The migration arc is clear. Marsh traffic broke in your favor."
              : state.message;
      const hint =
        state.scene === "briefing"
          ? stageDefs[state.stage].goal + " " + state.cardHint
          : state.scene === "menu"
            ? "Golden pintails grant shell caches. Night barons need two hits."
            : state.scene === "win"
              ? "Score " + state.score + " | Total hits " + state.totalHits + " | Clean sets bank extra shells."
              : "Retry fast. Story route stays readable on each restart.";
      const prompt =
        state.scene === "briefing"
          ? "Click or press Enter or Space to cut straight into the set."
          : state.scene === "menu"
            ? "Click or press Enter or Space to start the hunt."
            : state.scene === "win"
              ? "Click or press Enter, Space, or R to replay the full circuit."
              : "Click or press Enter, Space, or R to restart the full circuit.";
      const accent =
        state.scene === "lose"
          ? "#ff9f7a"
          : state.scene === "win"
            ? "#ffd86e"
            : state.scene === "briefing"
              ? "#9fe7ff"
              : "#b6f0ff";
      const reveal = easeOutCubic(state.sceneFlash > 0 ? 1 - state.sceneFlash : Math.min(state.sceneTimer / 0.55, 1));
      const barReveal = easeInOutSine(Math.min(state.sceneTimer / 0.45, 1));
      const cardLift = (1 - reveal) * 26;
      const promptPulse = 0.62 + Math.sin(state.time * 3.4) * 0.08;
      const sweep = (state.time * 120) % (WIDTH + 420) - 210;
      const scenePulse = easeOutCubic(state.sceneRipple);
      const cardX = WIDTH * 0.5 - 380;
      const cardY = (state.scene === "menu" ? HEIGHT - 300 : HEIGHT - 286) + cardLift;
      const cardWidth = 760;
      const cardHeight = 236;
      const barHeight = 52 + barReveal * 18;

      ctx.fillStyle = "rgba(4, 14, 20, 0.72)";
      ctx.fillRect(0, 0, WIDTH, barHeight);
      ctx.fillRect(0, HEIGHT - (70 + barReveal * 20), WIDTH, 70 + barReveal * 20);
      drawSceneSilhouetteBand(state.scene, reveal);

      const beam = ctx.createLinearGradient(sweep - 180, 0, sweep + 180, HEIGHT);
      beam.addColorStop(0, "rgba(255,255,255,0)");
      beam.addColorStop(0.5, state.scene === "lose" ? "rgba(255, 169, 124, 0.08)" : state.scene === "win" ? "rgba(255, 220, 132, 0.1)" : "rgba(159, 231, 255, 0.1)");
      beam.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = beam;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      const sweepCenter = WIDTH * 0.5 + state.sceneSweepDir * (1 - scenePulse) * 420;
      const sweepGlow = ctx.createLinearGradient(sweepCenter - 260, 0, sweepCenter + 260, HEIGHT);
      sweepGlow.addColorStop(0, "rgba(255,255,255,0)");
      sweepGlow.addColorStop(
        0.5,
        state.scene === "lose"
          ? "rgba(255, 173, 132, " + (0.04 + scenePulse * 0.14).toFixed(3) + ")"
          : state.scene === "win"
            ? "rgba(255, 224, 148, " + (0.05 + scenePulse * 0.16).toFixed(3) + ")"
            : "rgba(187, 238, 255, " + (0.05 + scenePulse * 0.16).toFixed(3) + ")"
      );
      sweepGlow.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = sweepGlow;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.save();
      ctx.globalAlpha = 0.2 + reveal * 0.2;
      drawSceneBirdSilhouette(196 + (state.time * 34) % 220, 126, 1.25, Math.sin(state.time * 8) * 3.5, 0.18);
      drawSceneBirdSilhouette(920 - (state.time * 26) % 260, 170, 1.05, Math.sin(state.time * 7.2 + 0.8) * 2.8, 0.14);
      if (state.scene !== "lose") {
        drawSceneBirdSilhouette(1120 - (state.time * 42) % 260, 104, 0.78, Math.sin(state.time * 9 + 1.8) * 2.2, 0.12);
      }
      ctx.restore();
      drawSceneMetrics(state.scene, cardX, cardY, cardWidth, reveal, accent);

      const cardGradient = ctx.createLinearGradient(cardX, cardY, cardX + cardWidth, cardY + cardHeight);
      cardGradient.addColorStop(0, "rgba(4, 18, 24, 0.92)");
      cardGradient.addColorStop(0.55, "rgba(8, 28, 38, 0.9)");
      cardGradient.addColorStop(1, "rgba(17, 41, 48, 0.86)");
      const cardGlow = ctx.createRadialGradient(WIDTH * 0.5, cardY + cardHeight * 0.52, 40, WIDTH * 0.5, cardY + cardHeight * 0.52, 420);
      cardGlow.addColorStop(
        0,
        state.scene === "lose"
          ? "rgba(255, 170, 130, " + (0.06 + scenePulse * 0.12).toFixed(3) + ")"
          : state.scene === "win"
            ? "rgba(255, 223, 136, " + (0.07 + scenePulse * 0.14).toFixed(3) + ")"
            : "rgba(174, 235, 255, " + (0.06 + scenePulse * 0.14).toFixed(3) + ")"
      );
      cardGlow.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = cardGlow;
      ctx.fillRect(cardX - 120, cardY - 80, cardWidth + 240, cardHeight + 180);
      roundedRectPath(cardX, cardY, cardWidth, cardHeight, 20);
      ctx.fillStyle = cardGradient;
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.stroke();
      const sheen = ctx.createLinearGradient(cardX, cardY + 12, cardX + cardWidth, cardY + cardHeight - 18);
      sheen.addColorStop(0, "rgba(255,255,255,0.08)");
      sheen.addColorStop(0.45, "rgba(255,255,255,0.02)");
      sheen.addColorStop(1, "rgba(255,255,255,0.09)");
      roundedRectPath(cardX + 12, cardY + 12, cardWidth - 24, cardHeight - 24, 16);
      ctx.strokeStyle = sheen;
      ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255," + (0.08 + reveal * 0.22).toFixed(3) + ")";
      ctx.strokeRect(cardX + 22, cardY + 34, cardWidth - 44, cardHeight - 92);
      ctx.fillStyle = accent;
      roundedRectPath(cardX, cardY, cardWidth, 8, 8);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      roundedRectPath(cardX + 24, cardY + 98, cardWidth - 48, 2, 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.06)";
      for (let stripe = 0; stripe < 6; stripe += 1) {
        ctx.fillRect(cardX + 28 + stripe * 118, cardY + 182, 76, 2);
      }

      ctx.textAlign = "center";
      ctx.fillStyle = accent;
      ctx.font = "700 14px Trebuchet MS";
      ctx.fillText(badge.toUpperCase(), WIDTH * 0.5, cardY + 30);
      ctx.fillStyle = "#f8fffc";
      ctx.font = state.scene === "menu" ? "700 38px Trebuchet MS" : "700 31px Trebuchet MS";
      ctx.fillText(title, WIDTH * 0.5, cardY + 68);
      drawWrappedText(sub, WIDTH * 0.5, cardY + 94, 640, 22, 2, "#d7ecef", "600 18px Trebuchet MS");
      drawSceneStoryboard(cardX, cardY, cardWidth, reveal, accent);
      drawWrappedText(hint, WIDTH * 0.5, cardY + 188, 706, 17, 2, "#ffd86e", "600 15px Trebuchet MS");
      roundedRectPath(WIDTH * 0.5 - 222, cardY + 204, 444, 24, 12);
      ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
      ctx.fill();
      if (state.scene === "briefing" && state.cardDuration > 0) {
        const progress = clamp(1 - state.cardTimer / state.cardDuration, 0, 1);
        if (progress > 0.01) {
          roundedRectPath(WIDTH * 0.5 - 218, cardY + 207, 436 * progress, 18, 9);
          ctx.fillStyle = "rgba(159, 231, 255, " + (0.18 + progress * 0.32).toFixed(3) + ")";
          ctx.fill();
        }
      }
      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.stroke();
      ctx.font = "700 13px Trebuchet MS";
      ctx.fillStyle = state.scene === "briefing" ? "rgba(248,255,252," + promptPulse.toFixed(3) + ")" : "#f8fffc";
      ctx.fillText(prompt, WIDTH * 0.5, cardY + 221);

      const vignette = ctx.createRadialGradient(WIDTH * 0.5, HEIGHT * 0.45, HEIGHT * 0.22, WIDTH * 0.5, HEIGHT * 0.45, HEIGHT * 0.72);
      vignette.addColorStop(0, "rgba(0,0,0,0)");
      vignette.addColorStop(1, "rgba(0,0,0," + (0.16 + scenePulse * 0.08).toFixed(3) + ")");
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      ctx.textAlign = "left";
    }

    function drawShotFlashes() {
      for (const flash of state.shotFlashes) {
        const alpha = flash.life / 0.16;
        ctx.strokeStyle = "rgba(255, 232, 167, " + alpha.toFixed(3) + ")";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(flash.x - 34, flash.y - 34);
        ctx.lineTo(flash.x + 34, flash.y + 34);
        ctx.moveTo(flash.x + 34, flash.y - 34);
        ctx.lineTo(flash.x - 34, flash.y + 34);
        ctx.stroke();
      }
    }

    function drawRipples() {
      for (const ripple of state.ripples) {
        const alpha = ripple.life / ripple.maxLife;
        const color = ripple.color || "#ffffff";
        const rgb = colorToRgb(color);
        ctx.strokeStyle = "rgba(" + rgb + "," + alpha.toFixed(3) + ")";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ripple.x, ripple.y, ripple.size, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawFeathers() {
      for (const feather of state.feathers) {
        ctx.fillStyle = feather.color;
        ctx.fillRect(feather.x, feather.y, 5, 2);
      }
    }

    function draw() {
      ctx.save();
      ctx.translate(state.cameraOffsetX, state.cameraOffsetY);
      drawSky();
      drawAmbientMotes();
      drawMarsh();

      for (const duck of state.ducks) {
        drawDuckReflection(duck);
      }

      for (const duck of state.ducks) {
        drawDuck(duck);
      }

      drawRipples();
      drawFeathers();
      drawCasings();
      drawBursts();
      drawSmokePuffs();
      drawRings();
      drawTracers();
      ctx.restore();
      drawPopups();
      drawSpawnPings();
      drawHud();
      drawEdgeMarkers();
      drawPlayToast();
      drawSceneCard();
      drawShotFlashes();
      drawCrosshair();
      drawPostFx();
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    window.addEventListener("keydown", (event) => {
      ensureAudio();
      if (["Space", "Enter", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.code)) {
        event.preventDefault();
      }
      if (event.code === "KeyM") {
        toggleMute();
        return;
      }
      keys.add(event.code);
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.code);
    });

    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = WIDTH / rect.width;
      const scaleY = HEIGHT / rect.height;
      pointer.x = clamp((event.clientX - rect.left) * scaleX, 24, WIDTH - 24);
      pointer.y = clamp((event.clientY - rect.top) * scaleY, 24, HEIGHT - 24);
      pointer.inside = true;
    });

    canvas.addEventListener("mouseleave", () => {
      pointer.inside = false;
    });

    canvas.addEventListener("mousedown", () => {
      fireShot();
    });

    window.__duckHuntGallery = {
      state,
      stageDefs,
      startRun,
      startStage,
      fireShot,
      toggleMute
    };

    updateAudioHud();
    draw();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
