<head>
  <meta charset="UTF-8" />

  <title>Duck Hunt Gallery</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(10, 33, 42, 0.72);
      --line: rgba(255, 255, 255, 0.18);
      --ink: #f8fffc;
      --muted: rgba(248, 255, 252, 0.76);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.38), transparent 28%),
        linear-gradient(180deg, #d7fbff, #63b3df 45%, #1c617b);
      color: var(--ink);
    }

    body {
      display: grid;
      place-items: center;
      padding: 14px;
    }

    .shell {
      width: min(100%, 1180px);
      display: grid;
      gap: 12px;
    }

    .frame {
      position: relative;
      padding: 14px;
      border-radius: 28px;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.12), transparent 22%),
        linear-gradient(180deg, rgba(6, 32, 41, 0.55), rgba(4, 18, 24, 0.88));
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: linear-gradient(180deg, #c2f1ff, #5bb1de);
      cursor: none;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 0 4px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 11px;
      color: var(--muted);
    }

    .hud span {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
    }
  </style>
</head>

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function approach(value, target, delta) {
      if (value < target) {
        return Math.min(target, value + delta);
      }
      return Math.max(target, value - delta);
    }

    function hexToRgba(hex, alpha) {
      const normalized = hex.replace("#", "");
      const value = normalized.length === 3
        ? normalized.split("").map((part) => part + part).join("")
        : normalized;
      const channel = (index) => parseInt(value.slice(index, index + 2), 16);
      return "rgba(" + channel(0) + "," + channel(2) + "," + channel(4) + "," + alpha + ")";
    }

    function colorToRgb(color) {
      if (!color) {
        return "255,255,255";
      }
      if (color.startsWith("#")) {
        const normalized = color.replace("#", "");
        const value = normalized.length === 3
          ? normalized.split("").map((part) => part + part).join("")
          : normalized;
        return parseInt(value.slice(0, 2), 16) + "," + parseInt(value.slice(2, 4), 16) + "," + parseInt(value.slice(4, 6), 16);
      }
      const match = color.match(/rgba?\(([^)]+)\)/i);
      if (match) {
        return match[1].split(",").slice(0, 3).map((part) => part.trim()).join(",");
      }
      return "255,255,255";
    }

    function easeOutCubic(value) {
      const t = clamp(value, 0, 1);
      return 1 - Math.pow(1 - t, 3);
    }

    function easeInOutSine(value) {
      const t = clamp(value, 0, 1);
      return -(Math.cos(Math.PI * t) - 1) * 0.5;
    }

    function ambientPalette(def) {
      if (def.fog > 0.06 || state.stage >= 7) {
        return {
          fill: "rgba(255, 224, 158, 0.22)",
          glow: "rgba(255, 188, 128, 0.12)"
        };
      }
      if (state.stage >= 4) {
        return {

          glow: "rgba(159, 231, 255, 0.08)"
        };
      }
      return {
        fill: "rgba(222, 246, 255, 0.15)",
        glow: "rgba(255, 245, 194, 0.07)"
      };
    }

    function spawnAmbientMote(def, fromEdge = false) {
      const late = def.fog > 0.06 || state.stage >= 7;
      const lowBand = state.stage >= 4;
      const speedBase = late ? rand(18, 42) : rand(10, 28);
      const drift = Math.random() > 0.5 ? 1 : -1;
      return {
        x: fromEdge
          ? drift > 0
            ? rand(-40, 32)
            : rand(WIDTH - 32, WIDTH + 40)
          : rand(0, WIDTH),
        y: late
          ? rand(118, HEIGHT - 118)
          : lowBand
            ? rand(132, HEIGHT - 132)
            : rand(96, HEIGHT - 176),
        vx: speedBase * drift,
        vy: late ? rand(-5, 8) : rand(-10, 6),
        life: rand(4.6, late ? 8.2 : 6.8),
        maxLife: 1,
        radius: late ? rand(2.4, 5.8) : rand(2.2, 4.6),
        pulse: rand(0, Math.PI * 2),
        pulseRate: rand(1.2, late ? 2.8 : 1.9),
        lowBand,
        late
      };
    }

    function repopulateAmbientMotes(def, count) {
      while (state.ambientMotes.length < count) {
        state.ambientMotes.push(spawnAmbientMote(def, false));
      }
    }

    function activeStageDef() {
      return stageDefs[state.stage] || stageDefs[0];
    }

    function updateAudioHud() {
      if (!audioHud) {
        return;
      }
      audioHud.textContent = "Audio: " + (audioState.muted ? "Off" : "On") + " (M)";
    }

    function syncMasterGain(immediate = false) {
      if (!audioState.masterGain || !audioState.ctx) {
        return;
      }
      const target = audioState.muted ? 0.0001 : audioState.masterLevel;
      if (immediate) {
        audioState.masterGain.gain.value = target;
        return;
      }
      audioState.masterGain.gain.setTargetAtTime(target, audioState.ctx.currentTime, 0.015);
    }

    function toggleMute() {
      ensureAudio();
      audioState.muted = !audioState.muted;
      syncMasterGain();
      updateAudioHud();
      if (state.scene === "play") {
        announce(audioState.muted ? "Audio muted." : "Audio live.", 1.1, "info");
      }
    }

    function totalAmmo() {
      return state.clip + state.shellsLeft;
    }

    function currentPressure(def = activeStageDef()) {
      if (state.scene !== "play") {
        return 0;
      }
      const liveDucks = state.ducks.reduce((count, duck) => count + (duck.alive && !duck.falling ? 1 : 0), 0);
      const ammoBudget = Math.max(3, def.shells + state.carryShells);
      const ammoPressure = clamp(1 - totalAmmo() / ammoBudget, 0, 1);
      const timePressure = clamp(1 - state.roundTimer / Math.max(1, def.duration), 0, 1);
      const quotaPressure = clamp((def.quota - state.hits) / Math.max(1, def.quota), 0, 1);
      const lanePressure = clamp(liveDucks / Math.max(2, def.flockSize + 1), 0, 1);
      return clamp(ammoPressure * 0.34 + timePressure * 0.23 + quotaPressure * 0.17 + lanePressure * 0.26, 0, 1);
    }

    function spawnSceneMotes(count = 16) {
      const palette =
        state.scene === "win"
          ? ["rgba(255, 227, 154, 0.7)", "rgba(255, 195, 122, 0.54)", "rgba(180, 239, 255, 0.42)"]
          : state.scene === "lose"

            : ["rgba(180, 239, 255, 0.42)", "rgba(255, 223, 145, 0.34)", "rgba(255,255,255,0.22)"];
      for (let index = 0; index < count; index += 1) {
        const life = rand(0.8, 1.5);
        state.sceneMotes.push({
          x: rand(80, WIDTH - 80),
          y: rand(72, HEIGHT - 164),

          life,
          maxLife: life,
          color: palette[Math.floor(rand(0, palette.length))]
        });
      }
    }

      const changed = state.scene !== scene;
      state.scene = scene;

    function ensureAudio() {
      if (audioState.unlocked) {
        if (audioState.ctx && audioState.ctx.state === "suspended") {
          audioState.ctx.resume();
        }
        return;
      }

      const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextCtor) {
        audioState.unlocked = true;
        return;
      }

      try {
        audioState.ctx = new AudioContextCtor();
        audioState.masterGain = audioState.ctx.createGain();
        audioState.musicGain = audioState.ctx.createGain();
        audioState.sfxGain = audioState.ctx.createGain();
        audioState.masterGain.gain.value = audioState.masterLevel;
        audioState.musicGain.gain.value = 0.26;
        audioState.sfxGain.gain.value = 0.42;
        audioState.musicGain.connect(audioState.masterGain);
        audioState.sfxGain.connect(audioState.masterGain);
        audioState.masterGain.connect(audioState.ctx.destination);
        audioState.unlocked = true;
        syncMasterGain(true);
        updateAudioHud();

      const output = destination === "music" ? audioState.musicGain : audioState.sfxGain;
      if (destination !== "music" && typeof audioState.ctx.createStereoPanner === "function") {
        const panner = audioState.ctx.createStereoPanner();
        panner.pan.value = clamp(pan, -1, 1);
        node.connect(panner);
        panner.connect(output || audioState.ctx.destination);
        return;
      }

    function playTone(freq, duration, type, volume, delay = 0, destination = "sfx", attack = 0.01, pan = 0) {
      if (!audioState.ctx) {
        return;
      }
      const now = audioState.ctx.currentTime + delay;
      const osc = audioState.ctx.createOscillator();
      const gain = audioState.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + attack);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain);
      connectAudioOutput(gain, destination, pan);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function playNoiseBurst(duration, volume, filterFreq, delay = 0, destination = "sfx", pan = 0) {
      if (!audioState.ctx) {
        return;
      }
      const now = audioState.ctx.currentTime + delay;
      const buffer = audioState.ctx.createBuffer(1, Math.max(1, Math.floor(audioState.ctx.sampleRate * duration)), audioState.ctx.sampleRate);
      const channel = buffer.getChannelData(0);
      for (let index = 0; index < channel.length; index += 1) {
        channel[index] = (Math.random() * 2 - 1) * (1 - index / channel.length);
      }
      const source = audioState.ctx.createBufferSource();
      const filter = audioState.ctx.createBiquadFilter();
      const gain = audioState.ctx.createGain();
      source.buffer = buffer;
      filter.type = "bandpass";
      filter.frequency.setValueAtTime(filterFreq, now);
      filter.Q.value = 1.3;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      source.connect(filter);
      filter.connect(gain);
      connectAudioOutput(gain, destination, pan);
      source.start(now);
      source.stop(now + duration + 0.02);
    }

    function updateMusic(dt) {
      if (!audioState.ctx) {
        return;
      }

      const musicalScene =
        state.scene === "menu" || state.scene === "briefing" || state.scene === "play" || state.scene === "win" || state.scene === "lose";
      if (!musicalScene) {

      const def = activeStageDef();
      const scoreBanks = [

          harmony: [330, 392, 440, 523],

          pulse: 0.8
        },

          pulse: 1
        },
        {
          lead: [196, 247, 294, 370],
          harmony: [294, 370, 440, 494],
          drone: 98,
          pulse: 1.08
        },
        {
          lead: [175, 220, 262, 330],
          harmony: [262, 330, 392, 440],
          drone: 87,
          pulse: 1.18
        }
      ];
      const bank = scoreBanks[Math.min(scoreBanks.length - 1, Math.floor(state.stage / 3))];
      const pressure = currentPressure(def);
      const comboLift = clamp(state.combo / 6, 0, 0.16);
      if (audioState.musicDuckTimer > 0) {
        audioState.musicDuckTimer = Math.max(0, audioState.musicDuckTimer - dt);
      } else {
        audioState.musicDuck = Math.min(1, audioState.musicDuck + dt * 1.9);
      }
      const baseMusicGain =
        state.scene === "play"

          : state.scene === "win"
            ? 0.245
            : state.scene === "briefing"
              ? 0.238
              : 0.232;
      const targetMusicGain = baseMusicGain * audioState.musicDuck;
      audioState.musicGain.gain.value += (targetMusicGain - audioState.musicGain.gain.value) * Math.min(1, dt * 10);

      audioState.bgmTimer -= dt;
      audioState.lowPulseTimer -= dt;
      audioState.ambienceTimer -= dt;
      audioState.pressureBeatTimer -= dt;

      if (audioState.ambienceTimer <= 0) {
        const shimmerBase =
          state.scene === "win"
            ? bank.harmony[(audioState.bgmIndex + 1) % bank.harmony.length]
            : state.scene === "briefing"
              ? bank.lead[(audioState.bgmIndex + 2) % bank.lead.length]

        if (state.scene === "play") {
          playNoiseBurst(0.16, 0.0014 + pressure * 0.0012, 1100 - state.stage * 38, 0.01, "music");

            playTone(shimmerBase * 0.75, 0.12, "sine", 0.0018 + pressure * 0.0005, 0.14, "music", 0.02);

            playNoiseBurst(0.11, 0.0015 + def.fog * 0.002, 760 + state.stage * 26, 0.06, "music");
            if (state.stage >= 3) {
              playTone(bank.harmony[(audioState.bgmIndex + 2) % bank.harmony.length] * 2, 0.08, "square", 0.0019, 0.09, "music", 0.01);
            }
          }
          if (state.stage >= 7 || def.fog > 0.06) {
            playTone(bank.drone * 3, 0.1, "sine", 0.0019, 0.18, "music", 0.04);
          }
          if (state.stage >= 5 || pressure > 0.58) {
            playTone(bank.harmony[(audioState.bgmIndex + 1) % bank.harmony.length] * 2, 0.18, "triangle", 0.0018 + pressure * 0.0009, 0.12, "music", 0.03);
            playTone(bank.lead[(audioState.bgmIndex + 3) % bank.lead.length] * 2, 0.11, "sine", 0.0014 + pressure * 0.0007, 0.2, "music", 0.02);
          }
          audioState.ambienceFlip = !audioState.ambienceFlip;
        }
        audioState.ambienceTimer = state.scene === "play" ? clamp(2.3 - pressure * 0.75 - def.fog * 4.5, 1.1, 2.5) : 1.9;
      }

      if (state.scene === "play" && pressure > 0.45 && audioState.pressureBeatTimer <= 0) {
        playNoiseBurst(0.045, 0.0018 + pressure * 0.0012, 520 + state.stage * 24, 0.01, "music");

          const undertow = bank.drone * (pressure > 0.6 ? 0.5 : 1);
          playTone(undertow, 0.24, "triangle", 0.0048 + pressure * 0.0018, 0, "music", 0.03);

            playTone(undertow * 0.5, 0.18, "sine", 0.0019 + pressure * 0.0009, 0.04, "music", 0.04);

      if (audioState.bgmTimer > 0) {
        return;
      }

      const note = bank.lead[audioState.bgmIndex % bank.lead.length];
      const harmony = bank.harmony[audioState.bgmIndex % bank.harmony.length];
      const stageIntensity = clamp(0.85 + state.stage * 0.05 + pressure * 0.18, 0.85, 1.45);
      const playPulse = clamp(0.5 - def.crossChance * 0.14 - def.fog * 0.16 - pressure * 0.07 + (state.stage >= 6 ? 0.02 : 0.07), 0.24, 0.58);
