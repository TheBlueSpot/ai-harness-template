      } else if (state.scene === "win") {
        playTone(harmony, 0.34, "triangle", 0.0105, 0, "music", 0.03);
        playTone(harmony * 1.5, 0.26, "sine", 0.0056, 0.1, "music", 0.03);
        playTone(bank.drone * 2, 0.18, "triangle", 0.0034, 0.18, "music", 0.03);
        audioState.bgmTimer = 0.52;
      } else if (state.scene === "lose") {
        playTone(bank.drone, 0.28, "triangle", 0.008, 0, "music", 0.02);
        playTone(note * 0.75, 0.22, "sine", 0.0048, 0.07, "music", 0.02);
        playNoiseBurst(0.04, 0.0028, 540, 0.01, "music");
        audioState.bgmTimer = 0.72;
      } else {
        playTone(note, 0.22, "sine", 0.008 + stageIntensity * 0.0012, 0, "music", 0.02);
        playTone(bank.drone, 0.18, "triangle", 0.0048, 0.03, "music", 0.03);
        playTone(harmony, 0.15, "triangle", 0.0038, 0.08, "music", 0.02);
        if (audioState.bgmIndex % 4 === 0) {
          playTone(bank.drone * 0.5, 0.22, "sawtooth", 0.0042 * stageIntensity, 0, "music", 0.014);
        }
        if (state.stage >= 2) {
          playTone(note * 2, 0.08, "square", 0.002 + pressure * 0.0014, 0.14, "music", 0.01);
        }
        if (state.stage >= 4 && audioState.bgmIndex % 4 === 1) {
          playTone(harmony * 1.5, 0.11, "sine", 0.003 + pressure * 0.0014, 0.18, "music", 0.01);
        }
        if (audioState.bgmIndex % 2 === 0) {
          playNoiseBurst(0.035, (0.0021 + pressure * 0.0009) * bank.pulse, 900 + state.stage * 28, 0.02, "music");
        }
        if (state.stage >= 5 && audioState.bgmIndex % 4 === 2) {
          playNoiseBurst(0.05, 0.0018 * stageIntensity + pressure * 0.0008, 480 + state.stage * 18, 0.01, "music");
        }
        if (state.combo >= 3 && audioState.bgmIndex % 4 === 3) {
          playTone(note * 3, 0.07, "triangle", 0.0019 + comboLift * 0.012, 0.06, "music", 0.01);
        }
        audioState.bgmTimer = playPulse;
      }

      audioState.bgmIndex += 1;
    }

    function resetTransientState() {
      state.ducks = [];
      state.shotFlashes = [];
      state.ripples = [];
      state.feathers = [];
      state.casings = [];
      state.ambientMotes = [];
      state.bursts = [];
      state.smokePuffs = [];
      state.rings = [];
      state.tracers = [];
      state.popups = [];
      state.spawnPings = [];
      state.reloadTimer = 0;
      state.reloadBlink = 0;
      state.reloadReadyPulse = 0;
      state.shotCooldown = 0;
      state.spawnTimer = 0;
      state.waveCount = 0;
      state.combo = 0;
      state.comboTimer = 0;
      state.comboFlash = 0;
      state.hitFlash = 0;
      state.stagePulse = 0;
      state.freezeTimer = 0;
      state.shotHeat = 0;
      state.impactPulse = 0;
      state.waterFlash = 0;
      state.screenFlash = 0;
      state.impactX = WIDTH * 0.5;
      state.impactY = HEIGHT * 0.5;
      state.cameraOffsetX = 0;
      state.cameraOffsetY = 0;
      state.dryFireCooldown = 0;
    }

    function startRun() {
      runCount += 1;
      state.score = 0;
      state.totalHits = 0;
      state.carryShells = 0;
      state.message = "";
      state.messageTimer = 0;
      state.messageKind = "info";
      state.lastReward = "";
      state.lastRewardTimer = 0;
      pointer.x = WIDTH * 0.5;
      pointer.y = HEIGHT * 0.46;
      audioState.bgmIndex = 0;
      audioState.bgmTimer = 0;
      audioState.ambienceTimer = 0;
      audioState.ambienceFlip = false;
      audioState.pressureBeatTimer = 0;
      audioState.lowPulseTimer = 0;
      audioState.musicDuck = 1;
      audioState.musicDuckTimer = 0;
      queueStage(0, "Marsh circuit open. Nine sets from dawn to moonlight.");
    }

    function queueStage(index, intro) {
      const repeatBrief = seenBriefings.has(index) || runCount > 1;
      const cardDuration = repeatBrief ? (stageDefs[index].act === "Act III" ? 1.9 : 1.65) : 3;
      state.stage = index;
      setScene("briefing");
      state.cardTimer = cardDuration;
      state.cardDuration = cardDuration;
      state.cardTitle = stageDefs[index].act + "  " + stageDefs[index].title;
      state.cardText = stageDefs[index].briefing;
      state.cardHint = intro;
      seenBriefings.add(index);
      resetTransientState();
    }

    function startStage(index) {
      const def = stageDefs[index];
      const stageShells = def.shells + state.carryShells;
      setScene("play");
      state.stage = index;
      state.hits = 0;
      state.escaped = 0;
      state.clip = Math.min(state.clipSize, stageShells);
      state.shellsLeft = stageShells - state.clip;
      state.roundTimer = def.duration;
      setMessage(def.radio, 4.2, "info");
      state.cardTimer = 0;
      state.cardDuration = 0;
      state.carryShells = 0;
      state.stageClearBonus = 0;
      state.lastReward = "";
      state.lastRewardTimer = 0;
      resetTransientState();
      repopulateAmbientMotes(def, def.fog > 0.06 || index >= 7 ? 18 : index >= 4 ? 14 : 10);
      state.stagePulse = Math.max(state.stagePulse, 0.42);
      flashScreen("#9fe7ff", 0.14);
      state.spawnTimer = 0.45;
    }

    function triggerReload() {
      if (state.reloadTimer <= 0 && state.clip === 0 && state.shellsLeft > 0) {
        state.reloadTimer = 0.72;
        state.reloadBlink = 0.72;
        playReloadSound();
      }
    }

    function setMessage(text, duration = 1.25, kind = "info") {
      state.message = text;
      state.messageTimer = duration;
      state.messageKind = kind;
    }

    function finishReload() {
      const load = Math.min(state.clipSize, state.shellsLeft);
      state.clip = load;
      state.shellsLeft -= load;
      state.reloadTimer = 0;
      state.reloadReadyPulse = 0.52;
      playReloadReadySound();
      announce(load === state.clipSize ? "Clip loaded." : "Last shells loaded.", 0.72, "success");
      reward(load === state.clipSize ? "Clip ready." : "Last shells loaded.", 0.9);
      addBurst(pointer.x, pointer.y + 28, "#ffe3a6", 8, 26, 88, 0.12, 0.24, 2, 4, 18);
      addFanBurst(pointer.x, pointer.y + 30, "rgba(255, 230, 168, 0.74)", 10, Math.PI * 0.5, 0.55, 24, 96, 0.12, 0.24, 2, 4, 12);
      addRing(pointer.x, pointer.y + 24, "rgba(255, 222, 138, 0.8)", 24, 3, 0.28, 92);
      flashScreen("#ffe3a6", 0.08);
    }

    function announce(text, duration = 1.25, kind = "info") {
      setMessage(text, duration, kind);
    }

    function reward(text, duration = 1.4) {
      state.lastReward = text;
      state.lastRewardTimer = duration;
    }

    function addRipple(x, y, life, size, color, grow = 48) {
      state.ripples.push({ x, y, life, maxLife: life, size, color, grow });
    }

    function addPopup(text, x, y, color = "#f8fffc", life = 0.9) {
      state.popups.push({ text, x, y, vy: -44, life, maxLife: life, color });
    }

    function addSpawnPing(dir, y, color, rareLevel = 0) {
      state.spawnPings.push({
        side: dir === 1 ? "left" : "right",
        y,
        color,
        rareLevel,
        life: 0.48 + rareLevel * 0.08,
        maxLife: 0.48 + rareLevel * 0.08
      });
    }

    function pulseSpawnEdge(side, y, color, rareLevel = 0, crossing = false) {
      const edgeX = side === "left" ? 22 : WIDTH - 22;
      const drift = side === "left" ? 1 : -1;
      const spread = rareLevel > 1 ? 0.52 : rareLevel > 0 ? 0.44 : 0.34;
      const count = rareLevel > 1 ? 13 : rareLevel > 0 ? 10 : 7;
      const ringColor = rareLevel > 1 ? "rgba(255, 176, 144, 0.8)" : rareLevel > 0 ? "rgba(255, 224, 138, 0.78)" : hexToRgba(color, 0.62);
      addFanBurst(
        edgeX,
        y,
        hexToRgba(color, crossing ? 0.78 : 0.66),
        count,
        side === "left" ? 0 : Math.PI,
        spread,
        54,
        170 + rareLevel * 28,
        0.12,
        0.26,
        2,
        rareLevel > 0 ? 5 : 4,
        32
      );
      addRing(edgeX + drift * 18, y, ringColor, 18 + rareLevel * 5, 2 + rareLevel, 0.22 + rareLevel * 0.03, 104 + rareLevel * 26);
    }

    function addBurst(x, y, color, count, speedMin, speedMax, lifeMin, lifeMax, sizeMin = 3, sizeMax = 7, gravity = 120) {
      for (let index = 0; index < count; index += 1) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(speedMin, speedMax);
        const life = rand(lifeMin, lifeMax);
        state.bursts.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life,
          maxLife: life,
          size: rand(sizeMin, sizeMax),
          color,
          gravity
        });
      }
    }

    function addFanBurst(
      x,
      y,
      color,
      count,
      angle,
      spread,
      speedMin,
      speedMax,
      lifeMin,
      lifeMax,
      sizeMin = 3,
      sizeMax = 7,
      gravity = 120
    ) {
      for (let index = 0; index < count; index += 1) {
        const launch = angle + rand(-spread, spread);
        const speed = rand(speedMin, speedMax);
        const life = rand(lifeMin, lifeMax);
        state.bursts.push({
          x,
          y,
          vx: Math.cos(launch) * speed,
          vy: Math.sin(launch) * speed,
          life,
          maxLife: life,
          size: rand(sizeMin, sizeMax),
          color,
          gravity
        });
      }
    }

    function addSmokePuff(x, y, color = "rgba(235, 244, 255, 0.26)", size = 18, life = 0.32, driftX = 0, driftY = -26) {
      state.smokePuffs.push({
        x,
        y,
        vx: driftX + rand(-12, 12),
        vy: driftY + rand(-10, 6),
        radius: size * rand(0.72, 1.08),
        growth: size * rand(0.7, 1.1),
        color,
        life,
        maxLife: life
      });
    }

    function addRing(x, y, color, radius, width, life, grow = 120) {
      state.rings.push({ x, y, color, radius, width, life, maxLife: life, grow });
    }

    function addTracer(fromX, fromY, toX, toY, color = "rgba(255, 242, 198, 0.74)", life = 0.12, width = 3.4) {
      state.tracers.push({ fromX, fromY, toX, toY, color, life, maxLife: life, width });
    }

    function registerHitPause(kind) {
      state.hitFlash = Math.max(state.hitFlash, kind === "ace" ? 0.22 : kind === "golden" ? 0.18 : 0.14);
      state.freezeTimer = Math.max(state.freezeTimer, kind === "ace" ? 0.06 : kind === "golden" ? 0.04 : 0.028);
    }

    function pulseImpact(x, y, strength = 0.14, water = false) {
      state.impactX = x;
      state.impactY = y;
      state.impactPulse = Math.max(state.impactPulse, strength);
      if (water) {
        state.waterFlash = Math.max(state.waterFlash, strength * 0.9);
      }
    }

    function kickWorld(powerX, powerY, heat = 0.08) {
      state.cameraOffsetX = clamp(state.cameraOffsetX + powerX, -18, 18);
      state.cameraOffsetY = clamp(state.cameraOffsetY + powerY, -18, 18);
      state.shotHeat = Math.max(state.shotHeat, heat);
    }

    function completeStage() {
      const def = activeStageDef();
      const shellsBanked = totalAmmo();
      const timeBonus = Math.max(0, Math.round(state.roundTimer * 16));
      const shellBonus = shellsBanked * 28;
      const cleanBonus = state.escaped === 0 ? 240 : state.escaped <= 1 ? 120 : 0;
      const carryShells = state.escaped === 0 ? 2 : state.escaped <= 1 ? 1 : 0;
      state.stageClearBonus = timeBonus + shellBonus + cleanBonus;
      state.score += state.stageClearBonus;
      state.carryShells = carryShells;
      playStageSound(true);
      state.stagePulse = 0.9;
      flashScreen("#ffd86e", 0.16);
      addBurst(WIDTH * 0.5, HEIGHT * 0.34, "#ffd86e", 22, 90, 280, 0.22, 0.58, 3, 7, 120);
      addSmokePuff(WIDTH * 0.5, HEIGHT * 0.36, "rgba(255, 228, 168, 0.24)", 42, 0.54, 0, -18);
      addFanBurst(WIDTH * 0.5, HEIGHT - 114, "rgba(255, 223, 150, 0.72)", 24, -Math.PI * 0.5, 1.2, 70, 220, 0.2, 0.46, 2, 5, 140);
      addRing(WIDTH * 0.5, HEIGHT * 0.4, "rgba(255, 216, 110, 0.82)", 68, 5, 0.34, 180);

      if (state.stage >= stageDefs.length - 1) {
        clearCount += 1;
        setScene("win");
        setMessage(
          "Gallery clear. Score " +
            state.score +
            ". " +
            (carryShells > 0 ? "Final cache secured." : "Last flock scattered."),
          4.4,
          "success"
        );
        return;
      }

      const next = stageDefs[state.stage + 1];
      const transition =
        next.act !== def.act
          ? next.chapter + " opens. " + next.goal
          : carryShells > 0
            ? "Scout cache found. +" + carryShells + " reserve shell" + (carryShells === 1 ? "" : "s") + " next set."
            : next.radio;
      queueStage(state.stage + 1, transition);
    }

    function failStage(reason) {
      setScene("lose");
      setMessage(stageDefs[state.stage].title + ": " + reason, 4.2, "warning");
      state.combo = 0;
      state.comboTimer = 0;
      playStageSound(false);
      flashScreen("#ff9f7a", 0.18);
      addBurst(WIDTH * 0.5, HEIGHT * 0.44, "#ff9f7a", 18, 70, 220, 0.2, 0.46, 3, 6, 130);
      addSmokePuff(WIDTH * 0.5, HEIGHT * 0.45, "rgba(255, 184, 148, 0.26)", 38, 0.52, 0, -14);
      addFanBurst(WIDTH * 0.5, HEIGHT - 118, "rgba(255, 177, 138, 0.62)", 18, -Math.PI * 0.5, 1.18, 60, 190, 0.16, 0.36, 2, 4, 120);
      addRing(WIDTH * 0.5, HEIGHT * 0.46, "rgba(255, 159, 122, 0.72)", 54, 4, 0.28, 160);
    }

    function rollDuckKind(def) {
      for (const special of def.specials) {
        if (Math.random() < special.chance) {
          return special.kind;
        }
      }
      return "duck";
    }

    function createDuck(def, options) {
      const dir = options.dir;
      const pattern = options.pattern;
      const kind = duckKinds[rollDuckKind(def)];
      const baseY = options.baseY + rand(-28, 28);
      const speed = (options.speed + options.index * 12) * kind.speedMul;
      const duck = {
        x: options.startX - dir * options.index * options.spacing,
        y: baseY,
        baseY,
        vx: dir * speed,
        phase: rand(0, Math.PI * 2),
        amp: rand(pattern === "rush" ? 8 : 18, pattern === "zigzag" ? 50 : 42) * kind.ampMul,
        wing: rand(0, 1),
        radius: kind.radius,
        alive: true,
        falling: false,
        vy: 0,
        rot: 0,
        pattern,
        swayRate: rand(3.3, pattern === "rush" ? 5.4 : 4.8) * (kind === duckKinds.swift ? 1.08 : 1),
        diveTimer: rand(0.65, 1.4),
        diveDepth: HEIGHT - rand(240, 320),
        recovering: false,
        diving: false,
        kind,
        hp: kind.hp,
        maxHp: kind.hp,
        wobble: rand(-0.4, 0.4),
        splashed: false
      };

      if (pattern === "rush") {
        duck.radius -= 2;
      } else if (pattern === "zigzag") {
        duck.amp += 10;
      }

      if (def.pattern === "mixed" && Math.random() > 0.55) {
        duck.pattern = Math.random() > 0.5 ? "dive" : "zigzag";
      }

      if (duck.kind === duckKinds.ace && duck.pattern === "sweep") {
        duck.pattern = "rush";
      }

      return duck;
    }

    function createFlock(def, options) {
      const ducks = [];
      const startX = options.dir === 1 ? -120 : WIDTH + 120;
      const size = options.size ?? def.flockSize;
      const speed = options.speed ?? def.speed + rand(-25, 40);
      const spacing = options.spacing ?? (def.pattern === "rush" ? 74 : 84);
      for (let index = 0; index < size; index += 1) {
        ducks.push(
          createDuck(def, {
            baseY: options.baseY,
            dir: options.dir,
            index,
            pattern: options.pattern ?? def.pattern,
            spacing,
            speed,
            startX
          })
        );
      }
      state.ducks.push(...ducks);
      return ducks;
    }

    function spawnWave() {
      const def = activeStageDef();
      const dir = Math.random() > 0.5 ? 1 : -1;
      const baseY = rand(def.altitudeMin, def.altitudeMax);
      const primaryFlock = createFlock(def, { baseY, dir });
      const primaryRare = primaryFlock.some((duck) => duck.kind === duckKinds.ace)
        ? 2
        : primaryFlock.some((duck) => duck.kind === duckKinds.golden)
          ? 1
          : 0;
      addSpawnPing(dir, baseY, primaryRare > 1 ? "#ffb890" : primaryRare > 0 ? "#ffd86e" : "#9fe7ff", primaryRare);
      pulseSpawnEdge(dir === 1 ? "left" : "right", baseY, primaryRare > 1 ? "#ffb890" : primaryRare > 0 ? "#ffd86e" : "#9fe7ff", primaryRare, false);
      playSpawnSound(primaryFlock.length, primaryRare, false, dir === 1 ? -0.74 : 0.74);

      if (Math.random() < def.crossChance) {
        const crossY = rand(def.altitudeMin, def.altitudeMax);
        const crossFlock = createFlock(def, {
          baseY: crossY,
          dir: -dir,
          pattern: def.pattern === "mixed" ? "zigzag" : def.pattern,
          size: Math.max(1, def.flockSize - 1),
          speed: def.speed + rand(8, 42),
          spacing: 78
        });
        const crossRare = crossFlock.some((duck) => duck.kind === duckKinds.ace)
          ? 2
          : crossFlock.some((duck) => duck.kind === duckKinds.golden)
            ? 1
            : 0;
        addSpawnPing(-dir, crossY, crossRare > 1 ? "#ffb890" : crossRare > 0 ? "#ffd86e" : "#b8f6ff", crossRare);
        pulseSpawnEdge(-dir === 1 ? "left" : "right", crossY, crossRare > 1 ? "#ffb890" : crossRare > 0 ? "#ffd86e" : "#b8f6ff", crossRare, true);
        playSpawnSound(crossFlock.length, crossRare, true, dir === 1 ? 0.74 : -0.74);
      }

      state.waveCount += 1;
      state.spawnTimer = rand(def.spawnMin, def.spawnMax);
    }

    function scoreHit(target) {
      state.score += target.kind.points;
      state.hits += target.kind.quotaValue;
      state.totalHits += 1;
      state.combo = state.comboTimer > 0 ? state.combo + 1 : 1;
      state.comboTimer = 1.35;

      if (target.kind.ammoBonus > 0) {
        state.shellsLeft += target.kind.ammoBonus;
        reward("Cache bird: +" + target.kind.ammoBonus + " shell", 1.5);
        playCacheSound(screenPan(target.x));
      }

      const text =
        target.kind === duckKinds.ace
          ? "Night Baron down."
          : target.kind === duckKinds.golden
            ? "Golden pintail cache."
            : target.kind === duckKinds.swift
              ? "Swift drake clipped."
              : "Hit.";
      announce(text, 1.25, target.kind === duckKinds.golden ? "success" : target.kind === duckKinds.ace ? "warning" : "success");
      playHitSound(target.kind === duckKinds.ace ? "ace" : target.kind === duckKinds.golden ? "golden" : "duck", screenPan(target.x));
      if (state.combo >= 2) {
        reward("Combo x" + state.combo, 1.1);
        playComboSound(state.combo, screenPan(target.x));
        state.comboFlash = Math.max(state.comboFlash, clamp(0.14 + state.combo * 0.025, 0.14, 0.3));
        addRing(target.x, target.y, "rgba(255, 232, 167, 0.52)", 24 + state.combo * 3, 2.4, 0.18, 118 + state.combo * 8);
        if (state.combo >= 3) {
          flashScreen("#ffe8a7", 0.045);
        }
      }
    }

    function hitDuck(target) {
      target.hp -= 1;
      if (target.hp > 0) {
        target.vx *= 1.1;
        target.phase += 0.9;
        state.score += 80;
        announce(target.kind.label + " armor cracked.", 1.25, "warning");
        reward("Ace birds need two hits", 1.2);
        playHitSound("ace", screenPan(target.x));
        kickWorld(clamp((target.x - WIDTH * 0.5) * 0.01, -4.8, 4.8), 3.8, 0.18);
        addTracer(pointer.x, pointer.y, target.x, target.y, "rgba(255, 180, 152, 0.82)", 0.16, 3.6);
        addBurst(target.x, target.y, "#ff9f7a", 9, 70, 180, 0.18, 0.34, 3, 6);
        addFanBurst(target.x, target.y + 4, "rgba(255, 206, 176, 0.82)", 10, -Math.PI * 0.5, 1.1, 40, 150, 0.16, 0.28, 2, 4, 150);
        addRing(target.x, target.y, "rgba(255, 159, 122, 0.8)", 18, 3, 0.22, 90);
        addRing(target.x, target.y, "rgba(255, 207, 184, 0.44)", 34, 1.5, 0.18, 76);
        addPopup("+80", target.x, target.y - 18, "#ffd0b8", 0.72);
        registerHitPause("ace");
        pulseImpact(target.x, target.y, 0.14);
        flashScreen("#ffb890", 0.08);
        return;
      }

      target.falling = true;
      target.vy = -120;
      target.rot = target.vx * 0.003;
      scoreHit(target);
      kickWorld(
        clamp((target.x - WIDTH * 0.5) * 0.012, -5.8, 5.8),
        target.kind === duckKinds.ace ? 5.2 : target.kind === duckKinds.golden ? 4.3 : 3.4,
        target.kind === duckKinds.ace ? 0.24 : target.kind === duckKinds.golden ? 0.2 : 0.16
      );
      registerHitPause(target.kind === duckKinds.ace ? "ace" : target.kind === duckKinds.golden ? "golden" : "duck");
      addPopup("+" + target.kind.points, target.x, target.y - 20, target.kind.glow || "#f8fffc");
      addRipple(target.x, HEIGHT - 96, 0.6, 22, target.kind.glow || "#ffffff", 54);
      addBurst(
        target.x,
        target.y,
        target.kind.glow || target.kind.head,
        target.kind === duckKinds.ace ? 18 : target.kind === duckKinds.golden ? 14 : 10,
        90,
        target.kind === duckKinds.ace ? 260 : 220,
        0.22,
        0.5,
        3,
        target.kind === duckKinds.ace ? 8 : 6
      );
      addRing(
        target.x,
        target.y,
        target.kind === duckKinds.ace ? "rgba(255, 143, 114, 0.88)" : target.kind === duckKinds.golden ? "rgba(255, 216, 110, 0.92)" : "rgba(248, 255, 252, 0.7)",
        target.kind === duckKinds.ace ? 20 : 16,
        target.kind === duckKinds.ace ? 4 : 3,
        target.kind === duckKinds.ace ? 0.34 : 0.28,
        target.kind === duckKinds.ace ? 180 : 140
      );
      addFanBurst(
        target.x,
        target.y + 2,
        target.kind.glow || "rgba(255, 248, 222, 0.82)",
        target.kind === duckKinds.ace ? 14 : target.kind === duckKinds.golden ? 12 : 9,
        target.vx < 0 ? Math.PI : 0,
        1.2,
        55,
        target.kind === duckKinds.ace ? 210 : 170,
        0.16,
        0.34,
        2,
        target.kind === duckKinds.ace ? 5 : 4,
        110
      );
      addTracer(
        target.x - target.vx * 0.05,
        target.y + 6,
        target.x + target.vx * 0.09,
        target.y - 10,
        target.kind === duckKinds.ace
          ? "rgba(255, 176, 144, 0.84)"
          : target.kind === duckKinds.golden
            ? "rgba(255, 229, 148, 0.82)"
            : "rgba(248, 255, 252, 0.66)",
        0.12,
        target.kind === duckKinds.ace ? 4.2 : 3.2
      );
      for (let index = 0; index < 7; index += 1) {
        state.feathers.push({
          x: target.x,
          y: target.y,
          vx: rand(-90, 90),
          vy: rand(-180, -40),
          life: rand(0.35, 0.6),
          color: target.kind.glow || target.kind.head
        });
      }
      pulseImpact(target.x, target.y, target.kind === duckKinds.ace ? 0.24 : target.kind === duckKinds.golden ? 0.19 : 0.15);
      flashScreen(target.kind.glow || "#f8fffc", target.kind === duckKinds.ace ? 0.12 : target.kind === duckKinds.golden ? 0.1 : 0.07);
    }

    function fireShot() {
      ensureAudio();

      if (state.scene === "menu") {
        startRun();
        return;
      }

      if (state.scene === "briefing") {
        startStage(state.stage);
        return;
      }

      if (state.scene === "lose" || state.scene === "win") {
        startRun();
        return;
      }

      if (state.scene !== "play" || state.shotCooldown > 0) {
        return;
      }

      if (state.clip <= 0) {
        if (state.shellsLeft > 0) {
          triggerReload();
          announce("Reloading.", 1.1, "warning");
        } else {
          announce("Out of shells.", 1.2, "warning");
          if (state.dryFireCooldown <= 0) {
            playDryFireSound();
            state.dryFireCooldown = 0.16;
            kickWorld(0, 1.2, 0.04);
          }
        }
        return;
      }

      state.clip -= 1;
      state.shotCooldown = 0.12;
      state.shotFlashes.push({ x: pointer.x, y: pointer.y, life: 0.16 });
      addBurst(pointer.x, pointer.y, "#ffe6a5", 7, 90, 220, 0.08, 0.18, 2, 5);
      addRing(pointer.x, pointer.y, "rgba(255, 230, 168, 0.52)", 12, 2, 0.14, 88);
      addTracer(pointer.x, HEIGHT - 28, pointer.x, pointer.y, "rgba(255, 233, 167, 0.76)", 0.09, 2.8);
      addFanBurst(pointer.x, HEIGHT - 34, "rgba(255, 226, 179, 0.62)", 9, -Math.PI * 0.5, 0.5, 36, 116, 0.12, 0.26, 2, 4, -30);
      addSmokePuff(pointer.x + rand(-4, 4), pointer.y + 6, "rgba(255, 228, 184, 0.28)", 22, 0.28, clamp((pointer.x - WIDTH * 0.5) * 0.02, -10, 10), -34);
      addSmokePuff(pointer.x + rand(-6, 6), pointer.y + 10, "rgba(213, 233, 255, 0.18)", 14, 0.24, clamp((pointer.x - WIDTH * 0.5) * 0.016, -8, 8), -24);
      kickWorld(clamp((pointer.x - WIDTH * 0.5) * -0.006, -3.6, 3.6), 2.8, 0.11);
      state.casings.push({
        x: pointer.x + 22,
        y: pointer.y + 10,
        vx: rand(80, 140),
        vy: rand(-120, -70),
        rot: rand(-1.2, 1.2),
        spin: rand(-8, 8),
        life: 0.5,
        maxLife: 0.5
      });
      playShotSound();

      let target = null;
      let nearMissDuck = null;
      let best = 999999;
      let nearMissBest = 999999;
      for (const duck of state.ducks) {
        if (!duck.alive || duck.falling) {
          continue;
        }
        const dx = duck.x - pointer.x;
        const dy = duck.y - pointer.y;
        const dist = Math.hypot(dx, dy);
        if (dist < duck.radius + 58 && dist < nearMissBest) {
          nearMissBest = dist;
          nearMissDuck = duck;
        }
        if (dist < duck.radius + 16 && dist < best) {
          best = dist;
          target = duck;
        }
      }

      if (target) {
        addTracer(
          pointer.x,
          pointer.y,
          target.x,
          target.y,
          target.kind.glow ? "rgba(255, 216, 110, 0.92)" : "rgba(255, 250, 220, 0.84)",
          0.14,
          target.kind === duckKinds.ace ? 4.4 : 3.2
        );
        hitDuck(target);
      } else {
        announce(nearMissDuck ? "Near miss." : "Miss.", nearMissDuck ? 1.05 : 0.95, nearMissDuck ? "info" : "warning");
        playMissSound(screenPan(pointer.x));
        if (nearMissDuck) {
          const proximity = clamp((nearMissBest - nearMissDuck.radius - 16) / 42, 0, 1);
          playNearMissSound(proximity, screenPan(pointer.x));
          addRing(nearMissDuck.x, nearMissDuck.y, "rgba(191, 232, 255, 0.52)", nearMissDuck.radius + 6, 2.2, 0.14, 70);
          addBurst(nearMissDuck.x, nearMissDuck.y, "rgba(191, 232, 255, 0.64)", 5, 40, 110, 0.1, 0.18, 1.5, 3.5);
        }
        if (pointer.y > HEIGHT - 150) {
          addRipple(pointer.x, HEIGHT - 96, 0.45, 14, "#bfe8ff", 58);
          addBurst(pointer.x, HEIGHT - 102, "#bfe8ff", 8, 40, 140, 0.16, 0.34, 2, 4, 220);
          addFanBurst(pointer.x, HEIGHT - 104, "rgba(235, 248, 255, 0.72)", 12, -Math.PI * 0.5, 0.7, 40, 180, 0.14, 0.3, 2, 4, 260);
          addSmokePuff(pointer.x, HEIGHT - 104, "rgba(215, 240, 255, 0.22)", 20, 0.26, 0, -18);
          playWaterRicochetSound(screenPan(pointer.x));
          pulseImpact(pointer.x, HEIGHT - 104, 0.13, true);
          flashScreen("#bfe8ff", 0.05);
        }
      }

      if (state.clip === 0) {
        triggerReload();
      }
    }

    function updateDuck(duck, dt) {
      duck.wing += dt * 10;

      if (duck.falling) {
        duck.vy += 980 * dt;
        duck.y += duck.vy * dt;
        duck.x += duck.vx * 0.28 * dt;
        if (!duck.splashed && duck.y >= HEIGHT - 104) {
          duck.splashed = true;
          const splashColor = duck.kind.glow || "#bfe8ff";
          const splashX = clamp(duck.x, 36, WIDTH - 36);
          addRipple(splashX, HEIGHT - 96, duck.kind === duckKinds.ace ? 0.68 : 0.62, duck.kind === duckKinds.ace ? 26 : 20, duck.kind.glow || "#ffffff", 60);
          addBurst(splashX, HEIGHT - 102, splashColor, duck.kind === duckKinds.ace ? 16 : 10, 50, 170, 0.18, 0.42, 2, 5, 210);
          addFanBurst(
            splashX,
            HEIGHT - 104,
            duck.kind === duckKinds.golden ? "rgba(255, 235, 175, 0.8)" : "rgba(227, 243, 255, 0.76)",
            duck.kind === duckKinds.ace ? 18 : 12,
            -Math.PI * 0.5,
            0.76,
            46,
            duck.kind === duckKinds.ace ? 210 : 170,
            0.16,
            0.34,
            2,
            5,
            280
          );
          addRing(splashX, HEIGHT - 96, "rgba(191, 232, 255, 0.68)", 14, 3, 0.28, 120);
          addSmokePuff(
            splashX,
            HEIGHT - 106,
            duck.kind === duckKinds.golden ? "rgba(255, 236, 182, 0.22)" : "rgba(214, 236, 255, 0.18)",
            duck.kind === duckKinds.ace ? 24 : 18,
            duck.kind === duckKinds.ace ? 0.34 : 0.28,
            0,
            -14
          );
          playSplashSound(duck.kind === duckKinds.ace ? "ace" : duck.kind === duckKinds.golden ? "golden" : "duck", screenPan(splashX));
          pulseImpact(splashX, HEIGHT - 104, duck.kind === duckKinds.ace ? 0.18 : 0.13, true);
        }
        if (duck.y > HEIGHT - 48) {
          duck.alive = false;
        }
        return;
      }

      duck.phase += dt * duck.swayRate;
      duck.x += duck.vx * dt;

      if (duck.pattern === "zigzag") {
        duck.y += Math.sin(duck.phase * 2.1) * duck.amp * dt * 1.35;
        duck.x += Math.sin(duck.phase * 1.45 + duck.wobble) * 38 * dt;
      } else if (duck.pattern === "rush") {
        duck.y += Math.sin(duck.phase * 1.35) * duck.amp * dt * 1.2;
        duck.x += duck.vx * dt * 0.16;
      } else {
        duck.y += Math.sin(duck.phase) * duck.amp * dt * 2.2;
      }

      if (duck.pattern === "dive" || duck.pattern === "mixed") {
        duck.diveTimer -= dt;
        if (duck.diving) {
          duck.y += (duck.kind === duckKinds.ace ? 250 : 220) * dt;
          if (duck.y >= duck.diveDepth || duck.diveTimer <= 0) {
            duck.diving = false;
            duck.recovering = true;
            duck.diveTimer = rand(0.35, 0.6);
          }
        } else if (duck.recovering) {
          duck.y -= 230 * dt;
          if (duck.y <= duck.baseY) {
            duck.recovering = false;
            duck.diveTimer = rand(0.8, 1.45);
          }
        } else if (duck.diveTimer <= 0) {
          duck.diving = true;
          duck.diveTimer = rand(0.4, 0.8);
        }
      }

      if ((duck.vx > 0 && duck.x > WIDTH + 150) || (duck.vx < 0 && duck.x < -150)) {
        duck.alive = false;
        state.escaped += duck.kind === duckKinds.ace ? 2 : 1;
      }
    }

    function updatePlay(dt) {
      const def = activeStageDef();
      const ambientTarget = def.fog > 0.06 || state.stage >= 7 ? 18 : state.stage >= 4 ? 14 : 10;

      state.roundTimer -= dt;
      state.spawnTimer -= dt;
      state.shotCooldown = Math.max(0, state.shotCooldown - dt);
      state.reloadBlink = Math.max(0, state.reloadBlink - dt);
      state.reloadReadyPulse = Math.max(0, state.reloadReadyPulse - dt * 1.2);
      state.lastRewardTimer = Math.max(0, state.lastRewardTimer - dt);
      state.comboTimer = Math.max(0, state.comboTimer - dt);
      state.comboFlash = Math.max(0, state.comboFlash - dt * 1.8);
      state.hitFlash = Math.max(0, state.hitFlash - dt);
      state.stagePulse = Math.max(0, state.stagePulse - dt * 0.8);
      state.shotHeat = Math.max(0, state.shotHeat - dt * 1.3);
      state.impactPulse = Math.max(0, state.impactPulse - dt * 2.2);
      state.waterFlash = Math.max(0, state.waterFlash - dt * 1.8);
      state.screenFlash = Math.max(0, state.screenFlash - dt * 2.4);
      state.dryFireCooldown = Math.max(0, state.dryFireCooldown - dt);
      state.cameraOffsetX = approach(state.cameraOffsetX, 0, dt * 30);
      state.cameraOffsetY = approach(state.cameraOffsetY, 0, dt * 34);
      updateMusic(dt);

      if (state.comboTimer <= 0) {
        state.combo = 0;
      }

      if (state.reloadTimer > 0) {
        state.reloadTimer -= dt;
        if (state.reloadTimer <= 0) {
          finishReload();
        }
      }

      if (state.spawnTimer <= 0 && state.hits < def.quota) {
        spawnWave();
      }

      for (const duck of state.ducks) {
        updateDuck(duck, dt);
      }
      state.ducks = state.ducks.filter((duck) => duck.alive);

      for (const flash of state.shotFlashes) {
        flash.life -= dt;
      }
      state.shotFlashes = state.shotFlashes.filter((flash) => flash.life > 0);

      for (const ripple of state.ripples) {
        ripple.life -= dt;
        ripple.size += dt * (ripple.grow ?? 48);
      }
      state.ripples = state.ripples.filter((ripple) => ripple.life > 0);

      for (const feather of state.feathers) {
        feather.life -= dt;
        feather.vy += 420 * dt;
        feather.x += feather.vx * dt;
        feather.y += feather.vy * dt;
      }
      state.feathers = state.feathers.filter((feather) => feather.life > 0);

      for (const casing of state.casings) {
        casing.life -= dt;
        casing.vy += 520 * dt;
        casing.x += casing.vx * dt;
        casing.y += casing.vy * dt;
        casing.rot += casing.spin * dt;
      }
      state.casings = state.casings.filter((casing) => casing.life > 0 && casing.y < HEIGHT - 36);

      for (const burst of state.bursts) {
        burst.life -= dt;
        burst.vy += (burst.gravity ?? 120) * dt;
        burst.x += burst.vx * dt;
        burst.y += burst.vy * dt;
      }
      state.bursts = state.bursts.filter((burst) => burst.life > 0);

      for (const puff of state.smokePuffs) {
        puff.life -= dt;
        puff.x += puff.vx * dt;
        puff.y += puff.vy * dt;
        puff.radius += puff.growth * dt;
      }
      state.smokePuffs = state.smokePuffs.filter((puff) => puff.life > 0);

      for (const ring of state.rings) {
        ring.life -= dt;
        ring.radius += ring.grow * dt;
      }
      state.rings = state.rings.filter((ring) => ring.life > 0);

      for (const tracer of state.tracers) {
        tracer.life -= dt;
      }
      state.tracers = state.tracers.filter((tracer) => tracer.life > 0);

      for (const popup of state.popups) {
        popup.life -= dt;
        popup.y += popup.vy * dt;
        popup.x += Math.sin(state.time * 10 + popup.maxLife) * dt * 8;
      }
      state.popups = state.popups.filter((popup) => popup.life > 0);

      for (const ping of state.spawnPings) {
        ping.life -= dt;
      }
      state.spawnPings = state.spawnPings.filter((ping) => ping.life > 0);

      repopulateAmbientMotes(def, ambientTarget);
      for (const mote of state.ambientMotes) {
        mote.life -= dt;
        mote.x += mote.vx * dt;
        mote.y += mote.vy * dt + Math.sin(state.time * mote.pulseRate + mote.pulse) * dt * (mote.late ? 8 : 5);
        if (mote.lowBand) {
          mote.y = clamp(mote.y, 124, HEIGHT - 116);
        } else {
          mote.y = clamp(mote.y, 88, HEIGHT - 148);
        }
      }
      state.ambientMotes = state.ambientMotes.filter((mote) =>
        mote.life > 0 &&
        mote.x > -72 &&
        mote.x < WIDTH + 72 &&
        mote.y > 72 &&
        mote.y < HEIGHT - 88
      );

      if (state.messageTimer > 0) {
        state.messageTimer -= dt;
      }

      if (state.hits >= def.quota && state.ducks.length === 0) {
        completeStage();
        return;
      }

      if (state.roundTimer <= 0) {
        failStage("Clock out. The flock slipped through.");
        return;
      }

      if (totalAmmo() === 0 && state.ducks.every((duck) => duck.falling)) {
        if (state.hits >= def.quota) {
          completeStage();
        } else {
          failStage("Out of shells. The lane broke.");
        }
      } else if (totalAmmo() === 0 && state.ducks.length === 0) {
        if (state.hits >= def.quota) {
          completeStage();
        } else {
          failStage("Out of shells. The lane broke.");
        }
      }
    }

    function update(dt) {
      state.time += dt;
      state.sceneTimer += dt;
      state.sceneFlash = Math.max(0, state.sceneFlash - dt * 1.4);
      state.sceneRipple = Math.max(0, state.sceneRipple - dt * 1.1);

      for (const mote of state.sceneMotes) {
        mote.life -= dt;
        mote.x += mote.vx * dt;
        mote.y += mote.vy * dt;
      }
      state.sceneMotes = state.sceneMotes.filter((mote) => mote.life > 0 && mote.x > -80 && mote.x < WIDTH + 80 && mote.y > -60 && mote.y < HEIGHT + 60);
      if (state.scene !== "play" && state.sceneMotes.length < 16) {
        spawnSceneMotes(2);
      }

      if (state.freezeTimer > 0) {
        state.freezeTimer = Math.max(0, state.freezeTimer - dt);
        return;
      }

      if (keys.has("Space")) {
        keys.delete("Space");
        fireShot();
      }

      if (keys.has("Enter") && (state.scene === "menu" || state.scene === "win" || state.scene === "lose")) {
        keys.delete("Enter");
        startRun();
      }

      if (keys.has("KeyR") && (state.scene === "win" || state.scene === "lose")) {
        keys.delete("KeyR");
        startRun();
      }

      if (keys.has("Enter") && state.scene === "briefing") {
        keys.delete("Enter");
        startStage(state.stage);
      }

      if (state.scene === "play") {
        updatePlay(dt);
      } else if (state.scene === "briefing") {
        state.cardTimer = Math.max(0, state.cardTimer - dt);
        if (state.cardTimer <= 0) {
          startStage(state.stage);
        }
      } else if (state.messageTimer > 0) {
        state.messageTimer -= dt;
      }
    }

    function drawSky() {
      const def = activeStageDef();
      const sky = ctx.createLinearGradient(0, 0, 0, HEIGHT);
      sky.addColorStop(0, def.skyTop);
      sky.addColorStop(0.58, def.skyBottom);
      sky.addColorStop(1, def.water);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.fillStyle = state.stage >= 8 ? "rgba(255, 210, 186, 0.52)" : "rgba(255, 240, 168, 0.9)";
      ctx.beginPath();
      ctx.arc(def.sunX, def.sunY, state.stage >= 8 ? 46 : 58, 0, Math.PI * 2);
      ctx.fill();

      const halo = ctx.createRadialGradient(def.sunX, def.sunY, 10, def.sunX, def.sunY, state.stage >= 8 ? 160 : 210);
      halo.addColorStop(0, state.stage >= 8 ? "rgba(255, 227, 196, 0.34)" : "rgba(255, 248, 194, 0.4)");
      halo.addColorStop(0.55, state.stage >= 8 ? "rgba(255, 186, 132, 0.16)" : "rgba(255, 221, 146, 0.14)");
      halo.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = halo;
      ctx.fillRect(def.sunX - 220, def.sunY - 220, 440, 440);

      for (let index = 0; index < 6; index += 1) {
        const x = (state.time * (18 + index * 4) + index * 210) % (WIDTH + 220) - 110;
        const y = 80 + index * 42;
        ctx.fillStyle = "rgba(255,255,255," + (0.38 - def.fog * 0.4) + ")";
        ctx.beginPath();
        ctx.ellipse(x, y, 64, 22, 0, 0, Math.PI * 2);
        ctx.ellipse(x + 48, y + 8, 54, 18, 0, 0, Math.PI * 2);
        ctx.ellipse(x - 44, y + 8, 50, 18, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      if (state.stage >= 7) {
        ctx.fillStyle = "rgba(255,255,255,0.18)";
        for (let index = 0; index < 18; index += 1) {
          const x = (index * 71) % WIDTH;
          const y = 48 + (index % 6) * 28;
          ctx.fillRect(x, y, 2, 2);
        }
      }

      if (def.fog > 0) {
        ctx.fillStyle = "rgba(245, 247, 250, " + def.fog.toFixed(3) + ")";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }
    }

    function drawAmbientMotes() {
      if (state.scene !== "play") {
        return;
      }

      const def = activeStageDef();
      const pressure = currentPressure(def);
      const palette = ambientPalette(def);
      for (const mote of state.ambientMotes) {
        const lifeAlpha = clamp(mote.life / 2.4, 0, 1);
        const pulse = 0.78 + Math.sin(state.time * mote.pulseRate + mote.pulse) * 0.22;
        const glowAlpha = (0.12 + pressure * 0.08) * lifeAlpha * pulse;
        ctx.fillStyle = palette.glow.replace(/[\d.]+\)$/, glowAlpha.toFixed(3) + ")");
        ctx.beginPath();
        ctx.arc(mote.x, mote.y, mote.radius * (mote.late ? 4.8 : 3.4), 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = palette.fill.replace(/[\d.]+\)$/, (lifeAlpha * (mote.late ? 0.95 : 0.72)).toFixed(3) + ")");
        ctx.beginPath();
        ctx.arc(mote.x, mote.y, mote.radius * (0.8 + pulse * 0.3), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawMarsh() {
      const def = activeStageDef();
      const pressure = currentPressure(def);
      ctx.fillStyle = def.grass;
      ctx.fillRect(0, HEIGHT - 168, WIDTH, 94);

      ctx.fillStyle = def.water;
      ctx.fillRect(0, HEIGHT - 116, WIDTH, 116);

      const horizonGlow = ctx.createLinearGradient(0, HEIGHT - 176, 0, HEIGHT - 60);
      horizonGlow.addColorStop(0, "rgba(255, 245, 219, 0.16)");
      horizonGlow.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = horizonGlow;
      ctx.fillRect(0, HEIGHT - 176, WIDTH, 116);

      const reflection = ctx.createLinearGradient(def.sunX, HEIGHT - 116, def.sunX, HEIGHT);
      reflection.addColorStop(0, state.stage >= 8 ? "rgba(255, 197, 137, 0.24)" : "rgba(255, 241, 179, 0.24)");
      reflection.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = reflection;
      ctx.fillRect(def.sunX - 84, HEIGHT - 116, 168, 116);

      ctx.fillStyle = "rgba(255,255,255,0.16)";
      for (let index = 0; index < 12; index += 1) {
        const x = index * 110 + (state.time * 30) % 110;
        ctx.fillRect(x, HEIGHT - 82, 58, 4);
      }

      const shimmerCount = state.stage >= 7 ? 12 : state.stage >= 4 ? 9 : 6;
      for (let index = 0; index < shimmerCount; index += 1) {
        const cycle = state.time * (18 + index * 1.8) + index * 1.9;
        const x = ((cycle * 34) + index * 138) % (WIDTH + 180) - 90;
        const y = HEIGHT - 98 + Math.sin(cycle * 0.42) * (state.stage >= 7 ? 18 : 11);
        const width = 26 + Math.sin(cycle * 0.6) * 8 + pressure * 16;
        const alpha = 0.08 + pressure * 0.05 + (state.stage >= 7 ? 0.04 : 0);
        ctx.fillStyle = state.stage >= 7
          ? "rgba(255, 211, 154, " + alpha.toFixed(3) + ")"
          : "rgba(223, 246, 255, " + alpha.toFixed(3) + ")";
        ctx.fillRect(x, y, width, 2.2);
      }

      ctx.fillStyle = "rgba(17, 34, 43, 0.32)";
      ctx.fillRect(880, HEIGHT - 220, 130, 62);
      ctx.fillRect(896, HEIGHT - 268, 98, 48);
      ctx.fillStyle = "#f8d592";
      ctx.fillRect(930, HEIGHT - 248, 18, 18);
      ctx.fillRect(962, HEIGHT - 248, 18, 18);
      ctx.fillStyle = "rgba(255, 218, 124, 0.18)";
      ctx.fillRect(928, HEIGHT - 242, 56, 36);

      ctx.fillStyle = def.mud;
      ctx.fillRect(0, HEIGHT - 52, WIDTH, 52);

      ctx.strokeStyle = "rgba(37, 26, 18, 0.65)";
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(180, HEIGHT - 110);
      ctx.lineTo(290, HEIGHT - 150);
      ctx.lineTo(366, HEIGHT - 98);
      ctx.stroke();

      for (let index = 0; index < WIDTH; index += 22) {
        const h = 42 + Math.sin(index * 0.03) * 14;
        ctx.strokeStyle = index % 44 === 0 ? "#b6905b" : def.grass;
        ctx.lineWidth = index % 44 === 0 ? 4 : 3;
        ctx.beginPath();
        ctx.moveTo(index, HEIGHT - 112);
        ctx.lineTo(index + Math.sin(index * 0.07 + state.time) * 5, HEIGHT - 112 - h);
        ctx.stroke();
      }
    }

    function drawDuckReflection(duck) {
      if (duck.falling) {
        return;
      }

      const waterline = HEIGHT - 94;
      const distance = clamp((waterline - duck.y) / 300, 0, 1);
      if (distance <= 0) {
        return;
      }

      const alpha = 0.07 + distance * 0.08 + (duck.kind === duckKinds.golden ? 0.03 : 0);
      const stretch = 1 + (1 - distance) * 0.55;
      ctx.save();
      ctx.translate(duck.x, waterline + distance * 18);
      ctx.scale(duck.vx < 0 ? -1 : 1, 1);
      ctx.fillStyle = duck.kind.glow ? "rgba(255, 216, 110, " + alpha.toFixed(3) + ")" : "rgba(12, 35, 45, " + alpha.toFixed(3) + ")";
      ctx.beginPath();
      ctx.ellipse(-10, 0, 22 * stretch, 7, 0, 0, Math.PI * 2);
      ctx.ellipse(12, -4, 13 * stretch, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawDuck(duck) {
      ctx.save();
      ctx.translate(duck.x, duck.y);
      if (duck.falling) {
        ctx.rotate(duck.rot + duck.vy * 0.0008);
      }
      if (duck.vx < 0) {
        ctx.scale(-1, 1);
      }

      if (duck.kind.glow) {
        ctx.fillStyle = duck.kind.glow + "30";
        ctx.beginPath();
        ctx.arc(-2, -8, duck.radius + 10, 0, Math.PI * 2);
        ctx.fill();
      }

      const wingLift = Math.sin(duck.wing) * 12;
      ctx.fillStyle = duck.kind.body;
      ctx.beginPath();
      ctx.ellipse(-12, -4, 18, 14, 0.15, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = duck.kind.head;
      ctx.beginPath();
      ctx.ellipse(10, -12, 16, 12, 0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = duck.kind.wing;
      ctx.lineWidth = duck.kind === duckKinds.ace ? 5 : 4;
      ctx.beginPath();
      ctx.moveTo(-18, -2);
      ctx.lineTo(-34, -18 - wingLift);
      ctx.moveTo(-6, 0);
      ctx.lineTo(-22, 18 + wingLift * 0.3);
      ctx.stroke();

      ctx.fillStyle = duck.kind.beak;
      ctx.beginPath();
      ctx.moveTo(26, -10);
      ctx.lineTo(42, -5);
      ctx.lineTo(27, 0);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#17353b";
      ctx.beginPath();
      ctx.arc(16, -14, 2.8, 0, Math.PI * 2);
      ctx.fill();

      if (duck.maxHp > 1 && !duck.falling) {
        ctx.fillStyle = "rgba(9, 24, 29, 0.85)";
        ctx.fillRect(-20, 22, 40, 7);
        ctx.fillStyle = duck.hp === duck.maxHp ? "#ffd86e" : "#ff8f72";
        ctx.fillRect(-18, 24, 16 * duck.hp, 3);
      }
      ctx.restore();
    }

    function drawCrosshair() {
      const pulse = 1 + Math.sin(state.time * 8) * 0.06 + state.hitFlash * 0.18;
      ctx.save();
      ctx.translate(pointer.x, pointer.y);
      ctx.scale(pulse, pulse);
      ctx.strokeStyle = state.reloadTimer > 0 ? "#ff6f5e" : state.reloadReadyPulse > 0 ? "#ffd86e" : "#f8fffc";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2);
      ctx.moveTo(-34, 0);
      ctx.lineTo(-12, 0);
      ctx.moveTo(12, 0);
      ctx.lineTo(34, 0);
      ctx.moveTo(0, -34);
      ctx.lineTo(0, -12);
      ctx.moveTo(0, 12);
      ctx.lineTo(0, 34);
      ctx.stroke();

      if (state.reloadReadyPulse > 0) {
        ctx.strokeStyle = "rgba(255, 216, 110, " + clamp(state.reloadReadyPulse * 0.8, 0, 0.8).toFixed(3) + ")";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, 30 + (1 - state.reloadReadyPulse / 0.52) * 10, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();

      if (state.reloadTimer > 0) {
        const w = 116;
        const h = 14;
        const x = clamp(pointer.x - w * 0.5, 10, WIDTH - w - 10);
        const belowY = pointer.y + 34;
        const aboveY = pointer.y - 48;
        const y = clamp(pointer.y > HEIGHT - 78 ? aboveY : belowY, 10, HEIGHT - h - 10);
        ctx.fillStyle = "rgba(9, 24, 29, 0.82)";
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = "#ffcf6a";
        ctx.fillRect(x + 2, y + 2, (w - 4) * (1 - state.reloadTimer / 0.72), h - 4);
        ctx.strokeStyle = "rgba(255,255,255,0.28)";
        ctx.strokeRect(x, y, w, h);
      }
    }

    function drawPopups() {
      ctx.textAlign = "center";
      ctx.font = "700 17px Trebuchet MS";
      for (const popup of state.popups) {
        const alpha = popup.life / popup.maxLife;
        ctx.fillStyle = "rgba(5,22,28," + (alpha * 0.55).toFixed(3) + ")";
        ctx.fillText(popup.text, popup.x + 1, popup.y + 1);
        ctx.fillStyle = popup.color;
        ctx.fillText(popup.text, popup.x, popup.y);
      }
      ctx.textAlign = "left";
    }

    function drawCasings() {
      for (const casing of state.casings) {
        const alpha = casing.life / casing.maxLife;
        ctx.save();
        ctx.translate(casing.x, casing.y);
        ctx.rotate(casing.rot);
        ctx.fillStyle = "rgba(255,214,108," + alpha.toFixed(3) + ")";
        ctx.fillRect(-5, -2, 10, 4);
        ctx.strokeStyle = "rgba(111,71,18," + alpha.toFixed(3) + ")";
        ctx.lineWidth = 1.2;
        ctx.strokeRect(-5, -2, 10, 4);
        ctx.restore();
      }
    }

    function drawBursts() {
      for (const burst of state.bursts) {
        const alpha = burst.life / burst.maxLife;
        const radius = Math.max(1, burst.size * alpha);
        ctx.fillStyle = burst.color;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(burst.x, burst.y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function drawSmokePuffs() {
      for (const puff of state.smokePuffs) {
        const alpha = puff.life / puff.maxLife;
        const rgb = colorToRgb(puff.color);
        const glow = ctx.createRadialGradient(puff.x, puff.y, 2, puff.x, puff.y, puff.radius);
        glow.addColorStop(0, "rgba(" + rgb + "," + (alpha * 0.32).toFixed(3) + ")");
        glow.addColorStop(0.48, "rgba(" + rgb + "," + (alpha * 0.16).toFixed(3) + ")");
        glow.addColorStop(1, "rgba(" + rgb + ",0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(puff.x, puff.y, puff.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawRings() {
      for (const ring of state.rings) {
        const alpha = ring.life / ring.maxLife;
        ctx.strokeStyle = ring.color.replace(/[\d.]+\)$/, alpha.toFixed(3) + ")");
        ctx.lineWidth = ring.width;
        ctx.beginPath();
        ctx.arc(ring.x, ring.y, ring.radius, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawTracers() {
      for (const tracer of state.tracers) {
        const alpha = tracer.life / tracer.maxLife;
        const gradient = ctx.createLinearGradient(tracer.fromX, tracer.fromY, tracer.toX, tracer.toY);
        gradient.addColorStop(0, tracer.color.replace(/[\d.]+\)$/, (alpha * 0.08).toFixed(3) + ")"));
        gradient.addColorStop(0.35, tracer.color.replace(/[\d.]+\)$/, (alpha * 0.32).toFixed(3) + ")"));
        gradient.addColorStop(1, tracer.color.replace(/[\d.]+\)$/, (alpha * 0.92).toFixed(3) + ")"));
        ctx.strokeStyle = gradient;
        ctx.lineWidth = tracer.width;
        ctx.beginPath();
        ctx.moveTo(tracer.fromX, tracer.fromY);
        ctx.lineTo(tracer.toX, tracer.toY);
        ctx.stroke();
      }
    }

    function layoutEdgeMarkers(markers, minY, maxY, gap = 34) {
      const laidOut = markers
        .map((marker) => ({ ...marker, drawY: clamp(marker.y, minY, maxY) }))
        .sort((left, right) => left.drawY - right.drawY);

      for (let index = 1; index < laidOut.length; index += 1) {
        if (laidOut[index].drawY - laidOut[index - 1].drawY < gap) {
          laidOut[index].drawY = laidOut[index - 1].drawY + gap;
        }
      }

      if (laidOut.length && laidOut[laidOut.length - 1].drawY > maxY) {
        const shift = laidOut[laidOut.length - 1].drawY - maxY;
        for (const marker of laidOut) {
          marker.drawY -= shift;
        }
      }

      for (let index = laidOut.length - 2; index >= 0; index -= 1) {
        if (laidOut[index + 1].drawY - laidOut[index].drawY < gap) {
          laidOut[index].drawY = laidOut[index + 1].drawY - gap;
        }
      }

      if (laidOut.length && laidOut[0].drawY < minY) {
        const shift = minY - laidOut[0].drawY;
        for (const marker of laidOut) {
          marker.drawY += shift;
        }
      }

      return laidOut;
    }

    function drawEdgeMarkerBadge(duck, edgeX, edgeY, facingLeft) {
      const pulse = 0.84 + Math.sin(state.time * 7 + duck.y * 0.02) * 0.1;
      const baseColor = duck.kind.glow || (duck.kind === duckKinds.swift ? "#ffbf6f" : "rgba(255, 176, 96, 0.92)");

      ctx.save();
      ctx.translate(edgeX, edgeY);
      if (!facingLeft) {
        ctx.scale(-1, 1);
      }

      const baseRgb = colorToRgb(baseColor);
      const beam = ctx.createLinearGradient(-12, 0, 108, 0);
      beam.addColorStop(0, "rgba(" + baseRgb + "," + (0.3 + pulse * 0.08).toFixed(3) + ")");
      beam.addColorStop(0.6, "rgba(" + baseRgb + "," + (duck.kind === duckKinds.ace ? 0.12 : 0.09).toFixed(3) + ")");
      beam.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = beam;
      ctx.fillRect(-10, -8 - (duck.kind === duckKinds.ace ? 2 : 0), 118, 16 + (duck.kind === duckKinds.ace ? 4 : 0));

      if (duck.kind === duckKinds.golden || duck.kind === duckKinds.ace) {
        ctx.fillStyle = duck.kind === duckKinds.ace ? "rgba(255, 143, 114, 0.22)" : "rgba(255, 216, 110, 0.22)";
        ctx.beginPath();
        ctx.arc(0, 0, duck.kind === duckKinds.ace ? 19 + pulse * 3 : 16 + pulse * 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      if (duck.kind === duckKinds.ace) {
        ctx.globalAlpha = 0.58;
        ctx.fillStyle = "#ff8f72";
        ctx.beginPath();
        ctx.moveTo(-18, 0);
        ctx.lineTo(0, -10);
        ctx.lineTo(0, 10);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      ctx.fillStyle = baseColor;
      ctx.beginPath();
      ctx.moveTo(-12, 0);
      ctx.lineTo(11, -10);
      ctx.lineTo(11, 10);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "rgba(255,255,255,0.48)";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      if (duck.kind === duckKinds.swift) {
        ctx.strokeStyle = "rgba(255, 212, 148, 0.62)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-18, -5);
        ctx.lineTo(-28, -9);
        ctx.moveTo(-18, 5);
        ctx.lineTo(-28, 9);
        ctx.stroke();
      } else if (duck.kind === duckKinds.golden) {
        ctx.strokeStyle = "rgba(255, 241, 188, 0.82)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(-2, 0, 18 + pulse * 1.4, -0.7, 0.7);
        ctx.stroke();
        ctx.fillStyle = "rgba(255, 241, 188, 0.92)";
        ctx.fillRect(-19, -3, 6, 6);
      } else if (duck.kind === duckKinds.ace) {
        ctx.fillStyle = "rgba(255, 228, 214, 0.92)";
        ctx.fillRect(-23, -7, 5, 5);
        ctx.fillRect(-23, 2, 5, 5);
      }

      if (duck.kind === duckKinds.ace || duck.kind === duckKinds.golden) {
        ctx.strokeStyle = duck.kind === duckKinds.ace ? "rgba(255, 184, 162, 0.54)" : "rgba(255, 241, 188, 0.48)";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(18, -10);
        ctx.lineTo(44, -10);
        ctx.moveTo(18, 10);
        ctx.lineTo(44, 10);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawEdgeMarkers() {
      if (state.scene !== "play") {
        return;
      }

      const leftMarkers = [];
      const rightMarkers = [];
      for (const duck of state.ducks) {
        if (!duck.alive || duck.falling || (duck.x >= 60 && duck.x <= WIDTH - 60)) {
          continue;
        }
        const marker = { duck, y: duck.y };
        if (duck.x < WIDTH * 0.5) {
          leftMarkers.push(marker);
        } else {
          rightMarkers.push(marker);
        }
      }

      for (const marker of layoutEdgeMarkers(leftMarkers, 118, HEIGHT - 168, 32)) {
        drawEdgeMarkerBadge(marker.duck, 28, marker.drawY, true);
      }
      for (const marker of layoutEdgeMarkers(rightMarkers, 118, HEIGHT - 168, 32)) {
        drawEdgeMarkerBadge(marker.duck, WIDTH - 28, marker.drawY, false);
      }
    }

    function drawWrappedText(text, x, y, maxWidth, lineHeight, maxLines = 2, color = "#d7ecef", font = "600 14px Trebuchet MS") {
      ctx.save();
      ctx.font = font;
      ctx.fillStyle = color;
      const words = text.split(" ");
      const lines = [];
      let current = "";
      for (const word of words) {
        const next = current ? current + " " + word : word;
        if (!current || ctx.measureText(next).width <= maxWidth) {
          current = next;
          continue;
        }
        lines.push(current);
        current = word;
        if (lines.length >= maxLines - 1) {
          break;
        }
      }
      if (lines.length < maxLines && current) {
        const usedWords = lines.join(" ").split(" ").filter(Boolean).length;
        let finalLine = words.slice(usedWords).join(" ");
        while (ctx.measureText(finalLine).width > maxWidth && finalLine.length > 0) {
          finalLine = finalLine.slice(0, -1);
        }
        if (usedWords + finalLine.split(" ").filter(Boolean).length < words.length) {
          finalLine = finalLine.replace(/[ .,:;!?-]*$/, "") + "...";
        }
        lines.push(finalLine);
      }
      lines.slice(0, maxLines).forEach((line, index) => ctx.fillText(line, x, y + index * lineHeight));
      ctx.restore();
    }

    function roundedRectPath(x, y, width, height, radius) {
      const r = Math.min(radius, width * 0.5, height * 0.5);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height - r);
      ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      ctx.lineTo(x + r, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawGlassPanel(x, y, width, height, radius, accent = "rgba(255,255,255,0.08)") {
      const gradient = ctx.createLinearGradient(x, y, x, y + height);
      gradient.addColorStop(0, "rgba(8, 28, 36, 0.78)");
      gradient.addColorStop(1, "rgba(5, 20, 27, 0.58)");
      roundedRectPath(x, y, width, height, radius);
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.16)";
      ctx.stroke();

      roundedRectPath(x + 1.5, y + 1.5, width - 3, Math.max(8, height * 0.36), Math.max(6, radius - 4));
      ctx.fillStyle = accent;
      ctx.fill();
    }

    function drawPostFx() {
      const def = activeStageDef();
      const pressure = currentPressure(def);
      const horizonGlow = ctx.createLinearGradient(0, HEIGHT * 0.16, 0, HEIGHT * 0.78);
      horizonGlow.addColorStop(0, "rgba(255, 232, 184, 0)");
      horizonGlow.addColorStop(0.28, "rgba(255, 222, 156, " + clamp(0.026 + state.stagePulse * 0.05 + pressure * 0.028, 0.026, 0.11).toFixed(3) + ")");
      horizonGlow.addColorStop(0.64, "rgba(130, 220, 255, " + clamp(0.014 + def.fog * 0.18, 0.014, 0.042).toFixed(3) + ")");
      horizonGlow.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = horizonGlow;
      ctx.fillRect(0, HEIGHT * 0.12, WIDTH, HEIGHT * 0.7);

      const shaftSpread = state.stage >= 7 ? 320 : 420;
      const shaft = ctx.createLinearGradient(def.sunX, def.sunY - 20, WIDTH * 0.5, HEIGHT - 64);
      shaft.addColorStop(0, "rgba(255, 239, 196, " + clamp(0.024 + state.stagePulse * 0.042, 0.024, 0.084).toFixed(3) + ")");
      shaft.addColorStop(0.35, "rgba(255, 220, 150, " + clamp(0.014 + pressure * 0.032, 0.014, 0.044).toFixed(3) + ")");
      shaft.addColorStop(1, "rgba(255, 255, 255, 0)");
      ctx.save();
      ctx.translate(def.sunX - shaftSpread * 0.5, def.sunY - 12);
      ctx.rotate(state.stage >= 7 ? -0.14 : -0.08);
      ctx.fillStyle = shaft;
      ctx.fillRect(0, 0, shaftSpread, HEIGHT - def.sunY + 40);
      ctx.restore();

      const wash = ctx.createLinearGradient(0, 0, WIDTH, HEIGHT);
      wash.addColorStop(0, "rgba(137, 226, 255, 0.05)");
      wash.addColorStop(0.55, "rgba(0, 0, 0, 0)");
      wash.addColorStop(1, "rgba(255, 191, 120, " + clamp(0.045 + state.stagePulse * 0.04, 0.045, 0.085).toFixed(3) + ")");
      ctx.fillStyle = wash;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      if (state.scene === "play") {
        const causticAlpha = clamp(0.024 + pressure * 0.028 + def.fog * 0.06, 0.024, 0.08);
        for (let index = 0; index < 3; index += 1) {
          const bandX = ((state.time * (44 + index * 18)) + index * 310) % (WIDTH + 260) - 130;
          const band = ctx.createLinearGradient(bandX, HEIGHT - 176, bandX + 220, HEIGHT);
          band.addColorStop(0, "rgba(255,255,255,0)");
          band.addColorStop(0.5, "rgba(216, 243, 255, " + causticAlpha.toFixed(3) + ")");
          band.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = band;
          ctx.fillRect(bandX, HEIGHT - 168, 220, 146);
        }
      }

      const solarFlare = ctx.createRadialGradient(def.sunX, def.sunY, 0, def.sunX, def.sunY, state.stage >= 8 ? 220 : 280);
      solarFlare.addColorStop(0, "rgba(255, 252, 222, 0)");
      solarFlare.addColorStop(0.2, "rgba(255, 242, 190, " + clamp(0.038 + state.stagePulse * 0.04, 0.038, 0.082).toFixed(3) + ")");
      solarFlare.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = solarFlare;
      ctx.fillRect(def.sunX - 280, def.sunY - 280, 560, 560);

      if (state.scene === "play" && state.spawnPings.length > 0) {
        for (const ping of state.spawnPings) {
          const alpha = ping.life / ping.maxLife;
          const wakeWidth = 180 + ping.rareLevel * 44;
          const wakeHeight = 78 + ping.rareLevel * 18;
          const wakeX = ping.side === "left" ? 0 : WIDTH - wakeWidth;
          const wakeCenterX = ping.side === "left" ? 0 : WIDTH;
          const wake = ctx.createLinearGradient(
            wakeCenterX,
            ping.y,
            wakeCenterX + (ping.side === "left" ? wakeWidth : -wakeWidth),
            ping.y
          );
          wake.addColorStop(0, hexToRgba(ping.color, (0.12 + ping.rareLevel * 0.035) * alpha));
          wake.addColorStop(0.45, hexToRgba(ping.color, (0.06 + ping.rareLevel * 0.02) * alpha));
          wake.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = wake;
          ctx.fillRect(wakeX, ping.y - wakeHeight * 0.5, wakeWidth, wakeHeight);
        }
      }

      if (pressure > 0.12) {
        const focus = ctx.createRadialGradient(pointer.x, pointer.y, 80, pointer.x, pointer.y, 420);
        focus.addColorStop(0, "rgba(255,255,255,0)");
        focus.addColorStop(0.58, "rgba(0, 0, 0, 0)");
        focus.addColorStop(1, "rgba(11, 22, 32, " + clamp(pressure * 0.14, 0, 0.14).toFixed(3) + ")");
        ctx.fillStyle = focus;
        ctx.fillRect(pointer.x - 420, pointer.y - 420, 840, 840);
      }

      const vignette = ctx.createRadialGradient(WIDTH * 0.5, HEIGHT * 0.44, 140, WIDTH * 0.5, HEIGHT * 0.44, WIDTH * 0.64);
      vignette.addColorStop(0, "rgba(0,0,0,0)");
      vignette.addColorStop(1, "rgba(5, 18, 28, " + clamp(0.12 + def.fog * 0.58 + state.stagePulse * 0.08, 0.12, 0.28).toFixed(3) + ")");
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.fillStyle = "rgba(255,255,255,0.028)";
      for (let y = 0; y < HEIGHT; y += 4) {
        ctx.fillRect(0, y, WIDTH, 1);
      }

      if (state.hitFlash > 0) {
        ctx.fillStyle = "rgba(255, 242, 198, " + (state.hitFlash * 0.18).toFixed(3) + ")";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }

      if (state.comboFlash > 0) {
        const comboGlow = ctx.createRadialGradient(pointer.x, pointer.y, 24, pointer.x, pointer.y, 320);
        comboGlow.addColorStop(0, "rgba(255, 245, 194, 0)");
        comboGlow.addColorStop(0.32, "rgba(255, 226, 154, " + clamp(state.comboFlash * 0.18, 0, 0.18).toFixed(3) + ")");
        comboGlow.addColorStop(1, "rgba(255, 226, 154, 0)");
        ctx.fillStyle = comboGlow;
        ctx.fillRect(pointer.x - 320, pointer.y - 320, 640, 640);
      }

      if (state.impactPulse > 0) {
        const bloom = ctx.createRadialGradient(state.impactX, state.impactY, 10, state.impactX, state.impactY, 180);
        bloom.addColorStop(0, "rgba(255, 246, 214, " + clamp(state.impactPulse * 0.44, 0, 0.44).toFixed(3) + ")");
        bloom.addColorStop(0.42, "rgba(255, 210, 130, " + clamp(state.impactPulse * 0.2, 0, 0.2).toFixed(3) + ")");
        bloom.addColorStop(1, "rgba(255, 210, 130, 0)");
        ctx.fillStyle = bloom;
        ctx.fillRect(state.impactX - 180, state.impactY - 180, 360, 360);
        ctx.strokeStyle = "rgba(255, 236, 184, " + clamp(state.impactPulse * 0.26, 0, 0.26).toFixed(3) + ")";
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.arc(state.impactX, state.impactY, 30 + (1 - clamp(state.impactPulse / 0.24, 0, 1)) * 46, 0, Math.PI * 2);
        ctx.stroke();
      }

      if (state.shotHeat > 0) {
        const flare = ctx.createRadialGradient(pointer.x, pointer.y, 12, pointer.x, pointer.y, 220);
        flare.addColorStop(0, "rgba(255, 238, 184, " + clamp(state.shotHeat * 0.3, 0, 0.3).toFixed(3) + ")");
        flare.addColorStop(0.42, "rgba(255, 179, 96, " + clamp(state.shotHeat * 0.16, 0, 0.16).toFixed(3) + ")");
        flare.addColorStop(1, "rgba(255, 179, 96, 0)");
        ctx.fillStyle = flare;
        ctx.fillRect(pointer.x - 220, pointer.y - 220, 440, 440);
      }

      if (state.waterFlash > 0) {
        const waterline = HEIGHT - 104;
        const band = ctx.createLinearGradient(0, waterline - 10, 0, waterline + 46);
        band.addColorStop(0, "rgba(191, 232, 255, 0)");
        band.addColorStop(0.4, "rgba(191, 232, 255, " + clamp(state.waterFlash * 0.18, 0, 0.18).toFixed(3) + ")");
        band.addColorStop(1, "rgba(191, 232, 255, 0)");
        ctx.fillStyle = band;
        ctx.fillRect(0, waterline - 12, WIDTH, 60);
      }

      if (pressure > 0.36) {
        const edgeTint = ctx.createLinearGradient(0, 0, WIDTH, 0);
        const edgeAlpha = clamp((pressure - 0.36) * 0.16 + state.stagePulse * 0.04, 0, 0.16);
        edgeTint.addColorStop(0, "rgba(255, 164, 118, " + edgeAlpha.toFixed(3) + ")");
        edgeTint.addColorStop(0.14, "rgba(255, 164, 118, 0)");
        edgeTint.addColorStop(0.86, "rgba(255, 164, 118, 0)");
        edgeTint.addColorStop(1, "rgba(255, 164, 118, " + edgeAlpha.toFixed(3) + ")");
        ctx.fillStyle = edgeTint;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }

      if (state.screenFlash > 0) {
        ctx.fillStyle = "rgba(" + state.screenFlashColor + "," + clamp(state.screenFlash * 0.18, 0, 0.18).toFixed(3) + ")";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }
    }

    function drawStageTrack() {
      const trackWidth = 428;
      const x = WIDTH * 0.5 - trackWidth * 0.5;
      const y = 22;
      drawGlassPanel(x, y, trackWidth, 66, 18, "rgba(255,255,255,0.06)");

      ctx.textAlign = "center";
      ctx.fillStyle = "#f8fffc";
      ctx.font = "700 14px Trebuchet MS";
      ctx.fillText(stageDefs[state.stage].chapter, WIDTH * 0.5, y + 19);

      for (let index = 0; index < stageDefs.length; index += 1) {
        const boxX = x + 19 + index * 43;
        const active = index === state.stage;
        const cleared = index < state.stage || state.scene === "win";
        ctx.fillStyle = active ? "#ffd86e" : cleared ? "rgba(255,216,110,0.48)" : "rgba(255,255,255,0.12)";
        roundedRectPath(boxX, y + 28, 28, 14, 4);
        ctx.fill();
        ctx.strokeStyle = active ? "rgba(255,255,255,0.7)" : "rgba(255,255,255,0.18)";
        ctx.stroke();
      }

      ctx.font = "600 11px Trebuchet MS";
      ctx.fillStyle = "#d7ecef";
      ctx.fillText(stageDefs[state.stage].title, WIDTH * 0.5, y + 54);
      ctx.textAlign = "left";
    }

    function drawHud() {
      if (state.scene !== "play") {
        return;
      }

      const def = activeStageDef();
      const quotaLeft = Math.max(0, def.quota - state.hits);
      const ammoText = "Clip " + state.clip + " / " + state.shellsLeft;
      const ammoDanger = totalAmmo() <= 2;
      const leftX = 20;
      const topY = 20;
      const sideWidth = 258;
      const panelHeight = 114;

      drawGlassPanel(leftX, topY, sideWidth, panelHeight, 18);
      drawGlassPanel(
        WIDTH - leftX - sideWidth,
        topY,
        sideWidth,
        panelHeight,
        18,
        ammoDanger ? "rgba(255, 133, 106, 0.16)" : "rgba(255,255,255,0.06)"
      );
      if (state.reloadReadyPulse > 0) {
        const readyAlpha = clamp(state.reloadReadyPulse * 0.34, 0, 0.26);
        ctx.fillStyle = "rgba(255, 216, 110, " + readyAlpha.toFixed(3) + ")";
        ctx.fillRect(WIDTH - leftX - sideWidth, topY, sideWidth, panelHeight);
      }

      ctx.font = "700 12px Trebuchet MS";

      ctx.font = "700 24px Trebuchet MS";
      ctx.fillText("Need " + quotaLeft, leftX + 18, topY + 49);
      ctx.font = "700 15px Trebuchet MS";
      ctx.fillStyle = "#d7ecef";
      ctx.fillText("Score " + state.score, leftX + 18, topY + 72);
      drawWrappedText(def.goal, leftX + 18, topY + 90, 220, 14, 2, "#d7ecef", "600 13px Trebuchet MS");

      ctx.textAlign = "right";
      ctx.fillStyle = "#9fe7ff";
      ctx.font = "700 12px Trebuchet MS";
      ctx.fillText("FIELD STATUS", WIDTH - leftX - 18, topY + 20);
      ctx.fillStyle = "#f8fffc";
      ctx.font = "700 24px Trebuchet MS";
      ctx.fillText(ammoText, WIDTH - leftX - 18, topY + 49);
      ctx.font = "700 15px Trebuchet MS";
      ctx.fillStyle = ammoDanger ? "#ffd2be" : "#d7ecef";
      ctx.fillText("Time " + Math.max(0, state.roundTimer).toFixed(1) + "  |  Escaped " + state.escaped, WIDTH - leftX - 18, topY + 72);
      drawWrappedText(
        state.lastRewardTimer > 0 ? state.lastReward : ammoDanger ? "Low shells: next shot must count" : "Rare birds = points + shell caches",
        WIDTH - leftX - 18,
        topY + 90,
        220,
        14,
        2,
        state.lastRewardTimer > 0 ? "#ffd86e" : ammoDanger ? "#ffb59c" : "#d7ecef",
        "600 13px Trebuchet MS"
      );

    function drawPlayToast() {
      if (state.scene !== "play" || state.messageTimer <= 0) {
        return;
      }

      const accent =
        state.messageKind === "warning"
          ? "rgba(255, 159, 122, 0.2)"
          : state.messageKind === "success"
            ? "rgba(255, 216, 110, 0.2)"
            : "rgba(159, 231, 255, 0.16)";
      const label =
        state.messageKind === "warning"
          ? "FIELD ALERT"
          : state.messageKind === "success"
            ? "CONFIRMED"
            : "MARSH RADIO";
      drawGlassPanel(28, HEIGHT - 154, 520, 100, 18, accent);
      ctx.fillStyle = state.messageKind === "warning" ? "#ffb890" : state.messageKind === "success" ? "#ffd86e" : "#9fe7ff";
      ctx.font = "700 11px Trebuchet MS";
      ctx.fillText(label, 50, HEIGHT - 132);
      ctx.fillStyle = "#f8fffc";
      ctx.font = "700 16px Trebuchet MS";
      ctx.fillText(stageDefs[state.stage].title, 50, HEIGHT - 120);
      drawWrappedText(state.message, 50, HEIGHT - 98, 476, 16, 2, "#d7ecef", "600 15px Trebuchet MS");
      const toastFooter =
        state.lastRewardTimer > 0
          ? state.lastReward
          : state.reloadTimer > 0
            ? "Reload " + Math.round((1 - state.reloadTimer / 0.72) * 100) + "% | Shells " + totalAmmo()
            : state.comboTimer > 0 && state.combo > 1
              ? "Combo x" + state.combo + " | Shells " + totalAmmo()
              : "Shells " + totalAmmo() + " | Escaped " + state.escaped;
      ctx.fillStyle = "#ffd86e";
      ctx.font = "600 14px Trebuchet MS";
      ctx.fillText("Quota " + Math.max(0, activeStageDef().quota - state.hits) + " | " + toastFooter, 50, HEIGHT - 60);
    }

    function drawSpawnPings() {
      if (state.scene !== "play") {
        return;
      }

      for (const ping of state.spawnPings) {
        const alpha = ping.life / ping.maxLife;
        const edgeX = ping.side === "left" ? 0 : WIDTH;
        const direction = ping.side === "left" ? 1 : -1;
        const inset = (1 - alpha) * 42;
        const wedge = 18 + ping.rareLevel * 4;
        const beam = ctx.createLinearGradient(
          edgeX + direction * (8 + inset),
          ping.y,
          edgeX + direction * (92 + inset),
          ping.y
        );
        beam.addColorStop(0, hexToRgba(ping.color, 0.32 * alpha));
        beam.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = beam;
        ctx.fillRect(
          ping.side === "left" ? 0 : WIDTH - (92 + inset),
          ping.y - (18 + ping.rareLevel * 3),
          92 + inset,
          36 + ping.rareLevel * 6
        );
        ctx.fillStyle = hexToRgba(ping.color, 0.72 * alpha);
        ctx.beginPath();
        ctx.moveTo(edgeX, ping.y);
        ctx.lineTo(edgeX + direction * wedge, ping.y - 14 - ping.rareLevel * 2);
        ctx.lineTo(edgeX + direction * wedge, ping.y + 14 + ping.rareLevel * 2);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawSceneBirdSilhouette(x, y, scale, flap = 0, alpha = 0.18) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = "rgba(216, 241, 246," + alpha.toFixed(3) + ")";
      ctx.beginPath();
      ctx.ellipse(0, 0, 16, 10, 0.08, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-6, -3);
      ctx.lineTo(-26, -12 - flap);
      ctx.lineTo(-18, 5 + flap * 0.25);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(5, -2);
      ctx.lineTo(28, -11 + flap * 0.7);
      ctx.lineTo(14, 6 + flap * 0.15);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(14, -1);
      ctx.lineTo(25, 2);
      ctx.lineTo(15, 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawSceneSilhouetteBand(scene, reveal) {
      const skylineY = HEIGHT - 236;
      const waterline = HEIGHT - 150;
      const pan = (state.time * (scene === "win" ? 18 : scene === "lose" ? 10 : 14)) % 240;
      const accent =
        scene === "lose"
          ? "rgba(255, 168, 128, 0.22)"
          : scene === "win"
            ? "rgba(255, 216, 110, 0.22)"
            : "rgba(159, 231, 255, 0.22)";

      ctx.fillStyle = "rgba(4, 14, 20, " + (0.38 + reveal * 0.18).toFixed(3) + ")";
      ctx.fillRect(0, skylineY - 10, WIDTH, HEIGHT - skylineY + 10);

      const horizon = ctx.createLinearGradient(0, skylineY - 32, 0, waterline + 14);
      horizon.addColorStop(0, "rgba(255,255,255,0)");
      horizon.addColorStop(0.45, accent);
      horizon.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = horizon;
      ctx.fillRect(0, skylineY - 40, WIDTH, waterline - skylineY + 64);

      for (let index = -1; index < 8; index += 1) {
        const x = index * 180 + 40 - pan;
        const height = 48 + (index % 3) * 18;
