<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Engine Drawing Demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111827;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import {
        drawCircle,
        drawLine,
        drawPolygon,
        drawRect,
        drawText,
        init,
        popTransform,
        pushTransform,
        registerSprite,
        drawSpriteSlice,
        setDrawContext
      } from "../browser/engine.js";

      const sprite = document.createElement("canvas");
      sprite.width = 64;
      sprite.height = 16;
      const spriteCtx = sprite.getContext("2d");
      ["#38bdf8", "#f59e0b", "#22c55e", "#f43f5e"].forEach((color, index) => {
        spriteCtx.fillStyle = color;
        spriteCtx.fillRect(index * 16 + 2, 2, 12, 12);
      });
      registerSprite("demo", sprite);

      let app;
      app = init({
        width: 640,
        height: 360,
        background: "#111827",
        render: (_dt, t) => {
          const ctx = app.ctx;
          setDrawContext(ctx);
          ctx.clearRect(0, 0, 640, 360);

          drawRect(32, 32, 120, 72, { fill: "#1f2937", stroke: "#38bdf8", lineWidth: 3 });
          drawCircle(236, 68, 36, { fill: "#22c55e", alpha: 0.8 });
          drawLine(300, 38, 420, 98, { stroke: "#f59e0b", lineWidth: 5, cap: "round" });
          drawPolygon(
            [
              { x: 500, y: 36 },
              { x: 590, y: 80 },
              { x: 520, y: 122 }
            ],
            { fill: "#f43f5e", stroke: "#fecdd3", lineWidth: 2 }
          );

          pushTransform({ x: 320, y: 220, rotation: t, scale: 2 });
          drawSpriteSlice("demo", 0, 0, Math.floor(t * 8) % 4, {
            frameWidth: 16,
            frameHeight: 16,
            anchor: "center"
          });
          popTransform();

          drawText("Stateless drawing", 320, 320, {
            fill: "#e5e7eb",
            align: "center",
            size: 24,
            weight: 700
          });
        }
      });
    </script>
  </body>
</html>
