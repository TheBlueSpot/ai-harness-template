<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble Cluster</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <main class="app">
    <section class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Catalog Entry</p>
          <h1>Bubble Cluster</h1>
        </div>
        <div class="legend">
          <span>Mouse aim</span>
          <span>Click / Space fire</span>
          <span>Enter start</span>
          <span>R restart</span>
        </div>
      </header>
      <canvas id="game" width="960" height="540" aria-label="Bubble Cluster game canvas"></canvas>
    </section>
  </main>
  <script src="./src/Game.js"></script>
  <script src="./src/audio.js"></script>
  <script type="module" src="./src/render.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
