<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BurgerTime Stack</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="hud">
      <div class="hud__group">
        <span class="hud__label">Score</span>
        <strong id="score">0</strong>
      </div>
      <div class="hud__group">
        <span class="hud__label">Lives</span>
        <strong id="lives">3</strong>
      </div>
      <div class="hud__group">
        <span class="hud__label">Pepper</span>
        <strong id="pepper">5</strong>
      </div>
      <div class="hud__group">
        <span class="hud__label">Stacks</span>
        <strong id="stacks">0 / 12</strong>
      </div>
    </header>
    <section class="stage">
      <canvas id="game" width="960" height="540" aria-label="BurgerTime Stack game canvas"></canvas>
      <div id="overlay" class="overlay">
        <div class="overlay__card">
          <p id="overlay-kicker" class="overlay__kicker">BurgerTime Stack</p>
          <h1 id="overlay-title">Drop every ingredient onto plate.</h1>
          <p id="overlay-body">Arrow keys move. Climb ladders. Walk full ingredient length to make it drop. Space uses pepper stun.</p>
          <p class="overlay__hint">Press Enter to start. Press R any time to restart.</p>
        </div>
      </div>
    </section>
  </main>
  <script src="./game.js"></script>
</body>
</html>
