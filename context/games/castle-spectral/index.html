        ctx.fillRect(panelX + 12, targetBandY, 160, targetBandHeight);
        ctx.strokeStyle = accentSoft;
        ctx.lineWidth = 2;
        ctx.strokeRect(panelX + 12, targetBandY, 160, targetBandHeight);
        ctx.fillStyle = accentStrong;
        ctx.font = "19px Georgia";
        ctx.fillText(edgeCopy ? edgeCopy.targetLabel : objective.label, edgeX, targetBandY + 26);
        ctx.fillStyle = "rgba(246, 236, 216, 0.78)";
        ctx.font = "14px Georgia";
        ctx.fillText(edgeCopy ? edgeCopy.detail : objective.detail, edgeX, 438);
        ctx.textAlign = "left";
      }

      drawRouteWaypointCue(cameraX, objective, accentStrong, accentSoft);
      drawMirrorDestinationCue(cameraX);
      ctx.restore();
    }

    function drawThreatFocusCue(cameraX) {
      const player = state.player;
      const threat = getImminentSkeletonThreat();
      if (!player || !threat) {
        return;
      }

      const playerCenterX = player.x - cameraX + player.w * 0.5;
      const playerTopY = player.y;
      const bannerWidth = 188;
      const bannerHeight = 78;
      const threatDirection = threat.side === "left" ? -1 : 1;
      const bannerX = clamp(
        playerCenterX + threatDirection * (bannerWidth * 0.5 + 80) - bannerWidth * 0.5,
        24,
        WIDTH - bannerWidth - 24
      );
      const bannerY = clamp(playerTopY - 60, 72, HEIGHT - 152);
      const arrowDirection = threat.side === "left" ? -1 : 1;
      const arrowBaseX = threat.side === "left" ? bannerX + 18 : bannerX + bannerWidth - 18;
      const connectorStartX = threat.side === "left" ? bannerX + bannerWidth - 6 : bannerX + 6;
      const connectorEndX = clamp(playerCenterX + arrowDirection * 20, bannerX + 24, bannerX + bannerWidth - 24);
      const connectorEndY = clamp(playerTopY + 12, bannerY + 8, bannerY + bannerHeight + 34);
      const pulse = 0.5 + Math.sin(state.time * 9.5) * 0.5;
      const sideBadgeWidth = 62;
      const sideBadgeX = threat.side === "left" ? bannerX + 8 : bannerX + bannerWidth - sideBadgeWidth - 8;
      const sideTextX = sideBadgeX + sideBadgeWidth * 0.5;
      const actionPanelX = threat.side === "left" ? bannerX + sideBadgeWidth + 8 : bannerX + 8;
      const actionPanelWidth = bannerWidth - sideBadgeWidth - 16;
      const actionTextX = actionPanelX + actionPanelWidth * 0.5;
      const actionText = "DODGE";
      const sideBadgeLabel = threat.swipeLive ? "DANGER" : "THREAT";
      const safeDirection = threat.side === "left" ? 1 : -1;
      const timingBarX = bannerX + 12;
      const timingDockY = bannerY + bannerHeight - 26;
      const timingDockHeight = 14;
      const timingBarY = timingDockY + 5;
      const timingBarWidth = bannerWidth - 24;
      const timingBarHeight = 4;
      const timingFillWidth = timingBarWidth * threat.windupProgress;
      const contactMarkerX = timingBarX + timingFillWidth;
      const readyTickX = timingBarX + timingBarWidth * 0.68;
      const phasePillX = threat.side === "left" ? bannerX + sideBadgeWidth + 12 : bannerX + 12;
      const phasePillY = bannerY + 35;
      const phasePillWidth = bannerWidth - sideBadgeWidth - 24;
      const phasePillHeight = 18;
      const activePhaseLabel = threat.swipeLive
        ? "LIVE"
        : threat.timeUntilSwipe < SKELETON_ATTACK_READY_TIME
          ? "READY"
          : "WINDUP";
      const activePhaseFill = threat.swipeLive
        ? `rgba(255, 245, 247, ${0.92 + pulse * 0.04})`
        : threat.timeUntilSwipe < SKELETON_ATTACK_READY_TIME
          ? `rgba(239, 127, 147, ${0.88 + pulse * 0.08})`
          : `rgba(255, 208, 218, ${0.66 + pulse * 0.08})`;
      const activePhaseText = threat.swipeLive ? "rgba(18, 7, 10, 0.98)" : "rgba(22, 9, 12, 0.96)";
      const liveZoneWidth = Math.max(24, timingBarWidth * 0.18);
      const readyZoneStartX = readyTickX;
      const liveZoneX = timingBarX + timingBarWidth - liveZoneWidth;
      const liveZonePulse = threat.swipeLive ? 0.78 + pulse * 0.18 : 0.28 + pulse * 0.08;
      const contactRadius = threat.swipeLive ? 6 : 4;

      ctx.save();
      ctx.fillStyle = `rgba(239, 127, 147, ${0.12 + pulse * 0.12})`;
      ctx.fillRect(bannerX - 4, bannerY - 4, bannerWidth + 8, bannerHeight + 8);
      ctx.fillStyle = "rgba(20, 8, 14, 0.94)";
      ctx.fillRect(bannerX, bannerY, bannerWidth, bannerHeight);
      ctx.strokeStyle = `rgba(255, 214, 222, ${0.52 + pulse * 0.18})`;
      ctx.lineWidth = 2;
      ctx.strokeRect(bannerX, bannerY, bannerWidth, bannerHeight);

      ctx.fillStyle = `rgba(239, 127, 147, ${0.82 + pulse * 0.12})`;
      ctx.fillRect(sideBadgeX, bannerY + 6, sideBadgeWidth, bannerHeight - 12);
      ctx.strokeStyle = "rgba(255, 232, 236, 0.62)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(sideBadgeX, bannerY + 6, sideBadgeWidth, bannerHeight - 12);

      ctx.strokeStyle = `rgba(239, 127, 147, ${0.84 + pulse * 0.12})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(connectorStartX, bannerY + bannerHeight * 0.58);
      ctx.lineTo(connectorEndX, connectorEndY);
      ctx.stroke();

      ctx.fillStyle = `rgba(239, 127, 147, ${0.94 + pulse * 0.04})`;
      ctx.beginPath();
      ctx.moveTo(arrowBaseX, bannerY + bannerHeight * 0.5);
      ctx.lineTo(arrowBaseX - arrowDirection * 14, bannerY + 6);
      ctx.lineTo(arrowBaseX - arrowDirection * 14, bannerY + bannerHeight - 6);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "rgba(18, 8, 12, 0.84)";
      ctx.fillRect(
        threat.side === "left" ? sideBadgeX + sideBadgeWidth + 10 : bannerX + 10,
        bannerY + 8,
        bannerWidth - sideBadgeWidth - 28,
        bannerHeight - 16
      );

      ctx.fillStyle = "rgba(35, 20, 27, 0.9)";
      ctx.fillRect(
        actionPanelX,
        bannerY + 8,
        actionPanelWidth,
        bannerHeight - 16
      );

      const actionArrowInset = 12;
      const actionArrowStartX = safeDirection > 0 ? actionPanelX + actionArrowInset : actionPanelX + actionPanelWidth - actionArrowInset;
      const actionArrowEndX = safeDirection > 0 ? actionPanelX + actionPanelWidth - actionArrowInset : actionPanelX + actionArrowInset;
      const actionArrowCenterY = bannerY + 19;
      const actionArrowHalfHeight = 12;
      const actionArrowHead = 22;
      const actionArrowShaftHalf = 6;
      ctx.fillStyle = threat.swipeLive
        ? `rgba(255, 245, 247, ${0.24 + pulse * 0.12})`
        : `rgba(255, 210, 220, ${0.14 + pulse * 0.08})`;
      ctx.beginPath();
      if (safeDirection > 0) {
        ctx.moveTo(actionArrowStartX, actionArrowCenterY - actionArrowShaftHalf);
        ctx.lineTo(actionArrowEndX - actionArrowHead, actionArrowCenterY - actionArrowShaftHalf);
        ctx.lineTo(actionArrowEndX - actionArrowHead, actionArrowCenterY - actionArrowHalfHeight);
        ctx.lineTo(actionArrowEndX, actionArrowCenterY);
        ctx.lineTo(actionArrowEndX - actionArrowHead, actionArrowCenterY + actionArrowHalfHeight);
        ctx.lineTo(actionArrowEndX - actionArrowHead, actionArrowCenterY + actionArrowShaftHalf);
        ctx.lineTo(actionArrowStartX, actionArrowCenterY + actionArrowShaftHalf);
      } else {
        ctx.moveTo(actionArrowStartX, actionArrowCenterY - actionArrowShaftHalf);
        ctx.lineTo(actionArrowEndX + actionArrowHead, actionArrowCenterY - actionArrowShaftHalf);
        ctx.lineTo(actionArrowEndX + actionArrowHead, actionArrowCenterY - actionArrowHalfHeight);
        ctx.lineTo(actionArrowEndX, actionArrowCenterY);
        ctx.lineTo(actionArrowEndX + actionArrowHead, actionArrowCenterY + actionArrowHalfHeight);
        ctx.lineTo(actionArrowEndX + actionArrowHead, actionArrowCenterY + actionArrowShaftHalf);
        ctx.lineTo(actionArrowStartX, actionArrowCenterY + actionArrowShaftHalf);
      }
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = palette.ui;
      ctx.font = "bold 15px Georgia";
      ctx.textAlign = "center";
      ctx.fillText(sideBadgeLabel, sideTextX, bannerY + 35);
      ctx.fillStyle = palette.ui;
      ctx.font = "bold 20px Georgia";
      ctx.fillText(actionText, actionTextX, bannerY + 32);

      ctx.fillStyle = "rgba(255, 236, 240, 0.08)";
      ctx.fillRect(phasePillX, phasePillY, phasePillWidth, phasePillHeight);
      ctx.strokeStyle = "rgba(255, 232, 236, 0.2)";
      ctx.lineWidth = 1;
      ctx.strokeRect(phasePillX, phasePillY, phasePillWidth, phasePillHeight);
      ctx.fillStyle = activePhaseFill;
      ctx.fillRect(phasePillX + 2, phasePillY + 2, phasePillWidth - 4, phasePillHeight - 4);
      ctx.strokeStyle = threat.swipeLive ? "rgba(255, 245, 247, 0.7)" : "rgba(255, 232, 236, 0.34)";
      ctx.strokeRect(phasePillX + 2, phasePillY + 2, phasePillWidth - 4, phasePillHeight - 4);
      ctx.fillStyle = activePhaseText;
      ctx.font = "bold 15px Georgia";
      ctx.fillText(activePhaseLabel, phasePillX + phasePillWidth * 0.5, phasePillY + 14);

      ctx.fillStyle = "rgba(12, 7, 10, 0.86)";
      ctx.fillRect(timingBarX, timingDockY, timingBarWidth, timingDockHeight);
      ctx.strokeStyle = "rgba(255, 232, 236, 0.18)";
      ctx.lineWidth = 1;
      ctx.strokeRect(timingBarX, timingDockY, timingBarWidth, timingDockHeight);
      ctx.fillStyle = `rgba(239, 127, 147, ${liveZonePulse * 0.42})`;
      ctx.fillRect(liveZoneX, timingDockY + 1, liveZoneWidth, timingDockHeight - 2);
      ctx.fillStyle = "rgba(255, 236, 240, 0.18)";
      ctx.fillRect(timingBarX, timingBarY, timingBarWidth, timingBarHeight);
      ctx.fillStyle = "rgba(255, 236, 240, 0.12)";
      ctx.fillRect(readyZoneStartX, timingBarY, Math.max(0, liveZoneX - readyZoneStartX), timingBarHeight);
      ctx.fillStyle = `rgba(255, 232, 236, ${threat.swipeLive ? 0.78 + pulse * 0.16 : 0.32 + pulse * 0.08})`;
      ctx.fillRect(liveZoneX, timingBarY - 1, liveZoneWidth, timingBarHeight + 2);
      ctx.fillStyle = `rgba(255, 248, 250, ${liveZonePulse * 0.34})`;
      ctx.fillRect(liveZoneX + 2, timingBarY - 3, Math.max(0, liveZoneWidth - 4), timingBarHeight + 6);
      ctx.fillStyle = "rgba(255, 236, 240, 0.2)";
      ctx.fillRect(readyTickX - 1, timingBarY - 3, 2, timingBarHeight + 6);
      ctx.fillRect(liveZoneX - 1, timingBarY - 3, 2, timingBarHeight + 6);
      ctx.fillStyle = `rgba(239, 127, 147, ${0.78 + pulse * 0.12})`;
      ctx.fillRect(timingBarX, timingBarY, timingFillWidth, timingBarHeight);
      ctx.fillStyle = threat.swipeLive ? "rgba(255, 245, 247, 0.98)" : "rgba(255, 232, 236, 0.92)";
      ctx.beginPath();
      ctx.arc(contactMarkerX, timingBarY + timingBarHeight * 0.5, contactRadius, 0, Math.PI * 2);
      ctx.fill();
      if (threat.swipeLive) {
        ctx.strokeStyle = `rgba(255, 248, 250, ${0.7 + pulse * 0.16})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(contactMarkerX, timingBarY + timingBarHeight * 0.5, contactRadius + 3, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.strokeStyle = "rgba(255, 232, 236, 0.34)";
      ctx.lineWidth = 1;
      ctx.strokeRect(timingBarX, timingBarY, timingBarWidth, timingBarHeight);
      ctx.textAlign = "left";
      ctx.restore();
    }

      for (let i = 0; i < state.relics.length; i += 1) {
        const filled = i < player.relics;
        ctx.fillStyle = filled ? palette.relic : "rgba(255, 255, 255, 0.12)";
        ctx.beginPath();
        ctx.moveTo(WIDTH - 86 + i * 18, 48);
        ctx.lineTo(WIDTH - 78 + i * 18, 56);
        ctx.lineTo(WIDTH - 86 + i * 18, 64);
        ctx.lineTo(WIDTH - 94 + i * 18, 56);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawOverlay(title, subtitle, prompt) {
      ctx.fillStyle = "rgba(5, 3, 8, 0.62)";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      ctx.fillStyle = "rgba(14, 10, 18, 0.88)";
      ctx.fillRect(WIDTH * 0.5 - 260, HEIGHT * 0.5 - 140, 520, 280);
      ctx.strokeStyle = "rgba(255, 219, 178, 0.18)";
      ctx.strokeRect(WIDTH * 0.5 - 260, HEIGHT * 0.5 - 140, 520, 280);
      ctx.textAlign = "center";
      ctx.fillStyle = palette.ui;
      ctx.font = "48px Georgia";
      ctx.fillText(title, WIDTH * 0.5, HEIGHT * 0.5 - 48);
      ctx.font = "22px Georgia";
      ctx.fillStyle = "rgba(246, 236, 216, 0.82)";
      ctx.fillText(subtitle, WIDTH * 0.5, HEIGHT * 0.5 + 4);
      ctx.font = "18px Georgia";
      ctx.fillStyle = "rgba(246, 236, 216, 0.72)";
      ctx.fillText(prompt, WIDTH * 0.5, HEIGHT * 0.5 + 74);
      ctx.textAlign = "left";
    }

    function render() {
      const cameraX = state.cameraX + (state.shake > 0 ? (Math.random() - 0.5) * 18 * state.shake : 0);
      drawBackground(cameraX);

      if (state.scene === "menu") {
        drawOverlay(
          "Spectral Mirror",
          "A torchlit castle run with whip arcs, skeleton pressure, and a sealed exit mirror.",
          "Press Enter, Space, or J to descend."
        );
        return;
      }

      drawTiles(cameraX);
      drawMirror(cameraX);
      drawRelics(cameraX);
      drawTorches(cameraX);
      drawSkeletons(cameraX);
      drawPlayer(cameraX);
      drawLighting(cameraX);
      drawReadabilityPass(cameraX);
      drawObjectiveBeacon(cameraX);
      drawThreatFocusCue(cameraX);
      drawHUD();

      if (state.scene === "win") {
        drawOverlay(
          "Mirror Cleared",
          `Escape time ${state.elapsed.toFixed(1)} seconds.`,
          "Press Enter or R to run again."
        );
      } else if (state.scene === "lose") {
        drawOverlay(
          "Echo Fallen",
          "The keep closes unless the sigils are claimed and the mirror reached.",
          "Press Enter or R to retry."
        );
      }
    }

    let last = performance.now();
    let dt = 0;

    function frame(now) {
      dt = Math.min(1 / 30, (now - last) / 1000);
      last = now;
      state.time += dt;
      state.shake = Math.max(0, state.shake - dt * 2.8);
      updateScene();
      render();
      requestAnimationFrame(frame);
    }

    window.addEventListener("keydown", (event) => {
      if (["ArrowLeft", "ArrowRight", "Space"].includes(event.code)) {
        event.preventDefault();
      }
      keys.add(event.code);
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.code);
    });

    buildWorld();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
