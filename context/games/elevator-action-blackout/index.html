<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elevator Action Blackout</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="hud">
      <div class="hud__group">
        <span class="label">Documents</span>
        <span id="docsCount">0 / 0</span>
      </div>
      <div class="hud__group">
        <span class="label">Lives</span>
        <span id="livesCount">3</span>
      </div>
      <div class="hud__group">
        <span class="label">Alert</span>
        <span id="alertState">Calm</span>
      </div>
      <div class="hud__group">
        <span class="label">Timer</span>
        <span id="timeCount">0.0s</span>
      </div>
    </header>
    <section class="stage">
      <canvas id="game" width="960" height="540" aria-label="Elevator Action Blackout"></canvas>
      <div class="overlay" id="overlay">
        <div class="panel">
          <h1 id="overlayTitle">Elevator Action Blackout</h1>
          <p id="overlayText">Steal the red files, stay out of guard sight, and escape through the lobby.</p>
          <p class="controls">Move: Arrow keys or WASD. Use elevators with Up or Down. Shoot with Space. Restart with R.</p>
          <button id="startButton" type="button">Start Mission</button>
        </div>
      </div>
    </section>
  </main>
  <script src="./game.js"></script>
</body>
</html>
