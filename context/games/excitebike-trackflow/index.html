<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Excitebike Trackflow</title>
    <meta
      name="description"
      content="Standalone browser motocross run with direct folder boot, readable track flow, and fast restart."
    />
    <link rel="stylesheet" href="./src/styles.css" />
    <script defer src="./game.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="frame" aria-label="Excitebike Trackflow">
        <canvas id="gameCanvas" class="game-canvas" aria-label="Game view"></canvas>

        <div id="hud" class="hud" aria-live="polite">
          <div class="hud__stats">
            <div class="hud__row"><span class="hud__label">Lap</span><span id="hudLap" class="hud__value">1</span></div>
            <div class="hud__row"><span class="hud__label">Speed</span><span id="hudSpeed" class="hud__value">0</span></div>
            <div class="hud__row"><span class="hud__label">Time</span><span id="hudTime" class="hud__value">0:00.0</span></div>
          </div>
          <div id="hudStatus" class="hud__alert" hidden></div>
        </div>

        <section id="overlay" class="overlay" hidden>
          <p id="overlayEyebrow" class="overlay__eyebrow">Race</p>
          <h1 id="overlayTitle" class="overlay__title">Excitebike Trackflow</h1>
          <p id="overlayCopy" class="overlay__copy"></p>
          <button id="overlayButton" class="overlay__button" type="button">Start</button>
        </section>
      </section>
    </main>
  </body>
</html>
