<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ikaruga Polarity Drift</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07131d;
      --panel: rgba(7, 19, 29, 0.88);
      --grid: rgba(113, 157, 194, 0.14);
      --text: #e8f2ff;
      --muted: #9ab3cb;
      --cyan: #5ad1ff;
      --orange: #ff9a52;
      --red: #ff5d73;
      --gold: #ffd166;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(90, 209, 255, 0.16), transparent 32%),
        radial-gradient(circle at bottom, rgba(255, 154, 82, 0.14), transparent 28%),
        linear-gradient(180deg, #040a11, #091927 58%, #04080d);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .shell {
      width: min(100vw, 1060px);
      padding: 18px;
    }

    .frame {
      position: relative;
      border: 1px solid rgba(154, 179, 203, 0.28);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.45);
      background: rgba(4, 10, 17, 0.88);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background:
        linear-gradient(180deg, rgba(9, 20, 31, 0.96), rgba(6, 11, 19, 0.98));
    }

    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      padding: 14px;
      font-size: 14px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .stack {
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .card {
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid rgba(154, 179, 203, 0.18);
      border-radius: 12px;
      min-width: 154px;
      backdrop-filter: blur(12px);
    }

    .card strong {
      display: block;
      font-size: 1.25rem;
      margin-top: 4px;
    }

    .accent-cyan { color: var(--cyan); }
    .accent-orange { color: var(--orange); }
    .accent-gold { color: var(--gold); }
    .accent-red { color: var(--red); }

    .center-note {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(7, 19, 29, 0.86);
      border: 1px solid rgba(154, 179, 203, 0.18);
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="frame">
      <canvas id="game" width="1024" height="576" aria-label="Ikaruga Polarity Drift"></canvas>
      <div class="hud">
        <div class="stack">
          <div class="card">Score<strong id="score">0</strong></div>
          <div class="card">Chain<strong id="chain" class="accent-gold">x0</strong></div>
        </div>
        <div class="stack">
          <div class="card">Sector<strong id="sector" class="accent-gold">Launch</strong></div>
          <div class="card">Polarity<strong id="polarity" class="accent-cyan">Azure</strong></div>
          <div class="card">Shield<strong id="shield" class="accent-gold">0%</strong></div>
        </div>
      </div>
      <div id="note" class="center-note">Move: W/S or Arrows. Shoot: J. Swap polarity: Space.</div>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const chainEl = document.getElementById("chain");
      const sectorEl = document.getElementById("sector");
      const polarityEl = document.getElementById("polarity");
      const shieldEl = document.getElementById("shield");
      const noteEl = document.getElementById("note");

      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;
      const POLARITIES = ["azure", "amber"];
      const COLORS = {
        azure: "#5ad1ff",
        azureDim: "rgba(90, 209, 255, 0.25)",
        amber: "#ff9a52",
        amberDim: "rgba(255, 154, 82, 0.25)",
        enemy: "#e8f2ff",
        danger: "#ff5d73",
        gold: "#ffd166",
        glow: "rgba(232, 242, 255, 0.08)"
      };

      const keys = new Set();
      const state = {
        mode: "intro",
        time: 0,
        stageTime: 0,
        score: 0,
        chain: 0,
        chainTimer: 0,
        scroll: 0,
        flash: 0,
        phase: "waves",
        player: null,
        enemies: [],
        bullets: [],
        enemyBullets: [],
        particles: [],
        telegraphs: [],
        boss: null,
        spawnIndex: 0,
        message: "Press Enter to launch."
      };

      const waves = [
        { time: 1.0, lane: 0.2, polarity: "azure", hp: 4, type: "drone" },
        { time: 2.2, lane: 0.48, polarity: "amber", hp: 4, type: "drone" },
        { time: 3.4, lane: 0.78, polarity: "azure", hp: 4, type: "drone" },
        { time: 5.0, lane: 0.3, polarity: "amber", hp: 6, type: "turret" },
        { time: 6.1, lane: 0.65, polarity: "azure", hp: 5, type: "drone" },
        { time: 7.4, lane: 0.4, polarity: "amber", hp: 5, type: "drone" },
        { time: 9.0, lane: 0.22, polarity: "azure", hp: 7, type: "turret" },
        { time: 10.0, lane: 0.52, polarity: "amber", hp: 7, type: "turret" },
        { time: 11.0, lane: 0.82, polarity: "azure", hp: 7, type: "turret" },
        { time: 13.2, lane: 0.3, polarity: "amber", hp: 6, type: "drone" },
        { time: 13.9, lane: 0.5, polarity: "azure", hp: 6, type: "drone" },
        { time: 14.6, lane: 0.7, polarity: "amber", hp: 6, type: "drone" },
        { time: 17.0, lane: 0.28, polarity: "azure", hp: 8, type: "turret" },
        { time: 18.0, lane: 0.72, polarity: "amber", hp: 8, type: "turret" }
      ];

      function resetGame() {
        state.mode = "playing";
        state.time = 0;
        state.stageTime = 0;
        state.score = 0;
        state.chain = 0;
        state.chainTimer = 0;
        state.scroll = 0;
        state.flash = 0;
        state.phase = "waves";
        state.spawnIndex = 0;
        state.enemies = [];
        state.bullets = [];
        state.enemyBullets = [];
        state.particles = [];
        state.telegraphs = [];
        state.boss = null;
        state.message = "";
        state.player = {
          x: 120,
          y: HEIGHT / 2,
          radius: 16,
          polarity: "azure",
          hp: 5,
          shield: 0,
          cooldown: 0,
          switchCooldown: 0,
          invuln: 0
        };
        syncHud();
      }

      function syncHud() {
        scoreEl.textContent = Math.floor(state.score);
        chainEl.textContent = "x" + state.chain;
        shieldEl.textContent = Math.min(100, Math.floor(state.player ? state.player.shield : 0)) + "%";
        if (state.mode === "intro") {
          sectorEl.textContent = "Launch";
        } else if (state.mode === "victory") {
          sectorEl.textContent = "Clear";
        } else if (state.mode === "gameover") {
          sectorEl.textContent = "Retry";
        } else if (state.phase === "boss") {
          sectorEl.textContent = "Boss";
        } else {
          sectorEl.textContent = `Wave ${Math.min(state.spawnIndex + 1, waves.length)}/${waves.length}`;
        }
        if (!state.player) {
          polarityEl.textContent = "Azure";
          polarityEl.className = "accent-cyan";
          return;
        }
        const isAzure = state.player.polarity === "azure";
        polarityEl.textContent = isAzure ? "Azure" : "Amber";
        polarityEl.className = isAzure ? "accent-cyan" : "accent-orange";
      }

      function spawnEnemy(def) {
        const y = 80 + def.lane * (HEIGHT - 160);
        state.enemies.push({
          x: WIDTH + 80,
          y,
          radius: def.type === "turret" ? 22 : 18,
          polarity: def.polarity,
          hp: def.hp,
          maxHp: def.hp,
          type: def.type,
          cooldown: 1.2 + Math.random() * 0.8,
          drift: Math.random() * Math.PI * 2
        });
      }

      function spawnBoss() {
        state.phase = "boss";
        state.message = "Boss incoming. Match same-color rounds to absorb, flip late for beam lanes.";
        state.boss = {
          x: WIDTH + 220,
          y: HEIGHT / 2,
          radius: 92,
          hp: 160,
          maxHp: 160,
          entrance: 3,
          attackTimer: 2.5,
          patternIndex: 0
        };
      }

      function firePlayerShot() {
        const player = state.player;
        if (player.cooldown > 0 || state.mode !== "playing") {
          return;
        }
        player.cooldown = 0.14;
        state.bullets.push({
          x: player.x + 26,
          y: player.y,
          vx: 620,
          vy: 0,
          radius: 5,
          polarity: player.polarity
        });
      }

      function switchPolarity() {
        const player = state.player;
        if (player.switchCooldown > 0 || state.mode !== "playing") {
          return;
        }
        player.polarity = player.polarity === "azure" ? "amber" : "azure";
        player.switchCooldown = 0.18;
        state.flash = 0.25;
        syncHud();
      }

      function addParticles(x, y, color, count, speed = 180) {
        for (let i = 0; i < count; i += 1) {
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
          const mag = speed * (0.35 + Math.random() * 0.85);
          state.particles.push({
            x,
            y,
            vx: Math.cos(angle) * mag,
            vy: Math.sin(angle) * mag,
            life: 0.5 + Math.random() * 0.4,
            color
          });
        }
      }

      function loseLife() {
        const player = state.player;
        if (player.invuln > 0) {
          return;
        }
        if (player.shield >= 25) {
          player.shield -= 25;
          player.invuln = 0.8;
          state.message = "Shield bled off. Absorb matching rounds to recharge.";
        } else {
          player.hp -= 1;
          player.invuln = 1.2;
          state.message = "Hull hit. Retry is instant, but boss patterns escalate.";
        }
        state.chain = 0;
        state.chainTimer = 0;
        addParticles(player.x, player.y, COLORS.danger, 14, 230);
        if (player.hp <= 0) {
          state.mode = "gameover";
          state.message = "Ship lost. Press Enter to retry.";
        }
      }

      function awardKill(enemy) {
        if (state.chainTimer > 0) {
          state.chain += 1;
        } else {
          state.chain = 1;
        }
        state.chainTimer = 2.6;
        const base = enemy.type === "turret" ? 300 : 180;
        state.score += base * state.chain;
        addParticles(enemy.x, enemy.y, COLORS[enemy.polarity], 16, 260);
        state.message = state.chain >= 4
          ? "Chain live. Keep deleting targets before the timer burns out."
          : state.message;
      }

      function spawnEnemyBullet(x, y, angle, speed, polarity, type = "orb") {
        state.enemyBullets.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: type === "beam" ? 10 : 8,
          polarity,
          type,
          life: type === "beam" ? 2.4 : 5
        });
      }

      function spawnBossPattern() {
        const boss = state.boss;
        const lanes = [HEIGHT * 0.26, HEIGHT * 0.5, HEIGHT * 0.74];
        const sequence = [
          { targetLane: 0, polarity: "azure" },
          { targetLane: 1, polarity: "amber" },
          { targetLane: 2, polarity: "azure" },
          { targetLane: 1, polarity: "azure" },
          { targetLane: 0, polarity: "amber" },
          { targetLane: 2, polarity: "amber" }
        ];
        const step = sequence[boss.patternIndex % sequence.length];
        boss.patternIndex += 1;
        state.telegraphs.push({
          y: lanes[step.targetLane],
          h: 84,
          polarity: step.polarity,
          timer: 1.05,
          followup: () => {
            for (let i = -1; i <= 1; i += 1) {
              const px = boss.x - 22;
              const py = lanes[step.targetLane] + i * 18;
              spawnEnemyBullet(px, py, Math.PI, 420, step.polarity, "beam");
            }
          }
        });

        const spreadBase = boss.patternIndex % 2 === 0 ? "azure" : "amber";
        for (let i = -2; i <= 2; i += 1) {
          const angle = Math.PI + i * 0.16;
          spawnEnemyBullet(boss.x - 50, boss.y + i * 12, angle, 240, spreadBase);
        }
      }

      function update(dt) {
        state.time += dt;
        state.scroll += dt * 180;
        if (state.flash > 0) {
          state.flash -= dt;
        }

        if (state.mode !== "playing") {
          return;
        }

        state.stageTime += dt;
        const player = state.player;
        player.cooldown = Math.max(0, player.cooldown - dt);
        player.switchCooldown = Math.max(0, player.switchCooldown - dt);
        player.invuln = Math.max(0, player.invuln - dt);

        if (keys.has("ArrowUp") || keys.has("KeyW")) {
          player.y -= 330 * dt;
        }
        if (keys.has("ArrowDown") || keys.has("KeyS")) {
          player.y += 330 * dt;
        }
        if (keys.has("KeyJ")) {
          firePlayerShot();
        }
        player.y = Math.max(44, Math.min(HEIGHT - 44, player.y));

        if (state.chainTimer > 0) {
          state.chainTimer -= dt;
          if (state.chainTimer <= 0) {
            state.chain = 0;
          }
        }

        while (state.phase === "waves" && state.spawnIndex < waves.length && state.stageTime >= waves[state.spawnIndex].time) {
          spawnEnemy(waves[state.spawnIndex]);
          state.spawnIndex += 1;
        }

        if (state.phase === "waves" && state.spawnIndex >= waves.length && state.enemies.length === 0) {
          spawnBoss();
        }

        if (state.phase === "boss" && state.boss) {
          const boss = state.boss;
          boss.x += (WIDTH - 180 - boss.x) * dt * 0.9;
          boss.attackTimer -= dt;
          if (boss.attackTimer <= 0) {
            boss.attackTimer = 2.7;
            spawnBossPattern();
          }
        }

        for (const enemy of state.enemies) {
          enemy.drift += dt * 1.8;
          enemy.x -= (enemy.type === "turret" ? 120 : 220) * dt;
          enemy.y += Math.sin(enemy.drift) * dt * (enemy.type === "turret" ? 28 : 46);
          enemy.cooldown -= dt;
          if (enemy.cooldown <= 0) {
            enemy.cooldown = enemy.type === "turret" ? 1.2 : 1.8;
            const targetY = state.player.y + (Math.random() * 30 - 15);
            const angle = Math.atan2(targetY - enemy.y, state.player.x - enemy.x);
            const speed = enemy.type === "turret" ? 252 : 198;
            spawnEnemyBullet(enemy.x - 16, enemy.y, angle, speed, enemy.polarity);
          }
        }

        state.enemies = state.enemies.filter((enemy) => enemy.x > -80 && enemy.hp > 0);

        for (const bullet of state.bullets) {
          bullet.x += bullet.vx * dt;
          bullet.y += bullet.vy * dt;
        }

        for (const bullet of state.enemyBullets) {
          bullet.x += bullet.vx * dt;
          bullet.y += bullet.vy * dt;
          bullet.life -= dt;
        }

        for (const telegraph of state.telegraphs) {
          telegraph.timer -= dt;
          if (telegraph.timer <= 0 && telegraph.followup) {
            telegraph.followup();
            telegraph.followup = null;
          }
        }

        state.telegraphs = state.telegraphs.filter((telegraph) => telegraph.timer > -0.18);

        for (const particle of state.particles) {
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.life -= dt;
          particle.vx *= 0.98;
          particle.vy *= 0.98;
        }
        state.particles = state.particles.filter((particle) => particle.life > 0);

        for (const bullet of state.bullets) {
          for (const enemy of state.enemies) {
            if (Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y) <= bullet.radius + enemy.radius) {
              enemy.hp -= bullet.polarity === enemy.polarity ? 1 : 2;
              bullet.hit = true;
              addParticles(bullet.x, bullet.y, COLORS[bullet.polarity], 5, 120);
              if (enemy.hp <= 0) {
                awardKill(enemy);
              }
              break;
            }
          }
          if (!bullet.hit && state.boss) {
            const boss = state.boss;
            if (Math.hypot(bullet.x - boss.x, bullet.y - boss.y) <= boss.radius) {
              boss.hp -= bullet.polarity === "azure" ? 1.4 : 1.4;
              bullet.hit = true;
              addParticles(bullet.x, bullet.y, "#ffffff", 4, 80);
              if (boss.hp <= 0) {
                state.score += 5000 + state.chain * 400;
                state.mode = "victory";
                state.message = "Core shattered. Press Enter to rerun for score.";
                addParticles(boss.x, boss.y, COLORS.gold, 32, 340);
              }
            }
          }
        }

        state.bullets = state.bullets.filter((bullet) => !bullet.hit && bullet.x < WIDTH + 80);
        state.enemies = state.enemies.filter((enemy) => enemy.hp > 0);

        for (const bullet of state.enemyBullets) {
          if (bullet.life <= 0) {
            bullet.hit = true;
            continue;
          }
          const hitPlayer = Math.hypot(bullet.x - player.x, bullet.y - player.y) <= bullet.radius + player.radius;
          if (!hitPlayer) {
            continue;
          }
          bullet.hit = true;
          if (bullet.polarity === player.polarity) {
            player.shield = Math.min(100, player.shield + (bullet.type === "beam" ? 12 : 8));
            state.score += 30;
            addParticles(player.x, player.y, COLORS[player.polarity], 7, 140);
            state.message = "Absorb matching fire to bank shield before late swaps.";
          } else {
            loseLife();
          }
        }
        state.enemyBullets = state.enemyBullets.filter((bullet) =>
          !bullet.hit &&
          bullet.x > -40 &&
          bullet.x < WIDTH + 40 &&
          bullet.y > -40 &&
          bullet.y < HEIGHT + 40
        );

        for (const enemy of state.enemies) {
          if (Math.hypot(enemy.x - player.x, enemy.y - player.y) <= enemy.radius + player.radius) {
            enemy.hp = 0;
            loseLife();
          }
        }

        if (state.boss && Math.hypot(state.boss.x - player.x, state.boss.y - player.y) <= state.boss.radius + player.radius) {
          loseLife();
        }

        syncHud();
        chainEl.className = state.chain >= 5 ? "accent-red" : "accent-gold";
        noteEl.textContent = state.message || "Move: W/S or Arrows. Shoot: J. Swap polarity: Space.";
      }

      function drawStarfield() {
        ctx.save();
        ctx.fillStyle = "#04080d";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const near = state.scroll * 0.8;
        const far = state.scroll * 0.35;
        for (let i = 0; i < 80; i += 1) {
          const x = WIDTH - ((i * 131 + far) % (WIDTH + 80));
          const y = (i * 67) % HEIGHT;
          ctx.fillStyle = i % 5 === 0 ? "rgba(255,255,255,0.7)" : "rgba(154,179,203,0.28)";
          ctx.fillRect(x, y, i % 5 === 0 ? 2 : 1, i % 5 === 0 ? 2 : 1);
        }

        for (let i = 0; i < 14; i += 1) {
          const x = WIDTH - ((i * 240 + near) % (WIDTH + 220));
          const y = 42 + ((i * 113) % (HEIGHT - 84));
          const grad = ctx.createRadialGradient(x, y, 0, x, y, 72);
          grad.addColorStop(0, i % 2 === 0 ? COLORS.azureDim : COLORS.amberDim);
          grad.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(x, y, 72, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.strokeStyle = COLORS.glow;
        ctx.lineWidth = 1;
        for (let i = 0; i < 7; i += 1) {
          const y = 70 + i * 72;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(WIDTH, y);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawShip(x, y, polarity, facing = 1, boss = false) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(facing, 1);
        const fill = COLORS[polarity];
        ctx.fillStyle = fill;
        ctx.strokeStyle = "rgba(255,255,255,0.8)";
        ctx.lineWidth = boss ? 4 : 2;
        ctx.beginPath();
        ctx.moveTo(boss ? -78 : -20, 0);
        ctx.lineTo(boss ? -18 : 10, boss ? -56 : -12);
        ctx.lineTo(boss ? 92 : 20, 0);
        ctx.lineTo(boss ? -18 : 10, boss ? 56 : 12);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#d9ebff";
        ctx.beginPath();
        ctx.arc(boss ? 26 : 2, 0, boss ? 18 : 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawEntities() {
        for (const telegraph of state.telegraphs) {
          const alpha = telegraph.timer > 0 ? 0.18 + Math.sin(telegraph.timer * 30) * 0.08 : 0.3;
          ctx.fillStyle = telegraph.polarity === "azure"
            ? `rgba(90, 209, 255, ${Math.max(0.08, alpha)})`
            : `rgba(255, 154, 82, ${Math.max(0.08, alpha)})`;
          ctx.fillRect(0, telegraph.y - telegraph.h / 2, WIDTH, telegraph.h);
        }

        if (state.player) {
          if (state.player.invuln <= 0 || Math.floor(state.time * 16) % 2 === 0) {
            drawShip(state.player.x, state.player.y, state.player.polarity);
          }

          if (state.player.shield > 0) {
            ctx.strokeStyle = state.player.polarity === "azure" ? COLORS.azure : COLORS.amber;
            ctx.lineWidth = 4;
            ctx.globalAlpha = 0.28 + state.player.shield / 170;
            ctx.beginPath();
            ctx.arc(state.player.x, state.player.y, 27, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
        }

        for (const enemy of state.enemies) {
          drawShip(enemy.x, enemy.y, enemy.polarity, -1, enemy.type === "turret");
          ctx.fillStyle = "rgba(7,19,29,0.8)";
          ctx.fillRect(enemy.x - 22, enemy.y - enemy.radius - 14, 44, 5);
          ctx.fillStyle = enemy.polarity === "azure" ? COLORS.azure : COLORS.amber;
          ctx.fillRect(enemy.x - 22, enemy.y - enemy.radius - 14, 44 * (enemy.hp / enemy.maxHp), 5);
        }

        if (state.boss) {
          drawShip(state.boss.x, state.boss.y, state.boss.patternIndex % 2 === 0 ? "azure" : "amber", -1, true);
          ctx.fillStyle = "rgba(7,19,29,0.8)";
          ctx.fillRect(WIDTH - 276, 26, 228, 14);
          const fill = ctx.createLinearGradient(WIDTH - 276, 0, WIDTH - 48, 0);
          fill.addColorStop(0, COLORS.azure);
          fill.addColorStop(1, COLORS.amber);
          ctx.fillStyle = fill;
          ctx.fillRect(WIDTH - 276, 26, 228 * Math.max(0, state.boss.hp / state.boss.maxHp), 14);
          ctx.strokeStyle = "rgba(255,255,255,0.65)";
          ctx.strokeRect(WIDTH - 276, 26, 228, 14);
        }

        for (const bullet of state.bullets) {
          ctx.fillStyle = bullet.polarity === "azure" ? COLORS.azure : COLORS.amber;
          ctx.beginPath();
          ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        for (const bullet of state.enemyBullets) {
          ctx.fillStyle = bullet.polarity === "azure" ? COLORS.azure : COLORS.amber;
          ctx.globalAlpha = bullet.type === "beam" ? 0.8 : 0.95;
          ctx.beginPath();
          ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }

        for (const particle of state.particles) {
          ctx.globalAlpha = Math.max(0, particle.life);
          ctx.fillStyle = particle.color;
          ctx.fillRect(particle.x, particle.y, 3, 3);
        }
        ctx.globalAlpha = 1;
      }

      function drawOverlay() {
        if (state.mode === "playing") {
          return;
        }
        ctx.fillStyle = "rgba(3, 7, 12, 0.56)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.textAlign = "center";
        ctx.fillStyle = "#e8f2ff";
        ctx.font = "700 42px Segoe UI";
        const title = state.mode === "intro"
          ? "Ikaruga Polarity Drift"
          : state.mode === "victory"
            ? "Core Broken"
            : "Hull Lost";
        ctx.fillText(title, WIDTH / 2, HEIGHT / 2 - 34);
        ctx.font = "500 20px Segoe UI";
        const detail = state.mode === "intro"
          ? "Absorb same-color fire, flip late, and keep the chain alive."
          : state.mode === "victory"
            ? "Boss down. Push a cleaner chain next run."
            : "Swap faster on telegraphs and bank more shield.";
        ctx.fillText(detail, WIDTH / 2, HEIGHT / 2 + 8);
        ctx.font = "500 16px Segoe UI";
        ctx.fillStyle = "#9ab3cb";
        ctx.fillText("Press Enter to start. J shoots. Space swaps polarity.", WIDTH / 2, HEIGHT / 2 + 44);
      }

      function render() {
        drawStarfield();
        drawEntities();

        if (state.flash > 0 && state.player) {
          ctx.fillStyle = state.player.polarity === "azure"
            ? "rgba(90, 209, 255, 0.1)"
            : "rgba(255, 154, 82, 0.1)";
          ctx.fillRect(0, 0, WIDTH, HEIGHT);
        }

        ctx.fillStyle = "#e8f2ff";
        ctx.font = "600 14px Segoe UI";
        if (state.player && state.mode === "playing") {
          for (let i = 0; i < state.player.hp; i += 1) {
            ctx.fillRect(26 + i * 18, HEIGHT - 32, 12, 12);
          }
        }

        drawOverlay();
      }

      window.addEventListener("keydown", (event) => {
        keys.add(event.code);
        if (["ArrowUp", "ArrowDown", "Space"].includes(event.code)) {
          event.preventDefault();
        }
        if (event.code === "KeyJ") {
          firePlayerShot();
        }
        if (event.code === "Space") {
          switchPolarity();
        }
        if (event.code === "Enter" && state.mode !== "playing") {
          resetGame();
        }
      });

      window.addEventListener("keyup", (event) => {
        keys.delete(event.code);
      });

      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.033, (now - last) / 1000);
        last = now;
        update(dt);
        render();
        requestAnimationFrame(frame);
      }

      syncHud();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
