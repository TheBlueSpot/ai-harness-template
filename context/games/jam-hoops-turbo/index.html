<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jam Hoops Turbo</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <main class="shell">
    <section class="hud">
      <div class="scoreboard">
        <div class="team team-home">
          <span class="team-label">Home</span>
          <span id="home-score" class="team-score">0</span>
        </div>
        <div class="center-panel">
          <div id="status-line" class="status-line">First to 21</div>
          <div class="meta-row">
            <span>Shot <strong id="shot-clock">14.0</strong></span>
            <span>Possession <strong id="possession-label">Home</strong></span>
            <span>Controlled <strong id="controlled-label">Blaze</strong></span>
          </div>
        </div>
        <div class="team team-away">
          <span class="team-label">Away</span>
          <span id="away-score" class="team-score">0</span>
        </div>
      </div>
      <div class="meters">
        <div class="meter-card">
          <span class="meter-label">Turbo</span>
          <div class="meter-track"><div id="turbo-fill" class="meter-fill"></div></div>
        </div>
        <div class="meter-card">
          <span class="meter-label">Heat</span>
          <div class="meter-track heat-track"><div id="heat-fill" class="meter-fill heat-fill"></div></div>
        </div>
      </div>
    </section>

    <section class="court-wrap">
      <canvas id="game" width="1280" height="720" aria-label="Jam Hoops Turbo game court"></canvas>

      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <p class="eyebrow">Jam Hoops Turbo</p>
          <h1 id="overlay-title">2v2 arcade hoops</h1>
          <p id="overlay-body" class="overlay-body">
            Feed the hot hand, shove loose dribbles free, and race to 21 before the AI catches fire.
          </p>
          <div class="controls">
            <span><strong>Move</strong> WASD or arrows</span>
            <span><strong>Shoot or Steal</strong> Space</span>
            <span><strong>Pass or Switch</strong> X</span>
            <span><strong>Turbo</strong> Shift</span>
          </div>
          <button id="overlay-button" type="button">Start Match</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
