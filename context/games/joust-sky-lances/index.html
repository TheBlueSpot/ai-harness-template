<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joust Sky Lances</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <main class="shell">
    <section class="frame">
      <canvas id="game" width="1280" height="720" aria-label="Joust Sky Lances"></canvas>
      <div class="hud-bar">
        <div class="brand">
          <strong>Joust Sky Lances</strong>
          <span>Hover above riders, steal eggs before they hatch.</span>
        </div>
        <div class="controls">Move `WASD` / Arrows | Flap `Space` | Surge `Shift` | Restart `R`</div>
      </div>
      <div id="overlay" class="overlay"></div>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
