<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Microgame Mayhem</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="hud" aria-label="Game HUD">
        <div class="hud__left">
          <span id="roundLabel">Round 0 / 0</span>
          <span id="timerLabel">0.0s</span>
        </div>
        <div class="hud__center" id="objectiveLabel">Press Enter to start</div>
        <div class="hud__right">
          <span id="livesLabel">Lives 3</span>
          <span id="scoreLabel">Score 0</span>
        </div>
      </section>
      <canvas id="gameCanvas" width="960" height="540" aria-label="Microgame arena"></canvas>
      <section class="overlay" id="overlay">
        <div class="panel">
          <p class="eyebrow">Microgame Mayhem</p>
          <h1 id="overlayTitle">Eight Seconds. One Rule.</h1>
          <p id="overlayBody">Clear short one-screen microgames before the prompt speed crushes you.</p>
          <p class="hint">Move: Arrow Keys or WASD. Confirm / Action: Space or Enter. Restart: R.</p>
        </div>
      </section>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
