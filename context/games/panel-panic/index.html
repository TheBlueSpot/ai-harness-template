<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Panic Rising</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section class="hud">
      <div class="hud__group">
        <span class="hud__label">Score</span>
        <strong id="score">0</strong>
      </div>
      <div class="hud__group">
        <span class="hud__label">Goal</span>
        <strong id="goal">4000</strong>
      </div>
      <div class="hud__group">
        <span class="hud__label">Speed</span>
        <strong id="speed">1</strong>
      </div>
      <div class="hud__group">
        <span class="hud__label">Chain</span>
        <strong id="chain">0</strong>
      </div>
    </section>
    <section class="playfield-wrap">
      <canvas id="game" width="540" height="760" aria-label="Panel Panic Rising"></canvas>
      <div class="status-card">
        <p id="status-line">Match 3+ panels. Hold the top line low.</p>
        <p id="hint-line">Arrow keys move. Space swaps. Shift raises. Enter starts or restarts.</p>
      </div>
      <div id="overlay" class="overlay">
        <div class="overlay__card">
          <h1 id="overlay-title">Panel Panic Rising</h1>
          <p id="overlay-copy">Swap adjacent panels into lines of 3 or more before the stack reaches the ceiling.</p>
          <button id="overlay-button" type="button">Start</button>
        </div>
      </div>
    </section>
  </main>
  <script src="./game.js"></script>
</body>
</html>
