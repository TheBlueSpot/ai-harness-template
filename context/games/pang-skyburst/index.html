<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pang Skyburst</title>
    <meta name="description" content="Standalone browser shell for Pang Skyburst." />
    <link rel="stylesheet" href="./src/styles.css" />
    <script defer src="./game.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="playfield" aria-label="Pang Skyburst">
        <canvas id="gameCanvas" class="game-canvas" aria-label="Game view"></canvas>

        <div id="hud" class="hud" aria-live="polite">
          <div class="hud__row">
            <span class="hud__label">Score</span>
            <span id="hudScore" class="hud__value">0</span>
          </div>
          <div class="hud__row">
            <span class="hud__label">Lives</span>
            <span id="hudLives" class="hud__value">3</span>
          </div>
          <div class="hud__row">
            <span class="hud__label">Goal</span>
            <span id="hudGoal" class="hud__value">0%</span>
          </div>
          <p id="hudHint" class="hud__hint"></p>
        </div>

        <section id="overlay" class="overlay" hidden>
          <p id="overlayKicker" class="overlay__kicker">Arcade Shell</p>
          <h1 id="overlayTitle" class="overlay__title">Pang Skyburst</h1>
          <p id="overlayCopy" class="overlay__copy"></p>
          <div class="overlay__actions">
            <button id="overlayPrimary" class="overlay__button" type="button">Start</button>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
