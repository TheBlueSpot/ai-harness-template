<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peggle Ricochet</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="frame">
        <header class="hud">
          <div class="hud__group">
            <span class="hud__label">Orange</span>
            <span id="orange-count" class="hud__value">0</span>
          </div>
          <div class="hud__group">
            <span class="hud__label">Shots</span>
            <span id="shots-count" class="hud__value">0</span>
          </div>
          <div class="hud__group">
            <span class="hud__label">Score</span>
            <span id="score-count" class="hud__value">0</span>
          </div>
          <div class="hud__group">
            <span class="hud__label">Bucket</span>
            <span id="bucket-state" class="hud__value">Ready</span>
          </div>
        </header>
        <div class="stage">
          <canvas id="game" width="960" height="720" aria-label="Peggle Ricochet playfield"></canvas>
          <section id="overlay" class="overlay overlay--visible">
            <div class="overlay__card">
              <p id="overlay-kicker" class="overlay__kicker">Peggle Ricochet</p>
              <h1 id="overlay-title">Bank the shot. Clear the orange pegs.</h1>
              <p id="overlay-copy">
                Aim with the mouse. Click or press Space to fire. Catch the ball in the
                bucket for an extra shot. Press Enter to start or retry instantly.
              </p>
              <div class="overlay__actions">
                <button id="start-button" type="button">Start Run</button>
                <span>Mouse aim | Click / Space fire | R reset</span>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
