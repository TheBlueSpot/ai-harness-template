<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rampage City Smash</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main id="shell" class="shell">
      <canvas id="game-canvas" aria-label="Rampage City Smash playfield"></canvas>
      <section id="hud" class="hud" aria-live="polite">
        <div class="hud__row">
          <span class="hud__label">Target</span>
          <span id="hudTarget" class="hud__value">0</span>
        </div>
        <div class="hud__row">
          <span class="hud__label">Next</span>
          <span id="hudObjective" class="hud__value">First tower</span>
        </div>
        <div class="hud__row">
          <span class="hud__label">Damage</span>
          <span id="hudDamage" class="hud__value">0</span>
        </div>
        <div class="hud__row">
          <span class="hud__label">Health</span>
          <span id="hudHealth" class="hud__value">0</span>
        </div>
        <div class="hud__row">
          <span class="hud__label">Wave</span>
          <span id="hudWave" class="hud__value">0</span>
        </div>
        <div id="hudPrompt" class="hud__prompt"></div>
      </section>
      <section id="overlay" class="overlay" aria-live="polite">
        <div class="overlay__card">
          <p id="overlayEyebrow" class="overlay__eyebrow">Arcade run</p>
          <h1 id="overlayTitle" class="overlay__title">Rampage City Smash</h1>
          <p id="overlayCopy" class="overlay__copy"></p>
          <button id="overlayButton" class="overlay__button" type="button">Start</button>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
