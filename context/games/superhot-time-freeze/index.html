<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SUPERHOT Time Freeze</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090909;
        --panel: rgba(14, 14, 16, 0.9);
        --grid: rgba(255, 255, 255, 0.08);
        --player: #f7f2e8;
        --enemy: #ff3b3b;
        --enemy-soft: rgba(255, 59, 59, 0.28);
        --pickup: #ffd166;
        --glass: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.06), transparent 18%),
          linear-gradient(180deg, #1a1a1c 0%, #090909 72%);
        color: var(--player);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(100vw, 1040px);
        padding: 16px;
      }

      canvas {
        width: 100%;
        display: block;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 20px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 20%),
          #0d0d0f;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="game" width="960" height="540" aria-label="SUPERHOT Time Freeze" role="img"></canvas>
    </main>
    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");

      const arena = { x: 72, y: 72, w: 816, h: 396 };
      const keys = new Set();
      const mouse = { x: canvas.width * 0.5, y: canvas.height * 0.5, down: false };
      const pickupPads = [
        { x: arena.x + 110, y: arena.y + 92 },
        { x: arena.x + arena.w - 110, y: arena.y + 92 },
        { x: arena.x + 110, y: arena.y + arena.h - 92 },
        { x: arena.x + arena.w - 110, y: arena.y + arena.h - 92 },
        { x: arena.x + arena.w * 0.5, y: arena.y + 72 },
        { x: arena.x + arena.w * 0.5, y: arena.y + arena.h - 72 },
      ];

      const weaponDefinitions = {
        pistol: { label: "Pistol", ammo: 9, cooldown: 0.28, speed: 690, spread: 0.02, pellets: 1, color: "#f7f2e8" },
        shotgun: { label: "Shotgun", ammo: 4, cooldown: 0.58, speed: 620, spread: 0.26, pellets: 5, color: "#ffd166" },
        burst: { label: "Burst", ammo: 12, cooldown: 0.18, speed: 760, spread: 0.06, pellets: 1, burst: 3, color: "#9be7ff" },
        rail: { label: "Rail", ammo: 3, cooldown: 0.95, speed: 980, spread: 0, pellets: 1, pierce: 3, color: "#b8ffba" },
      };
      const weaponPool = ["shotgun", "burst", "rail"];

      const state = {
        mode: "title",
        wave: 1,
        score: 0,
        time: 0,
        timeScale: 0.1,
        transition: 0,
        message: "",
        shake: 0,
        flash: 0,
        fireKick: 0,
        player: null,
        enemies: [],
        bullets: [],
        pickups: [],
        shards: [],
      };

      function resetGame() {
        state.mode = "title";
        state.wave = 1;
        state.score = 0;
        state.time = 0;
        state.timeScale = 0.1;
        state.transition = 0;
        state.message = "Move to make time advance.";
        state.shake = 0;
        state.flash = 0;
        state.fireKick = 0;
        state.enemies = [];
        state.bullets = [];
        state.pickups = [];
        state.shards = [];
        state.player = createPlayer();
      }

      function createPlayer() {
        return {
          x: arena.x + arena.w * 0.5,
          y: arena.y + arena.h * 0.5,
          r: 10,
          hp: 3,
          moveSpeed: 280,
          dashGlow: 0,
          weapon: weaponFromType("pistol"),
          burstShots: 0,
          burstTimer: 0,
          invuln: 0,
          readyPulse: 0,
          pickupLock: false,
        };
      }

      function weaponFromType(type) {
        const def = weaponDefinitions[type];
        return {
          type,
          label: def.label,
          ammo: def.ammo,
          cooldown: 0,
          cooldownMax: def.cooldown,
          speed: def.speed,
          spread: def.spread,
          pellets: def.pellets,
          burst: def.burst || 0,
          pierce: def.pierce || 1,
          color: def.color,
        };
      }

      function spawnWave(wave) {
        state.enemies = [];
        state.bullets = [];
        state.pickups = state.pickups.filter((pickup) => pickup.floor);
        const count = 3 + wave * 2;
        for (let i = 0; i < count; i += 1) {
          const shooterBias = wave < 2 ? 0.7 : 0.52;
          const type = Math.random() < shooterBias ? "shooter" : "charger";
          const edge = i % 4;
          let x = arena.x;
          let y = arena.y;
          if (edge === 0) {
            x = arena.x + 24 + Math.random() * (arena.w - 48);
            y = arena.y + 18;
          } else if (edge === 1) {
            x = arena.x + arena.w - 18;
            y = arena.y + 24 + Math.random() * (arena.h - 48);
          } else if (edge === 2) {
            x = arena.x + 24 + Math.random() * (arena.w - 48);
            y = arena.y + arena.h - 18;
          } else {
            x = arena.x + 18;
            y = arena.y + 24 + Math.random() * (arena.h - 48);
          }
          state.enemies.push(createEnemy(type, x, y, wave));
        }
        seedArenaPickups(wave, wave === 1);
        state.message = wave === 1 ? "Time moves when you move." : "Clear the room and scavenge.";
      }

      function createEnemy(type, x, y, wave) {
        return {
          type,
          x,
          y,
          r: type === "charger" ? 12 : 10,
          speed: type === "charger" ? 118 + wave * 7 : 76 + wave * 5,
          hp: type === "charger" ? 2 : 1,
          telegraph: 0.9 + Math.random() * 0.35,
          cooldown: 0.7 + Math.random() * 0.45,
          attackTimer: 0,
          attackDir: { x: 1, y: 0 },
          dashDir: { x: 1, y: 0 },
          dashSpeed: 0,
          pulse: Math.random() * Math.PI * 2,
        };
      }

      function seedArenaPickups(wave, opening) {
        const activePads = opening
          ? [pickupPads[Math.floor(Math.random() * pickupPads.length)]]
          : pickupPads.filter(() => Math.random() < (0.38 + Math.min(0.2, wave * 0.03)));
        for (const pad of activePads) {
          if (state.pickups.some((pickup) => distance(pickup.x, pickup.y, pad.x, pad.y) < 28)) {
            continue;
          }
          const type = opening && Math.random() < 0.5 ? "pistol" : weaponPool[Math.floor(Math.random() * weaponPool.length)];
          state.pickups.push({
            x: pad.x,
            y: pad.y,
            type,
            ammo: weaponDefinitions[type].ammo,
            floor: true,
            bob: Math.random() * Math.PI * 2,
          });
        }
      }

      function startRun() {
        resetGame();
        state.mode = "running";
        state.wave = 1;
        state.score = 0;
        state.transition = 0.8;
        state.player.weapon = weaponFromType("pistol");
        state.player.hp = 3;
        state.pickups = [];
        spawnWave(state.wave);
      }

      function restartRun() {
        startRun();
      }

      function pickWeapon() {
        const player = state.player;
        let nearest = null;
        let bestDistance = 34;
        for (const pickup of state.pickups) {
          const d = distance(player.x, player.y, pickup.x, pickup.y);
          if (d < bestDistance) {
            bestDistance = d;
            nearest = pickup;
          }
        }
        if (!nearest) {
          return;
        }
        player.weapon = weaponFromType(nearest.type);
        player.weapon.ammo = nearest.ammo;
        player.readyPulse = 0.55;
        state.message = `${player.weapon.label} scavenged.`;
        state.pickups = state.pickups.filter((pickup) => pickup !== nearest);
      }

      function fireWeapon(angle) {
        const player = state.player;
        const weapon = player.weapon;
        if (weapon.cooldown > 0 || weapon.ammo <= 0) {
          return;
        }
        weapon.cooldown = weapon.cooldownMax;
        weapon.ammo -= 1;
        state.fireKick = 0.38;
        state.shake = Math.max(state.shake, 5);
        const shots = weapon.burst > 0 ? 1 : weapon.pellets;
        for (let i = 0; i < shots; i += 1) {
          const spread = weapon.pellets > 1 ? ((i / Math.max(1, weapon.pellets - 1)) - 0.5) * weapon.spread : randomRange(-weapon.spread, weapon.spread);
          const shotAngle = angle + spread;
          spawnBullet(player.x, player.y, shotAngle, weapon.speed, "player", weapon.color, weapon.pierce);
        }
        if (weapon.burst > 0) {
          player.burstShots = weapon.burst - 1;
          player.burstTimer = 0.07;
          player.burstAngle = angle;
        }
        if (weapon.ammo <= 0) {
          state.message = "Weapon empty. Scavenge another.";
        }
      }

      function spawnBullet(x, y, angle, speed, owner, color, pierce = 1) {
        state.bullets.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: owner === "player" ? 4 : 5,
          owner,
          color,
          life: owner === "player" ? 1.1 : 1.4,
          pierce,
        });
      }

      function update(dt) {
        if (state.mode !== "running") {
          state.flash = Math.max(0, state.flash - dt * 2.5);
          return;
        }

        const player = state.player;
        state.time += dt;
        state.shake = Math.max(0, state.shake - dt * 12);
        state.flash = Math.max(0, state.flash - dt * 4);
        state.transition = Math.max(0, state.transition - dt);
        state.fireKick = Math.max(0, state.fireKick - dt * 2.2);
        player.invuln = Math.max(0, player.invuln - dt);
        player.dashGlow = Math.max(0, player.dashGlow - dt * 1.7);
        player.readyPulse = Math.max(0, player.readyPulse - dt * 2.8);

        const moveX = (keys.has("KeyD") || keys.has("ArrowRight") ? 1 : 0) - (keys.has("KeyA") || keys.has("ArrowLeft") ? 1 : 0);
        const moveY = (keys.has("KeyS") || keys.has("ArrowDown") ? 1 : 0) - (keys.has("KeyW") || keys.has("ArrowUp") ? 1 : 0);
        const moveLength = Math.hypot(moveX, moveY);
        const moveIntent = moveLength > 0 ? 1 : 0;
        state.timeScale = clamp(0.08 + moveIntent * 0.9 + state.fireKick, 0.08, 1);

        if (moveLength > 0) {
          const dirX = moveX / moveLength;
          const dirY = moveY / moveLength;
          player.x += dirX * player.moveSpeed * dt;
          player.y += dirY * player.moveSpeed * dt;
        }

        player.x = clamp(player.x, arena.x + 16, arena.x + arena.w - 16);
        player.y = clamp(player.y, arena.y + 16, arena.y + arena.h - 16);

        const aimAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        const scaledDt = dt * state.timeScale;

        if (mouse.down || keys.has("Space")) {
          fireWeapon(aimAngle);
        }

        const weapon = player.weapon;
        const wasCoolingDown = weapon.cooldown > 0;
        weapon.cooldown = Math.max(0, weapon.cooldown - scaledDt);
        if (wasCoolingDown && weapon.cooldown === 0 && weapon.ammo > 0) {
          player.readyPulse = 0.55;
        }
        if (player.burstShots > 0) {
          player.burstTimer -= scaledDt;
          if (player.burstTimer <= 0 && weapon.ammo > 0) {
            player.burstShots -= 1;
            player.burstTimer = 0.07;
            weapon.ammo -= 1;
            spawnBullet(player.x, player.y, player.burstAngle + randomRange(-0.05, 0.05), weapon.speed, "player", weapon.color, weapon.pierce);
            state.shake = Math.max(state.shake, 3);
            if (weapon.ammo <= 0) {
              state.message = "Weapon empty. Scavenge another.";
            }
          }
        }

        for (const enemy of state.enemies) {
          enemy.pulse += dt * 2;
          if (enemy.attackTimer > 0) {
            enemy.attackTimer -= scaledDt;
            enemy.x += enemy.dashDir.x * enemy.dashSpeed * scaledDt;
            enemy.y += enemy.dashDir.y * enemy.dashSpeed * scaledDt;
            enemy.x = clamp(enemy.x, arena.x + enemy.r, arena.x + arena.w - enemy.r);
            enemy.y = clamp(enemy.y, arena.y + enemy.r, arena.y + arena.h - enemy.r);
            if (enemy.attackTimer <= 0) {
              enemy.cooldown = enemy.type === "charger" ? 1.05 : 0.72;
              enemy.dashSpeed = 0;
            }
            continue;
          }

          if (enemy.telegraph > 0) {
            enemy.telegraph -= scaledDt;
            if (enemy.telegraph <= 0) {
              if (enemy.type === "shooter") {
                const angle = Math.atan2(enemy.attackDir.y, enemy.attackDir.x);
                spawnBullet(enemy.x, enemy.y, angle, 330 + state.wave * 22, "enemy", "#ff3b3b");
                enemy.cooldown = 0.95;
              } else {
                enemy.attackTimer = 0.42;
                enemy.dashSpeed = 420;
              }
            }
            continue;
          }

          if (enemy.cooldown > 0) {
            enemy.cooldown -= scaledDt;
            const dx = player.x - enemy.x;
            const dy = player.y - enemy.y;
            const d = Math.hypot(dx, dy) || 1;
            const strafe = enemy.type === "shooter" ? 0.65 : 0.15;
            const dirX = dx / d;
            const dirY = dy / d;
            enemy.x += (dirX - dirY * strafe) * enemy.speed * scaledDt;
            enemy.y += (dirY + dirX * strafe) * enemy.speed * scaledDt;
            enemy.x = clamp(enemy.x, arena.x + enemy.r, arena.x + arena.w - enemy.r);
            enemy.y = clamp(enemy.y, arena.y + enemy.r, arena.y + arena.h - enemy.r);
            if (enemy.cooldown <= 0) {
              const leadX = player.x + ((keys.has("KeyD") || keys.has("ArrowRight") ? 1 : 0) - (keys.has("KeyA") || keys.has("ArrowLeft") ? 1 : 0)) * 28;
              const leadY = player.y + ((keys.has("KeyS") || keys.has("ArrowDown") ? 1 : 0) - (keys.has("KeyW") || keys.has("ArrowUp") ? 1 : 0)) * 28;
              const aimDx = leadX - enemy.x;
              const aimDy = leadY - enemy.y;
              const aimDist = Math.hypot(aimDx, aimDy) || 1;
              enemy.attackDir = { x: aimDx / aimDist, y: aimDy / aimDist };
              enemy.dashDir = { x: aimDx / aimDist, y: aimDy / aimDist };
              enemy.telegraph = enemy.type === "charger" ? 0.82 : 0.98;
            }
          }
        }

        for (const bullet of state.bullets) {
          const bulletDt = bullet.owner === "player" ? dt : scaledDt;
          bullet.x += bullet.vx * bulletDt;
          bullet.y += bullet.vy * bulletDt;
          bullet.life -= bulletDt;
        }

        for (const shard of state.shards) {
          shard.x += shard.vx * dt;
          shard.y += shard.vy * dt;
          shard.vx *= 0.98;
          shard.vy *= 0.98;
          shard.life -= dt;
        }

        resolveCollisions();
        state.bullets = state.bullets.filter((bullet) => bullet.life > 0 && bullet.x > arena.x - 40 && bullet.x < arena.x + arena.w + 40 && bullet.y > arena.y - 40 && bullet.y < arena.y + arena.h + 40);
        state.shards = state.shards.filter((shard) => shard.life > 0);
        state.pickups = state.pickups.filter((pickup) => pickup.ammo > 0);

        if (state.enemies.length === 0) {
          state.wave += 1;
          if (state.wave > 5) {
            state.mode = "win";
            state.message = "Arena cleared.";
          } else {
            spawnWave(state.wave);
          }
        }
      }

      function resolveCollisions() {
        const player = state.player;

        for (const bullet of state.bullets) {
          if (bullet.owner === "player") {
            for (const enemy of state.enemies) {
              if (distance(bullet.x, bullet.y, enemy.x, enemy.y) <= enemy.r + bullet.r) {
                enemy.hp -= bullet.color === "#b8ffba" ? 2 : 1;
                bullet.pierce -= 1;
                burstGlass(enemy.x, enemy.y, bullet.color, 5);
                state.shake = Math.max(state.shake, 4);
                if (enemy.hp <= 0) {
                  destroyEnemy(enemy);
                  state.score += enemy.type === "charger" ? 150 : 100;
                }
                if (bullet.pierce <= 0) {
                  bullet.life = 0;
                }
                break;
              }
            }
          } else if (distance(bullet.x, bullet.y, player.x, player.y) <= player.r + bullet.r) {
            bullet.life = 0;
            hurtPlayer();
          }
        }

        for (const enemy of state.enemies) {
          if (distance(enemy.x, enemy.y, player.x, player.y) <= enemy.r + player.r + 2) {
            hurtPlayer();
            const pushAngle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            player.x += Math.cos(pushAngle) * 18;
            player.y += Math.sin(pushAngle) * 18;
          }
        }
      }

      function destroyEnemy(enemy) {
        burstGlass(enemy.x, enemy.y, "#ff5a5a", 12);
        state.enemies = state.enemies.filter((entry) => entry !== enemy);
        if (Math.random() < 0.42) {
          const type = weaponPool[Math.floor(Math.random() * weaponPool.length)];
          state.pickups.push({
            x: enemy.x,
            y: enemy.y,
            type,
            ammo: Math.max(2, Math.floor(weaponDefinitions[type].ammo * (0.55 + Math.random() * 0.35))),
            floor: true,
            bob: Math.random() * Math.PI * 2,
          });
        }
      }

      function burstGlass(x, y, color, count) {
        for (let i = 0; i < count; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 40 + Math.random() * 180;
          state.shards.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.3 + Math.random() * 0.4,
            color,
          });
        }
      }

      function hurtPlayer() {
        const player = state.player;
        if (player.invuln > 0) {
          return;
        }
        player.hp -= 1;
        player.invuln = 0.9;
        player.dashGlow = 1;
        state.flash = 0.75;
        state.shake = 9;
        state.message = "Keep moving or break the vector.";
        if (player.hp <= 0) {
          state.mode = "lose";
          state.message = "Shattered.";
        }
      }

      function draw() {
        const shakeX = (Math.random() - 0.5) * state.shake;
        const shakeY = (Math.random() - 0.5) * state.shake;
        ctx.save();
        ctx.translate(shakeX, shakeY);

        drawBackground();
        drawArena();
        drawPickups();
        drawBullets();
        drawEnemies();
        drawShards();
        drawReticle();
        drawPlayer();
        drawHud();

        if (state.mode === "title") {
          drawOverlay("SUPERHOT TIME FREEZE", "Move to advance time. Click to fire. Press E to scavenge floor weapons. Press Enter to begin.");
        } else if (state.mode === "lose") {
          drawOverlay("SHATTERED", "Press Enter to retry. Movement is survival because frozen time still leaves vectors on the floor.");
        } else if (state.mode === "win") {
          drawOverlay("ARENA CLEAR", "Press Enter to run again. You survived five rooms of moving time.");
        }

        if (state.flash > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${state.flash * 0.18})`;
          ctx.fillRect(-24, -24, canvas.width + 48, canvas.height + 48);
        }
        ctx.restore();
      }

      function drawBackground() {
        ctx.fillStyle = "#090909";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "rgba(255,255,255,0.06)";
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x + 0.5, 0);
          ctx.lineTo(x + 0.5, canvas.height);
          ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y + 0.5);
          ctx.lineTo(canvas.width, y + 0.5);
          ctx.stroke();
        }
      }

      function drawArena() {
        ctx.fillStyle = "rgba(255,255,255,0.02)";
        ctx.fillRect(arena.x, arena.y, arena.w, arena.h);
        ctx.strokeStyle = "rgba(255,255,255,0.16)";
        ctx.lineWidth = 2;
        ctx.strokeRect(arena.x, arena.y, arena.w, arena.h);

        for (const pad of pickupPads) {
          ctx.strokeStyle = "rgba(255, 209, 102, 0.12)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(pad.x, pad.y, 16, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      function drawPickups() {
        ctx.textAlign = "center";
        ctx.font = "11px Arial";
        for (const pickup of state.pickups) {
          const bob = Math.sin(state.time * 3 + pickup.bob) * 4;
          ctx.fillStyle = weaponDefinitions[pickup.type].color;
          ctx.beginPath();
          ctx.rect(pickup.x - 10, pickup.y - 4 + bob, 20, 8);
          ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255,0.22)";
          ctx.strokeRect(pickup.x - 10, pickup.y - 4 + bob, 20, 8);
          ctx.fillStyle = "rgba(255,255,255,0.75)";
          ctx.fillText(`${weaponDefinitions[pickup.type].label} ${pickup.ammo}`, pickup.x, pickup.y - 14 + bob);
        }

        const nearby = state.pickups.find((pickup) => distance(pickup.x, pickup.y, state.player.x, state.player.y) < 34);
        if (nearby && state.mode === "running") {
          ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
          ctx.fillRect(state.player.x - 84, state.player.y + 20, 168, 22);
          ctx.fillStyle = "#f7f2e8";
          ctx.fillText(`Press E to scavenge ${weaponDefinitions[nearby.type].label}`, state.player.x, state.player.y + 35);
        }
      }

      function drawBullets() {
        for (const bullet of state.bullets) {
          ctx.fillStyle = bullet.color;
          ctx.beginPath();
          ctx.arc(bullet.x, bullet.y, bullet.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawEnemies() {
        for (const enemy of state.enemies) {
          if (enemy.telegraph > 0) {
            const length = enemy.type === "charger" ? 110 : 220;
            const pulse = 0.35 + Math.sin(enemy.pulse * 9) * 0.18;
            ctx.strokeStyle = `rgba(255, 59, 59, ${0.42 + pulse})`;
            ctx.lineWidth = enemy.type === "charger" ? 14 : 6;
            ctx.beginPath();
            ctx.moveTo(enemy.x, enemy.y);
            ctx.lineTo(enemy.x + enemy.attackDir.x * length, enemy.y + enemy.attackDir.y * length);
            ctx.stroke();
          }

          ctx.fillStyle = enemy.type === "charger" ? "#ff6b6b" : "#ff3b3b";
          ctx.beginPath();
          ctx.moveTo(enemy.x, enemy.y - enemy.r);
          ctx.lineTo(enemy.x + enemy.r, enemy.y);
          ctx.lineTo(enemy.x, enemy.y + enemy.r);
          ctx.lineTo(enemy.x - enemy.r, enemy.y);
          ctx.closePath();
          ctx.fill();
        }
      }

      function drawShards() {
        for (const shard of state.shards) {
          ctx.fillStyle = shard.color;
          ctx.globalAlpha = Math.max(0, shard.life * 1.7);
          ctx.fillRect(shard.x - 2, shard.y - 2, 4, 4);
          ctx.globalAlpha = 1;
        }
      }

      function drawPlayer() {
        const player = state.player;
        const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        const readyRatio = getWeaponReadyRatio(player.weapon);
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(angle);
        ctx.fillStyle = player.invuln > 0 && Math.floor(state.time * 14) % 2 === 0 ? "rgba(247,242,232,0.4)" : "#f7f2e8";
        ctx.fillRect(-9, -9, 18, 18);
        ctx.fillStyle = player.weapon.color;
        ctx.fillRect(0, -2, 18, 4);
        if (player.dashGlow > 0) {
          ctx.strokeStyle = `rgba(255,255,255,${player.dashGlow * 0.55})`;
          ctx.lineWidth = 2;
          ctx.strokeRect(-13, -13, 26, 26);
        }
        ctx.restore();

        ctx.strokeStyle = `rgba(255, 255, 255, ${0.18 + readyRatio * 0.32 + player.readyPulse * 0.25})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(player.x, player.y, 16, -Math.PI * 0.5, -Math.PI * 0.5 + readyRatio * Math.PI * 2);
        ctx.stroke();
      }

      function drawReticle() {
        const player = state.player;
        const weapon = player.weapon;
        const readyRatio = getWeaponReadyRatio(weapon);
        const canFire = weapon.ammo > 0 && weapon.cooldown <= 0;
        const ringRadius = 16 + player.readyPulse * 4;

        ctx.save();
        ctx.translate(mouse.x, mouse.y);
        ctx.strokeStyle = "rgba(255,255,255,0.18)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = weapon.ammo <= 0 ? "rgba(255, 90, 90, 0.88)" : weapon.color;
        ctx.lineWidth = canFire ? 4 : 3;
        ctx.beginPath();
        ctx.arc(0, 0, ringRadius, -Math.PI * 0.5, -Math.PI * 0.5 + readyRatio * Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = canFire ? "rgba(255,255,255,0.9)" : "rgba(255,255,255,0.5)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-10, 0);
        ctx.lineTo(-4, 0);
        ctx.moveTo(4, 0);
        ctx.lineTo(10, 0);
        ctx.moveTo(0, -10);
        ctx.lineTo(0, -4);
        ctx.moveTo(0, 4);
        ctx.lineTo(0, 10);
        ctx.stroke();

        if (weapon.ammo <= 0) {
          ctx.strokeStyle = "rgba(255, 90, 90, 0.92)";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(-7, -7);
          ctx.lineTo(7, 7);
          ctx.moveTo(7, -7);
          ctx.lineTo(-7, 7);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawHud() {
        const weapon = state.player.weapon;
        const readyRatio = getWeaponReadyRatio(weapon);
        const weaponReadyLabel = weapon.ammo <= 0 ? "EMPTY" : readyRatio >= 1 ? "READY" : "RECOVER";
        ctx.fillStyle = "rgba(0,0,0,0.66)";
        ctx.fillRect(20, 18, 226, 88);
        ctx.fillRect(canvas.width - 230, 18, 210, 104);
        ctx.fillStyle = "#f7f2e8";
        ctx.font = "14px Arial";
        ctx.textAlign = "left";
        ctx.fillText(`Wave ${Math.min(state.wave, 5)}`, 34, 42);
        ctx.fillText(`Score ${state.score}`, 34, 64);
        ctx.fillText(`Time flow ${(state.timeScale * 100).toFixed(0)}%`, 34, 86);
        ctx.textAlign = "right";
        ctx.fillText(weapon.label, canvas.width - 34, 42);
        ctx.fillText(`Ammo ${weapon.ammo}`, canvas.width - 34, 64);
        ctx.fillText(`HP ${renderPips(state.player.hp, 3)}`, canvas.width - 34, 86);

        ctx.fillStyle = "rgba(255,255,255,0.12)";
        ctx.fillRect(canvas.width - 156, 96, 122, 8);
        ctx.fillStyle = weapon.ammo <= 0 ? "rgba(255, 90, 90, 0.88)" : weapon.color;
        ctx.fillRect(canvas.width - 156, 96, 122 * readyRatio, 8);
        ctx.strokeStyle = "rgba(255,255,255,0.22)";
        ctx.lineWidth = 1;
        ctx.strokeRect(canvas.width - 156, 96, 122, 8);
        ctx.fillStyle = "#f7f2e8";
        ctx.font = "11px Arial";
        ctx.fillText(weaponReadyLabel, canvas.width - 34, 112);

        if (state.message) {
          ctx.fillStyle = "rgba(0,0,0,0.74)";
          ctx.fillRect(canvas.width * 0.5 - 210, canvas.height - 52, 420, 28);
          ctx.fillStyle = "#f7f2e8";
          ctx.textAlign = "center";
          ctx.font = "14px Arial";
          ctx.fillText(state.message, canvas.width * 0.5, canvas.height - 33);
        }
      }

      function drawOverlay(title, subtitle) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.76)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = "center";
        ctx.fillStyle = "#f7f2e8";
        ctx.font = "700 40px Arial";
        ctx.fillText(title, canvas.width * 0.5, 190);
        ctx.font = "18px Arial";
        wrapText(subtitle, canvas.width * 0.5, 246, 460, 28);
      }

      function wrapText(text, x, y, maxWidth, lineHeight) {
        const words = text.split(" ");
        let line = "";
        let lineY = y;
        for (const word of words) {
          const test = `${line}${word} `;
          if (ctx.measureText(test).width > maxWidth && line) {
            ctx.fillText(line.trim(), x, lineY);
            line = `${word} `;
            lineY += lineHeight;
          } else {
            line = test;
          }
        }
        if (line) {
          ctx.fillText(line.trim(), x, lineY);
        }
      }

      function loop(timestamp) {
        if (!loop.last) {
          loop.last = timestamp;
        }
        const dt = Math.min(0.033, (timestamp - loop.last) / 1000);
        loop.last = timestamp;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      function distance(ax, ay, bx, by) {
        return Math.hypot(ax - bx, ay - by);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function randomRange(min, max) {
        return min + Math.random() * (max - min);
      }

      function getWeaponReadyRatio(weapon) {
        if (weapon.ammo <= 0) {
          return 0;
        }
        if (weapon.cooldownMax <= 0) {
          return 1;
        }
        return clamp(1 - weapon.cooldown / weapon.cooldownMax, 0, 1);
      }

      function renderPips(value, maxValue) {
        const filled = Math.max(0, Math.min(maxValue, value));
        return `${"#".repeat(filled)}${"-".repeat(Math.max(0, maxValue - filled))}`;
      }

      window.addEventListener("keydown", (event) => {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(event.code)) {
          event.preventDefault();
        }
        keys.add(event.code);
        if (event.code === "Enter") {
          if (state.mode === "title") {
            startRun();
          } else if (state.mode === "lose" || state.mode === "win") {
            restartRun();
          }
        }
        if (event.code === "KeyR" && state.mode === "running") {
          restartRun();
        }
        if (event.code === "KeyE" && state.mode === "running") {
          pickWeapon();
        }
      });

      window.addEventListener("keyup", (event) => {
        keys.delete(event.code);
      });

      canvas.addEventListener("mousemove", (event) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * canvas.width;
        mouse.y = ((event.clientY - rect.top) / rect.height) * canvas.height;
      });

      canvas.addEventListener("mousedown", () => {
        mouse.down = true;
      });

      window.addEventListener("mouseup", () => {
        mouse.down = false;
      });

      resetGame();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
