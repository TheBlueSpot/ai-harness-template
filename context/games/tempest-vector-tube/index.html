<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tempest Vector Tube</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #040611;
        --panel: rgba(8, 12, 30, 0.84);
        --cyan: #9fe9ff;
        --magenta: #ff62e7;
        --amber: #ffd36e;
        --lime: #8cff8d;
        --danger: #ff6d7f;
        --white: #f3fbff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 18%, rgba(159, 233, 255, 0.12), transparent 26%),
          radial-gradient(circle at 84% 14%, rgba(255, 98, 231, 0.12), transparent 22%),
          linear-gradient(180deg, #111b42 0%, #040611 76%);
        color: var(--white);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(100vw, 1120px);
        padding: 16px;
      }

      canvas {
        width: 100%;
        display: block;
        border-radius: 22px;
        border: 1px solid rgba(159, 233, 255, 0.2);
        background: #050814;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="game" width="960" height="600" aria-label="Tempest Vector Tube" role="img"></canvas>
    </main>
    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");

      const TAU = Math.PI * 2;
      const laneCount = 14;
      const center = { x: canvas.width * 0.5, y: 314 };
      const tube = { inner: 34, outer: 248, squash: 0.74 };
      const keys = new Set();

      const state = {
        mode: "title",
        score: 0,
        wave: 1,
        lives: 3,
        zaps: 3,
        message: "Ride the rim, break climbers early, and hold superzaps for stacked flippers.",
        flash: 0,
        shake: 0,
        wavePulse: 0,
        spawnClock: 0,
        spawned: 0,
        cleared: 0,
        waveSize: 0,
        enemies: [],
        shots: [],
        sparks: [],
        laneBursts: [],
        spikes: Array.from({ length: laneCount }, () => 0),
        player: null,
      };

      function resetGame() {
        state.mode = "title";
        state.score = 0;
        state.wave = 1;
        state.lives = 3;
        state.zaps = 3;
        state.message = "Ride the rim, break climbers early, and hold superzaps for stacked flippers.";
        state.flash = 0;
        state.shake = 0;
        state.wavePulse = 0;
        state.spawnClock = 0;
        state.spawned = 0;
        state.cleared = 0;
        state.waveSize = 0;
        state.enemies = [];
        state.shots = [];
        state.sparks = [];
        state.laneBursts = [];
        state.spikes = Array.from({ length: laneCount }, () => 0);
        state.player = createPlayer();
      }

      function createPlayer() {
        return {
          lane: 0,
          targetLane: 0,
          travel: 0,
          moveDir: 0,
          cooldown: 0,
          shootHeld: false,
          pulse: 0,
          hurtLock: 0,
        };
      }

      function startRun() {
        resetGame();
        state.mode = "running";
        openWave(1);
      }

      function openWave(wave) {
        state.wave = wave;
        state.wavePulse = 1;
        state.spawned = 0;
        state.cleared = 0;
        state.waveSize = 8 + wave * 3 + (wave >= 4 ? 2 : 0);
        state.spawnClock = 0.5;
        state.message =
          wave === 1
            ? "Red climbers rush straight up the tube. Flippers start hopping lanes from wave two."
            : wave >= 4
              ? "Wave spike: stacked spikers and flippers. Save zap for rim crowding."
              : "Hold the rim, watch orange spike lanes, and clear climbers before they crest.";
      }

      function laneAngle(lane) {
        return -Math.PI * 0.5 + (lane / laneCount) * TAU;
      }

      function lanePoint(lane, depth) {
        const angle = laneAngle(lane);
        const radius = tube.inner + (tube.outer - tube.inner) * depth;
        return {
          x: center.x + Math.cos(angle) * radius,
          y: center.y + Math.sin(angle) * radius * tube.squash,
        };
      }

      function wrapLane(lane) {
        return ((lane % laneCount) + laneCount) % laneCount;
      }

      function shortestLaneStep(from, to) {
        let delta = wrapLane(to) - wrapLane(from);
        if (delta > laneCount * 0.5) delta -= laneCount;
        if (delta < -laneCount * 0.5) delta += laneCount;
        return delta;
      }

      function spawnEnemy() {
        const wave = state.wave;
        let type = "crawler";
        const roll = Math.random();
        if (wave >= 2 && roll > 0.52) type = "flipper";
        if (wave >= 3 && roll > 0.8) type = "spiker";
        const lane = Math.floor(Math.random() * laneCount);
        const outward = 0.12 + Math.random() * 0.08;
        state.enemies.push({
          type,
          lane,
          depth: 0.08,
          speed:
            type === "crawler"
              ? outward + wave * 0.006
              : type === "flipper"
                ? outward + 0.03 + wave * 0.007
                : outward + 0.016 + wave * 0.008,
          hp: type === "spiker" ? 2 : 1,
          flipClock: 0.42 + Math.random() * 0.26,
          pulse: Math.random() * TAU,
          dead: false,
        });
        state.laneBursts.push({ lane, ttl: 0.58, color: type === "spiker" ? "#ffd36e" : "#ff6d7f" });
      }

      function fireShot() {
        if (state.player.cooldown > 0 || state.mode !== "running") return;
        state.player.cooldown = 0.15;
        state.shots.push({
          lane: state.player.lane,
          depth: 0.94,
          speed: 1.6,
        });
        createSpark(lanePoint(state.player.lane, 0.96), "#9fe9ff", 6, 24, 94);
      }

      function useZap() {
        if (state.mode !== "running" || state.zaps <= 0) return;
        state.zaps -= 1;
        state.flash = 0.85;
        state.shake = 1;
        let removed = 0;
        for (const enemy of state.enemies) {
          enemy.dead = true;
          removed += 1;
          if (enemy.type === "spiker") {
            state.spikes[enemy.lane] = Math.max(0, state.spikes[enemy.lane] - 0.24);
          }
          createSpark(lanePoint(enemy.lane, enemy.depth), "#8cff8d", 10, 20, 150);
        }
        if (removed > 0) {
          state.score += removed * 120;
          state.cleared += removed;
          state.message = "Superzap fired. Tube clear for a breath.";
        } else {
          state.message = "No climbers on the tube. Hold the next zap.";
        }
      }

      function createSpark(point, color, count, minSpeed, maxSpeed) {
        for (let i = 0; i < count; i += 1) {
          const angle = Math.random() * TAU;
          const speed = minSpeed + Math.random() * (maxSpeed - minSpeed);
          state.sparks.push({
            x: point.x,
            y: point.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.25 + Math.random() * 0.35,
            color,
          });
        }
      }

      function update(dt) {
        state.flash = Math.max(0, state.flash - dt * 2.4);
        state.shake = Math.max(0, state.shake - dt * 3.6);
        state.wavePulse = Math.max(0, state.wavePulse - dt * 1.3);

        if (state.mode !== "running") {
          updateEffects(dt);
          return;
        }

        const player = state.player;
        player.cooldown = Math.max(0, player.cooldown - dt);
        player.pulse += dt * 7;
        player.hurtLock = Math.max(0, player.hurtLock - dt);

        const moveLeft = keys.has("ArrowLeft") || keys.has("KeyA");
        const moveRight = keys.has("ArrowRight") || keys.has("KeyD");
        const shoot = keys.has("ArrowUp") || keys.has("KeyW") || keys.has("Space");

        if (player.travel <= 0) {
          if (moveLeft && !moveRight) {
            player.targetLane = wrapLane(player.lane - 1);
            player.moveDir = -1;
            player.travel = 1;
          } else if (moveRight && !moveLeft) {
            player.targetLane = wrapLane(player.lane + 1);
            player.moveDir = 1;
            player.travel = 1;
          }
        } else {
          player.travel = Math.max(0, player.travel - dt * 5.8);
          if (player.travel === 0) {
            player.lane = player.targetLane;
          }
        }

        if (shoot && !player.shootHeld) {
          fireShot();
        }
        player.shootHeld = shoot;

        state.spawnClock -= dt;
        if (state.spawned < state.waveSize && state.spawnClock <= 0) {
          spawnEnemy();
          state.spawned += 1;
          const intervalBase = Math.max(0.16, 0.58 - state.wave * 0.05);
          state.spawnClock = intervalBase + Math.random() * 0.12;
          if (state.wave >= 5 && Math.random() > 0.58 && state.spawned < state.waveSize) {
            spawnEnemy();
            state.spawned += 1;
          }
        }

        for (const shot of state.shots) {
          shot.depth -= shot.speed * dt;
        }
        state.shots = state.shots.filter((shot) => shot.depth > 0.06);

        for (const enemy of state.enemies) {
          enemy.pulse += dt * 5;
          enemy.depth += enemy.speed * dt;
          if (enemy.type === "flipper") {
            enemy.flipClock -= dt;
            if (enemy.flipClock <= 0) {
              enemy.lane = wrapLane(enemy.lane + (Math.random() > 0.5 ? 1 : -1));
              enemy.flipClock = 0.3 + Math.random() * 0.24;
              state.laneBursts.push({ lane: enemy.lane, ttl: 0.28, color: "#ff62e7" });
            }
          }
          if (enemy.type === "spiker" && enemy.depth > 0.5) {
            state.spikes[enemy.lane] = Math.min(0.72, state.spikes[enemy.lane] + dt * 0.24);
          }
        }

        for (let i = 0; i < state.spikes.length; i += 1) {
          state.spikes[i] = Math.max(0, state.spikes[i] - dt * 0.018);
        }

        handleCollisions();

        for (const enemy of state.enemies) {
          if (enemy.dead) continue;
          if (enemy.depth >= 0.96) {
            enemy.dead = true;
            hitPlayer(enemy.lane);
          }
        }

        state.enemies = state.enemies.filter((enemy) => !enemy.dead);

        if (state.spawned >= state.waveSize && state.enemies.length === 0) {
          if (state.wave >= 6) {
            state.mode = "victory";
            state.message = `Tube broken. Score ${state.score}.`;
          } else {
            openWave(state.wave + 1);
          }
        }

        updateEffects(dt);
      }

      function handleCollisions() {
        const playerLane = currentPlayerLane();
        const playerSpike = state.spikes[playerLane];
        if (playerSpike > 0.28 && state.player.travel <= 0) {
          state.spikes[playerLane] = Math.max(0, state.spikes[playerLane] - 0.2);
          hitPlayer(playerLane);
        }

        for (const shot of state.shots) {
          for (const enemy of state.enemies) {
            if (enemy.dead) continue;
            if (shortestLaneStep(shot.lane, enemy.lane) === 0 && Math.abs(shot.depth - enemy.depth) < 0.08) {
              shot.depth = -1;
              enemy.hp -= 1;
              createSpark(lanePoint(enemy.lane, enemy.depth), "#9fe9ff", 5, 20, 110);
              if (enemy.hp <= 0) {
                enemy.dead = true;
                state.score += enemy.type === "spiker" ? 180 : enemy.type === "flipper" ? 140 : 110;
                state.cleared += 1;
                if (enemy.type === "spiker") {
                  state.spikes[enemy.lane] = Math.max(0, state.spikes[enemy.lane] - 0.18);
                }
                createSpark(
                  lanePoint(enemy.lane, enemy.depth),
                  enemy.type === "spiker" ? "#ffd36e" : enemy.type === "flipper" ? "#ff62e7" : "#ff6d7f",
                  14,
                  24,
                  165,
                );
              }
              break;
            }
          }
        }
        state.shots = state.shots.filter((shot) => shot.depth > 0);
      }

      function currentPlayerLane() {
        if (state.player.travel <= 0) return state.player.lane;
        return state.player.travel > 0.5 ? state.player.lane : state.player.targetLane;
      }

      function hitPlayer(lane) {
        if (state.mode !== "running") return;
        if (state.player.hurtLock > 0) return;
        state.lives -= 1;
        state.player.hurtLock = 0.7;
        state.flash = 0.95;
        state.shake = 1;
        state.message = `Lane ${lane + 1} broke hot. Slide sooner or clear it earlier.`;
        createSpark(lanePoint(lane, 0.95), "#ff6d7f", 20, 30, 180);
        if (state.lives <= 0) {
          state.mode = "gameover";
          state.message = "Signal lost. Retry fast and hold the rim.";
        }
      }

      function updateEffects(dt) {
        for (const spark of state.sparks) {
          spark.x += spark.vx * dt;
          spark.y += spark.vy * dt;
          spark.life -= dt;
        }
        state.sparks = state.sparks.filter((spark) => spark.life > 0);

        for (const burst of state.laneBursts) {
          burst.ttl -= dt;
        }
        state.laneBursts = state.laneBursts.filter((burst) => burst.ttl > 0);
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const shakeX = state.shake > 0 ? (Math.random() - 0.5) * 10 * state.shake : 0;
        const shakeY = state.shake > 0 ? (Math.random() - 0.5) * 10 * state.shake : 0;
        ctx.save();
        ctx.translate(shakeX, shakeY);
        drawBackground();
        drawTube();
        drawLaneBursts();
        drawSpikes();
        drawShots();
        drawEnemies();
        drawPlayer();
        drawSparks();
        drawHud();
        drawOverlay();
        ctx.restore();
      }

      function drawBackground() {
        ctx.fillStyle = "#050814";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const glow = ctx.createRadialGradient(center.x, center.y, 10, center.x, center.y, 340);
        glow.addColorStop(0, "rgba(159, 233, 255, 0.08)");
        glow.addColorStop(0.45, "rgba(159, 233, 255, 0.03)");
        glow.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = `rgba(255, 98, 231, ${0.18 + state.wavePulse * 0.28})`;
        ctx.lineWidth = 3;
        ctx.strokeRect(64, 58, canvas.width - 128, canvas.height - 116);
      }

      function drawTube() {
        const ringDepths = [0.14, 0.28, 0.42, 0.56, 0.7, 0.84, 1];
        ctx.lineWidth = 1.5;
        for (const depth of ringDepths) {
          ctx.strokeStyle = `rgba(159, 233, 255, ${0.12 + depth * 0.22})`;
          ctx.beginPath();
          for (let lane = 0; lane <= laneCount; lane += 1) {
            const point = lanePoint(lane % laneCount, depth);
            if (lane === 0) ctx.moveTo(point.x, point.y);
            else ctx.lineTo(point.x, point.y);
          }
          ctx.stroke();
        }

        for (let lane = 0; lane < laneCount; lane += 1) {
          const inner = lanePoint(lane, 0.06);
          const outer = lanePoint(lane, 1);
          ctx.strokeStyle = "rgba(159, 233, 255, 0.18)";
          ctx.beginPath();
          ctx.moveTo(inner.x, inner.y);
          ctx.lineTo(outer.x, outer.y);
          ctx.stroke();
        }
      }

      function drawLaneBursts() {
        for (const burst of state.laneBursts) {
          const alpha = Math.max(0, burst.ttl * 1.5);
          const outer = lanePoint(burst.lane, 1.02);
          const inner = lanePoint(burst.lane, 0.84);
          ctx.strokeStyle = hexToRgba(burst.color, alpha);
          ctx.lineWidth = 7;
          ctx.beginPath();
          ctx.moveTo(inner.x, inner.y);
          ctx.lineTo(outer.x, outer.y);
          ctx.stroke();
        }
      }

      function drawSpikes() {
        for (let lane = 0; lane < laneCount; lane += 1) {
          const spike = state.spikes[lane];
          if (spike <= 0.02) continue;
          const start = lanePoint(lane, 1 - spike);
          const end = lanePoint(lane, 1);
          ctx.strokeStyle = `rgba(255, 211, 110, ${0.28 + spike * 0.9})`;
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.moveTo(start.x, start.y);
          ctx.lineTo(end.x, end.y);
          ctx.stroke();
        }
      }

      function drawShots() {
        for (const shot of state.shots) {
          const point = lanePoint(shot.lane, shot.depth);
          ctx.fillStyle = "#9fe9ff";
          ctx.beginPath();
          ctx.arc(point.x, point.y, 4.5, 0, TAU);
          ctx.fill();
        }
      }

      function drawEnemies() {
        for (const enemy of state.enemies) {
          const point = lanePoint(enemy.lane, enemy.depth);
          if (enemy.type === "crawler") {
            ctx.strokeStyle = "#ff6d7f";
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(point.x, point.y - 10);
            ctx.lineTo(point.x + 10, point.y);
            ctx.lineTo(point.x, point.y + 10);
            ctx.lineTo(point.x - 10, point.y);
            ctx.closePath();
            ctx.stroke();
          } else if (enemy.type === "flipper") {
            ctx.strokeStyle = "#ff62e7";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(point.x, point.y, 10, 0, TAU);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(point.x - 12, point.y - 8);
            ctx.lineTo(point.x + 12, point.y + 8);
            ctx.moveTo(point.x - 12, point.y + 8);
            ctx.lineTo(point.x + 12, point.y - 8);
            ctx.stroke();
          } else {
            const pulse = 0.2 + (Math.sin(enemy.pulse) * 0.5 + 0.5) * 0.45;
            ctx.strokeStyle = "#ffd36e";
            ctx.lineWidth = 2.8;
            ctx.beginPath();
            ctx.rect(point.x - 10, point.y - 10, 20, 20);
            ctx.stroke();
            ctx.strokeStyle = `rgba(255, 211, 110, ${pulse})`;
            const rim = lanePoint(enemy.lane, 1);
            ctx.beginPath();
            ctx.moveTo(point.x, point.y);
            ctx.lineTo(rim.x, rim.y);
            ctx.stroke();
          }
        }
      }

      function drawPlayer() {
        const player = state.player;
        const lane =
          player.travel <= 0
            ? player.lane
            : player.lane + shortestLaneStep(player.lane, player.targetLane) * (1 - player.travel);
        const floorLane = wrapLane(Math.round(lane * 1000) / 1000);
        const point = lanePoint(floorLane, 1.02);
        const angle = laneAngle(lane);
        const tangent = angle + Math.PI * 0.5;
        const nose = {
          x: point.x + Math.cos(angle) * 16,
          y: point.y + Math.sin(angle) * 16 * tube.squash,
        };
        const left = {
          x: point.x + Math.cos(tangent) * 11,
          y: point.y + Math.sin(tangent) * 11,
        };
        const right = {
          x: point.x - Math.cos(tangent) * 11,
          y: point.y - Math.sin(tangent) * 11,
        };

        ctx.strokeStyle = "#f3fbff";
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(nose.x, nose.y);
        ctx.lineTo(left.x, left.y);
        ctx.lineTo(right.x, right.y);
        ctx.closePath();
        ctx.stroke();

        ctx.strokeStyle = `rgba(159, 233, 255, ${0.25 + (Math.sin(player.pulse) * 0.5 + 0.5) * 0.25})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(point.x, point.y, 16, 0, TAU);
        ctx.stroke();
      }

      function drawSparks() {
        for (const spark of state.sparks) {
          ctx.globalAlpha = Math.max(0, spark.life * 1.8);
          ctx.fillStyle = spark.color;
          ctx.fillRect(spark.x, spark.y, 2.5, 2.5);
        }
        ctx.globalAlpha = 1;
      }

      function drawHud() {
        ctx.fillStyle = "rgba(8, 12, 30, 0.86)";
        ctx.fillRect(24, 18, 258, 84);
        ctx.fillRect(canvas.width - 284, 18, 260, 84);

        ctx.fillStyle = "#f3fbff";
        ctx.font = "700 24px Arial";
        ctx.fillText(`Score ${state.score}`, 38, 48);
        ctx.font = "600 16px Arial";
        ctx.fillStyle = "#9fe9ff";
        ctx.fillText(`Wave ${Math.min(state.wave, 6)} / 6`, 38, 72);
        ctx.fillStyle = "#ff6d7f";
        ctx.fillText(`Lives ${Math.max(0, state.lives)}`, 138, 72);

        ctx.fillStyle = "#f3fbff";
        ctx.font = "700 22px Arial";
        ctx.fillText(`Zap ${state.zaps}`, canvas.width - 256, 48);
        ctx.font = "600 13px Arial";
        ctx.fillStyle = "#ffd36e";
        ctx.fillText("Orange lanes = rim spikes", canvas.width - 256, 67);
        ctx.fillText("Break spikers early", canvas.width - 256, 84);
        ctx.fillText("or zap crowds", canvas.width - 256, 99);

        ctx.fillStyle = "rgba(243, 251, 255, 0.9)";
        ctx.font = "600 14px Arial";
        ctx.fillText(state.message, 34, canvas.height - 24);
      }

      function drawOverlay() {
        if (state.flash > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${state.flash * 0.2})`;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        if (state.mode === "running") return;

        ctx.fillStyle = "rgba(4, 7, 19, 0.76)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = "center";
        ctx.fillStyle = "#f3fbff";
        ctx.font = "700 42px Arial";
        const title =
          state.mode === "title" ? "Tempest Vector Tube" : state.mode === "victory" ? "Tube Clear" : "Tube Collapse";
        ctx.fillText(title, canvas.width * 0.5, 178);

        ctx.font = "600 20px Arial";
        ctx.fillStyle = "#9fe9ff";
        const detail =
          state.mode === "title"
            ? "Lane-surf the rim, fire into the tube, and save superzap for stacked climbers."
            : `Score ${state.score}  |  Wave ${Math.min(state.wave, 6)} / 6`;
        ctx.fillText(detail, canvas.width * 0.5, 216);

        ctx.font = "600 18px Arial";
        ctx.fillStyle = "#ffd36e";
        ctx.fillText("Move: A/D or left/right  |  Fire: W, up, or Space  |  Superzap: X or Shift", canvas.width * 0.5, 272);
        ctx.fillText("Red climbers rush straight up. Magenta flippers swap lanes. Orange spikers harden the rim.", canvas.width * 0.5, 304);
        ctx.fillStyle = "#8cff8d";
        ctx.fillText("Press Enter to start. Press R for instant retry.", canvas.width * 0.5, 344);
        ctx.textAlign = "left";
      }

      function hexToRgba(hex, alpha) {
        const value = hex.replace("#", "");
        const r = Number.parseInt(value.slice(0, 2), 16);
        const g = Number.parseInt(value.slice(2, 4), 16);
        const b = Number.parseInt(value.slice(4, 6), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.033, (now - last) / 1000);
        last = now;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      window.addEventListener("keydown", (event) => {
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space", "ShiftLeft", "ShiftRight"].includes(event.code)) {
          event.preventDefault();
        }
        keys.add(event.code);
        if (event.code === "Enter" && state.mode !== "running") {
          startRun();
        }
        if (event.code === "KeyR") {
          startRun();
        }
        if (event.code === "KeyX" || event.code === "ShiftLeft" || event.code === "ShiftRight") {
          useZap();
        }
      });

      window.addEventListener("keyup", (event) => {
        keys.delete(event.code);
      });

      resetGame();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
