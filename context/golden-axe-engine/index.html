<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golden Axe Engine</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hud">
        <div class="hud__group">
          <span class="hud__label">Hero</span>
          <span id="healthText">100 / 100</span>
        </div>
        <div class="hud__group">
          <span class="hud__label">Magic</span>
          <span id="magicText">0 / 100</span>
        </div>
        <div class="hud__group">
          <span class="hud__label">Stage</span>
          <span id="stageText">1 / 3</span>
        </div>
        <div class="hud__group">
          <span class="hud__label">Mount</span>
          <span id="mountText">On Foot</span>
        </div>
      </header>
      <main class="arena-shell">
        <canvas id="game" width="1280" height="720" aria-label="Golden Axe Engine belt-scroller"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay__card">
            <p class="overlay__eyebrow" id="overlayEyebrow">belt-scroller combat</p>
            <h1 id="overlayTitle">Golden Axe Engine</h1>
            <p id="overlayCopy">
              Hold the line, strafe lanes, seize dropped mounts, and unleash full-mana magic.
            </p>
            <button id="overlayButton" type="button">Start Run</button>
            <p class="overlay__hint">Move `WASD` or arrows, attack `J`, magic `K`, mount `E`.</p>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
