<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gradius Option-Drive</title>
    <meta
      name="description"
      content="Stand-alone Gradius-inspired shmup shell with trailing options, a power-up bar, and boss-state HUD."
    />
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="cabinet" aria-label="Gradius Option-Drive">
        <canvas id="gameCanvas" class="game-canvas" aria-label="Game view"></canvas>

        <aside id="hud" class="hud" aria-live="polite">
          <div class="hud__panel">
            <span class="hud__label">Score</span>
            <span id="hudScore" class="hud__value">0</span>
          </div>
          <div class="hud__panel">
            <span class="hud__label">Lives</span>
            <span id="hudLives" class="hud__value">0</span>
          </div>
          <div class="hud__panel">
            <span class="hud__label">Shield</span>
            <span id="hudShield" class="hud__value">0%</span>
          </div>
          <div class="hud__panel hud__panel--wide">
            <span class="hud__label">Boss</span>
            <span id="hudBoss" class="hud__value">Idle</span>
          </div>
          <div class="hud__panel hud__panel--wide">
            <span class="hud__label">Weapon</span>
            <span id="hudWeapon" class="hud__value">Normal</span>
          </div>
          <div class="powerbar" aria-label="Power-up bar">
            <span class="powerbar__label">Power-up</span>
            <div id="powerBar" class="powerbar__track" role="meter" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0">
              <span class="powerbar__cursor"></span>
            </div>
            <div id="powerBarHint" class="powerbar__hint">Ready</div>
          </div>
          <div id="hudAlert" class="hud__alert" hidden></div>
        </aside>

        <section id="overlay" class="overlay" hidden>
          <p id="overlayEyebrow" class="overlay__eyebrow">Mission</p>
          <h1 id="overlayTitle" class="overlay__title">Gradius Option-Drive</h1>
          <p id="overlayCopy" class="overlay__copy"></p>
          <button id="overlayButton" class="overlay__button" type="button">Start</button>
        </section>
      </section>
    </main>
  </body>
</html>
