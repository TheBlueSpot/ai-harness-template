<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris 1985 (IBM PC)</title>
    <style>
        body { margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #333; font-family: 'Press Start 2P', cursive; color: #eee; }
        #game-container { display: flex; gap: 20px; }
        canvas { background-color: #000; border: 2px solid #ccc; display: block; }
        #sidebar { width: 150px; display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 10px; padding-top: 20px; }
        #sidebar > div { width: 100%; }
        #sidebar h2 { margin-top: 0; font-size: 1.2em; }
        #sidebar p { margin: 5px 0; font-size: 0.9em; }
        #next-piece-display { border: 1px solid #777; width: 100px; height: 100px; display: flex; justify-content: center; align-items: center; background-color: #222; margin-top: 10px; }
    </style>
    <!-- Optional: Use a retro-style font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <canvas id="tetrisCanvas" width="200" height="400"></canvas>
        <div id="sidebar">
            <h2>TETRIS</h2>
            <div id="score-display">Score: 0</div>
            <div id="level-display">Level: 1</div>
            <div id="lines-display">Lines: 0</div>
            <div>
                <h2>Next</h2>
                <div id="next-piece-display"></div>
            </div>
            <button id="startButton">Start Game</button>
        </div>
    </div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
