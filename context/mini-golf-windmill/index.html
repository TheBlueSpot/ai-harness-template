<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Golf Windmill</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hud">
        <div class="brand">
          <h1>Mini Golf Windmill</h1>
          <p>Drag from the ball, bank around hazards, clear the card.</p>
        </div>
        <div class="stats">
          <span id="holeLabel">Hole 1 / 6</span>
          <span id="parLabel">Par 3</span>
          <span id="strokesLabel">Strokes 0</span>
          <span id="scoreLabel">Card E</span>
        </div>
      </section>
      <section class="playfield">
        <canvas id="game" width="960" height="540" aria-label="Mini golf course"></canvas>
        <div id="overlay" class="overlay">
          <div class="card">
            <h2 id="overlayTitle">Mini Golf Windmill</h2>
            <p id="overlayBody">Drag from the ball to aim. Release to shoot. Clear all six holes under the moving windmills.</p>
            <button id="overlayButton" type="button">Start Round</button>
          </div>
        </div>
      </section>
      <section class="controls">
        <span>Mouse: aim and shoot</span>
        <span>R: restart round</span>
        <span>N: next hole after sink</span>
      </section>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
