<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nidhogg Bridge Feint</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-0: #120f12;
      --bg-1: #231824;
      --bg-2: #3a2334;
      --gold: #f3cb73;
      --ember: #ff8c69;
      --sky: #9de0ff;
      --ink: #f8f2e8;
      --muted: rgba(248, 242, 232, 0.74);
      --panel: rgba(20, 12, 18, 0.88);
      --line: rgba(255, 243, 217, 0.12);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(243, 203, 115, 0.1), transparent 34%),
        radial-gradient(circle at 20% 15%, rgba(157, 224, 255, 0.1), transparent 22%),
        linear-gradient(180deg, var(--bg-2), var(--bg-1) 44%, var(--bg-0));
      color: var(--ink);
    }

    body {
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .shell {
      width: min(100%, 1280px);
      display: grid;
      gap: 14px;
    }

    .frame {
      padding: 16px;
      border-radius: 28px;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent),
        linear-gradient(180deg, rgba(59, 35, 52, 0.38), rgba(11, 8, 12, 0.94));
      box-shadow:
        0 28px 70px rgba(0, 0, 0, 0.46),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, #312033, #130f17 70%);
    }

    .hud-strip {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: space-between;
      padding: 0 4px;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hud-strip span {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(20, 15, 19, 0.72);
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="frame">
      <canvas id="game" width="1280" height="720" aria-label="Nidhogg Bridge Feint"></canvas>
    </section>
    <div class="hud-strip">
      <span>Move: A D or arrows</span>
      <span>Lane swap: W S or up down</span>
      <span>Thrust: J</span>
      <span>Parry: K</span>
      <span>Throw: L</span>
      <span>Press Enter or Space to start, R to rematch</span>
      <span>First to 5 touches the banner</span>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const LANES = [190, 360, 530];
    const ARENA_LEFT = 140;
    const ARENA_RIGHT = 1140;
    const FLOOR_HALF = 220;
    const MAX_DT = 1 / 30;
    const MOVE_SPEED = 260;
    const THRUST_RANGE = 86;
    const SHOVE_RANGE = 48;
    const THROW_SPEED = 840;
    const TARGET_SCORE = 5;
    const keys = new Set();
    const pressed = new Set();

    const palette = {
      skyTop: "#52345c",
      skyBottom: "#171119",
      moon: "#ffe7b1",
      bridgeTop: "#8a6145",
      bridgeSide: "#573723",
      bridgeShadow: "#352115",
      chain: "rgba(222, 208, 196, 0.32)",
      laneGlow: "rgba(243, 203, 115, 0.08)",
      player: "#7fe0ff",
      playerDark: "#307690",
      enemy: "#ff9a7d",
      enemyDark: "#8f4938",
      spear: "#f8f2e8",
      shaft: "#9f7e56",
      parry: "#f3cb73",
      danger: "#ff7f75",
      success: "#8df0b0",
      ink: "#f8f2e8",
      muted: "rgba(248, 242, 232, 0.66)"
    };

    const state = {
      scene: "title",
      time: 0,
      roundDelay: 0,
      winner: "",
      tips: [
        "Feint a throw by swapping lanes, then stab the landing.",
        "Parry works only when you face the attack line.",
        "Weaponless shoves buy time to recover a dropped spear."
      ],
      tipIndex: 0,
      tipTimer: 0,
      particles: [],
      projectiles: [],
      groundedSpears: []
    };

    function makeFighter(name, color, dark, x, lane, facing, isPlayer) {
      return {
        name,
        color,
        dark,
        x,
        lane,
        fromLane: lane,
        laneLerp: 0,
        facing,
        isPlayer,
        hasSpear: true,
        state: "idle",
        attackTimer: 0,
        recoverTimer: 0,
        parryTimer: 0,
        parryCooldown: 0,
        throwCooldown: 0,
        laneCooldown: 0,
        stunTimer: 0,
        flashTimer: 0,
        hitDone: false,
        score: 0,
        vx: 0,
        aiTimer: 0,
        intent: 0
      };
    }

    let player = makeFighter("Player", palette.player, palette.playerDark, 280, 1, 1, true);
    let enemy = makeFighter("Rival", palette.enemy, palette.enemyDark, 1000, 1, -1, false);

    function laneY(fighter) {
      if (fighter.laneLerp <= 0) {
        return LANES[fighter.lane];
      }
      const t = 1 - fighter.laneLerp;
      return LANES[fighter.fromLane] + (LANES[fighter.lane] - LANES[fighter.fromLane]) * t;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function sign(value) {
      return value < 0 ? -1 : value > 0 ? 1 : 0;
    }

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function facingToward(source, targetX) {
      return sign(targetX - source.x) === source.facing;
    }

    function isBusy(fighter) {
      return fighter.attackTimer > 0 || fighter.recoverTimer > 0 || fighter.stunTimer > 0 || fighter.laneLerp > 0;
    }

    function resetRound(fullReset) {
      state.projectiles = [];
      state.groundedSpears = [];
      state.particles = [];
      state.roundDelay = 0;
      state.winner = "";
      state.scene = "play";
      state.tipTimer = 0;

      player = makeFighter("Player", palette.player, palette.playerDark, 280, 1, 1, true);
      enemy = makeFighter("Rival", palette.enemy, palette.enemyDark, 1000, 1, -1, false);

      if (!fullReset) {
        player.score = player.score || 0;
        enemy.score = enemy.score || 0;
      }
    }

    function startMatch() {
      const playerScore = state.scene === "play" ? player.score : 0;
      const enemyScore = state.scene === "play" ? enemy.score : 0;
      resetRound(true);
      player.score = 0;
      enemy.score = 0;
      if (state.scene === "play") {
        player.score = playerScore;
        enemy.score = enemyScore;
      }
    }

    function spawnParticles(x, y, color, count, speed) {
      for (let i = 0; i < count; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const magnitude = speed * rand(0.35, 1);
        state.particles.push({
          x,
          y,
          vx: Math.cos(angle) * magnitude,
          vy: Math.sin(angle) * magnitude,
          life: rand(0.18, 0.5),
          size: rand(2, 6),
          color
        });
      }
    }

    function dropSpear(x, lane, vx) {
      state.groundedSpears.push({
        x: clamp(x, ARENA_LEFT + 20, ARENA_RIGHT - 20),
        lane,
        vx: vx || 0
      });
    }

    function awardPoint(winner, reason) {
      if (state.roundDelay > 0) {
        return;
      }
      winner.score += 1;
      state.roundDelay = 1.2;
      state.winner = `${winner.name} scores with ${reason}`;
      spawnParticles(
        winner === player ? enemy.x : player.x,
        winner === player ? laneY(enemy) - 42 : laneY(player) - 42,
        winner === player ? palette.player : palette.enemy,
        26,
        180
      );
      if (winner.score >= TARGET_SCORE) {
        state.scene = "match-over";
      }
    }

    function getOpponent(fighter) {
      return fighter === player ? enemy : player;
    }

    function startParry(fighter) {
      if (fighter.parryCooldown > 0 || fighter.stunTimer > 0 || fighter.attackTimer > 0 || fighter.recoverTimer > 0) {
        return;
      }
      fighter.parryTimer = 0.24;
      fighter.parryCooldown = 0.42;
      fighter.recoverTimer = Math.max(fighter.recoverTimer, 0.08);
      spawnParticles(fighter.x + fighter.facing * 18, laneY(fighter) - 46, palette.parry, 8, 120);
    }

    function changeLane(fighter, direction) {
      if (fighter.laneCooldown > 0 || fighter.stunTimer > 0 || fighter.attackTimer > 0 || fighter.laneLerp > 0) {
        return;
      }
      const nextLane = clamp(fighter.lane + direction, 0, LANES.length - 1);
      if (nextLane === fighter.lane) {
        return;
      }
      fighter.fromLane = fighter.lane;
      fighter.lane = nextLane;
      fighter.laneLerp = 0.16;
      fighter.laneCooldown = 0.24;
      fighter.recoverTimer = Math.max(fighter.recoverTimer, 0.08);
      spawnParticles(fighter.x, laneY(fighter), palette.moon, 6, 70);
    }

    function startAttack(fighter) {
      if (isBusy(fighter)) {
        return;
      }
      fighter.state = fighter.hasSpear ? "thrust" : "shove";
      fighter.attackTimer = fighter.hasSpear ? 0.26 : 0.2;
      fighter.recoverTimer = fighter.hasSpear ? 0.28 : 0.22;
      fighter.hitDone = false;
    }

    function startThrow(fighter) {
      if (!fighter.hasSpear || fighter.throwCooldown > 0 || isBusy(fighter)) {
        return;
      }
      fighter.hasSpear = false;
      fighter.throwCooldown = 0.7;
      fighter.recoverTimer = 0.22;
      const projectile = {
        x: fighter.x + fighter.facing * 36,
        lane: fighter.lane,
        vx: fighter.facing * THROW_SPEED,
        owner: fighter,
        glow: 0.18
      };
      state.projectiles.push(projectile);
      spawnParticles(projectile.x, laneY(fighter) - 44, palette.spear, 8, 110);
    }

    function handleStrike(attacker) {
      if (attacker.hitDone) {
        return;
      }
      const defender = getOpponent(attacker);
      if (defender.lane !== attacker.lane) {
        return;
      }
      const delta = defender.x - attacker.x;
      const forward = sign(delta);
      const distance = Math.abs(delta);
      const range = attacker.hasSpear ? THRUST_RANGE : SHOVE_RANGE;
      if (forward !== attacker.facing || distance > range) {
        return;
      }
      attacker.hitDone = true;
      if (defender.parryTimer > 0 && facingToward(defender, attacker.x)) {
        attacker.stunTimer = 0.46;
        attacker.recoverTimer = 0.18;
        attacker.vx = -attacker.facing * 260;
        spawnParticles(defender.x + defender.facing * 18, laneY(defender) - 44, palette.parry, 16, 200);
        return;
      }
      if (attacker.hasSpear) {
        defender.flashTimer = 0.22;
        awardPoint(attacker, "a clean thrust");
      } else {
        defender.stunTimer = 0.18;
        defender.vx = attacker.facing * 460;
        defender.flashTimer = 0.15;
        spawnParticles(defender.x, laneY(defender) - 32, palette.danger, 9, 130);
      }
    }

    function updateTimers(fighter, dt) {
      fighter.attackTimer = Math.max(0, fighter.attackTimer - dt);
      fighter.recoverTimer = Math.max(0, fighter.recoverTimer - dt);
      fighter.parryTimer = Math.max(0, fighter.parryTimer - dt);
      fighter.parryCooldown = Math.max(0, fighter.parryCooldown - dt);
      fighter.throwCooldown = Math.max(0, fighter.throwCooldown - dt);
      fighter.laneCooldown = Math.max(0, fighter.laneCooldown - dt);
      fighter.stunTimer = Math.max(0, fighter.stunTimer - dt);
      fighter.flashTimer = Math.max(0, fighter.flashTimer - dt);
      fighter.aiTimer = Math.max(0, fighter.aiTimer - dt);
      if (fighter.laneLerp > 0) {
        fighter.laneLerp = Math.max(0, fighter.laneLerp - dt);
      }
    }

    function pickUpSpears(fighter) {
      if (fighter.hasSpear) {
        return;
      }
      for (let i = state.groundedSpears.length - 1; i >= 0; i -= 1) {
        const spear = state.groundedSpears[i];
        if (spear.lane === fighter.lane && Math.abs(spear.x - fighter.x) < 26) {
          fighter.hasSpear = true;
          fighter.throwCooldown = Math.max(fighter.throwCooldown, 0.2);
          state.groundedSpears.splice(i, 1);
          spawnParticles(fighter.x, laneY(fighter) - 40, palette.success, 10, 140);
          return;
        }
      }
    }

    function updateFighter(fighter, dt) {
      updateTimers(fighter, dt);
      fighter.vx *= Math.pow(0.0001, dt);
      if (fighter.state !== "idle" && fighter.attackTimer <= 0) {
        fighter.state = "idle";
      }

      if (fighter.stunTimer > 0) {
        fighter.x += fighter.vx * dt;
      } else {
        fighter.x += (fighter.intent * MOVE_SPEED + fighter.vx) * dt;
      }

      const edgeLeft = ARENA_LEFT - FLOOR_HALF;
      const edgeRight = ARENA_RIGHT + FLOOR_HALF;
      if (fighter.x < edgeLeft || fighter.x > edgeRight) {
        awardPoint(getOpponent(fighter), "an edge shove");
      }

      fighter.x = clamp(fighter.x, edgeLeft - 10, edgeRight + 10);

      if (fighter.state === "thrust" && fighter.attackTimer <= 0.16) {
        handleStrike(fighter);
      }
      if (fighter.state === "shove" && fighter.attackTimer <= 0.1) {
        handleStrike(fighter);
      }

      pickUpSpears(fighter);
    }

    function updatePlayerIntent() {
      player.intent = 0;
      if (state.scene !== "play" || state.roundDelay > 0) {
        return;
      }
      if (keys.has("KeyA") || keys.has("ArrowLeft")) {
        player.intent -= 1;
        player.facing = -1;
      }
      if (keys.has("KeyD") || keys.has("ArrowRight")) {
        player.intent += 1;
        player.facing = 1;
      }
      if (pressed.has("KeyW") || pressed.has("ArrowUp")) {
        changeLane(player, -1);
      }
      if (pressed.has("KeyS") || pressed.has("ArrowDown")) {
        changeLane(player, 1);
      }
      if (pressed.has("KeyJ")) {
        startAttack(player);
      }
      if (pressed.has("KeyK")) {
        startParry(player);
      }
      if (pressed.has("KeyL")) {
        startThrow(player);
      }
    }

    function chooseEnemyAction() {
      if (state.scene !== "play" || state.roundDelay > 0) {
        enemy.intent = 0;
        return;
      }

      const incoming = state.projectiles.find(
        (projectile) => projectile.owner !== enemy && projectile.lane === enemy.lane && Math.abs(projectile.x - enemy.x) < 190
      );
      const distance = player.x - enemy.x;
      const absDistance = Math.abs(distance);
      enemy.facing = sign(distance) || enemy.facing;
      enemy.intent = 0;

      if (incoming && enemy.parryCooldown <= 0 && facingToward(enemy, incoming.x)) {
        startParry(enemy);
        return;
      }

      if (
        player.state === "thrust" &&
        player.attackTimer > 0.16 &&
        player.lane === enemy.lane &&
        absDistance < 120 &&
        enemy.parryCooldown <= 0 &&
        facingToward(enemy, player.x)
      ) {
        startParry(enemy);
        return;
      }

      const nearestGround = state.groundedSpears
        .map((spear) => ({ spear, score: Math.abs(spear.x - enemy.x) + Math.abs(spear.lane - enemy.lane) * 220 }))
        .sort((a, b) => a.score - b.score)[0];

      if (!enemy.hasSpear && nearestGround) {
        const target = nearestGround.spear;
        if (target.lane !== enemy.lane && enemy.laneCooldown <= 0) {
          changeLane(enemy, target.lane < enemy.lane ? -1 : 1);
          return;
        }
        enemy.intent = sign(target.x - enemy.x);
        if (Math.abs(target.x - enemy.x) < 30) {
          enemy.intent = 0;
        }
        return;
      }

      if (enemy.lane !== player.lane && enemy.laneCooldown <= 0) {
        const shouldTrackLane = absDistance < 420 || (!enemy.hasSpear && nearestGround && nearestGround.spear.lane === player.lane);
        if (shouldTrackLane) {
          changeLane(enemy, player.lane < enemy.lane ? -1 : 1);
          return;
        }
      }

      if (enemy.lane === player.lane) {
        if (player.parryTimer > 0 && absDistance < 120) {
          enemy.intent = -enemy.facing;
          return;
        }
        if (enemy.hasSpear && absDistance > 150 && absDistance < 360 && enemy.throwCooldown <= 0 && Math.random() < 0.34) {
          startThrow(enemy);
          return;
        }
        if (absDistance < (enemy.hasSpear ? 82 : 44) && !isBusy(enemy)) {
          startAttack(enemy);
          return;
        }
        const preferredGap = enemy.hasSpear ? 92 : 48;
        if (absDistance > preferredGap + 16) {
          enemy.intent = enemy.facing;
        } else if (absDistance < preferredGap - 18) {
          enemy.intent = -enemy.facing;
        }
        return;
      }

      const laneAnchor = player.x + (player.x < enemy.x ? 70 : -70);
      enemy.intent = sign(laneAnchor - enemy.x);
    }

    function updateEnemy(dt) {
      if (enemy.aiTimer <= 0) {
        chooseEnemyAction();
        enemy.aiTimer = rand(0.07, 0.17);
      }
    }

    function updateProjectiles(dt) {
      for (let i = state.projectiles.length - 1; i >= 0; i -= 1) {
        const projectile = state.projectiles[i];
        projectile.x += projectile.vx * dt;
        projectile.glow = Math.max(0, projectile.glow - dt);
        const target = projectile.owner === player ? enemy : player;
        if (target.lane === projectile.lane && Math.abs(projectile.x - target.x) < 26) {
          if (target.parryTimer > 0 && facingToward(target, projectile.x)) {
            spawnParticles(target.x + target.facing * 16, laneY(target) - 42, palette.parry, 14, 200);
            dropSpear(target.x + target.facing * 48, target.lane, 0);
          } else {
            target.flashTimer = 0.22;
            awardPoint(projectile.owner, "a spear throw");
          }
          state.projectiles.splice(i, 1);
          continue;
        }
        if (projectile.x < ARENA_LEFT - FLOOR_HALF || projectile.x > ARENA_RIGHT + FLOOR_HALF) {
          dropSpear(projectile.x, projectile.lane, 0);
          state.projectiles.splice(i, 1);
        }
      }
    }

    function updateGroundedSpears(dt) {
      for (const spear of state.groundedSpears) {
        spear.x += spear.vx * dt;
        spear.vx *= Math.pow(0.0001, dt);
      }
    }

    function updateParticles(dt) {
      for (let i = state.particles.length - 1; i >= 0; i -= 1) {
        const particle = state.particles[i];
        particle.life -= dt;
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.vy += 120 * dt;
        if (particle.life <= 0) {
          state.particles.splice(i, 1);
        }
      }
    }

    function update(dt) {
      state.time += dt;
      state.tipTimer += dt;
      if (state.tipTimer >= 5.2) {
        state.tipTimer = 0;
        state.tipIndex = (state.tipIndex + 1) % state.tips.length;
      }

      if (state.scene === "title") {
        if (pressed.has("Enter") || pressed.has("Space")) {
          resetRound(true);
        }
        return;
      }

      if (state.scene === "match-over") {
        updateParticles(dt);
        if (pressed.has("Enter") || pressed.has("Space") || pressed.has("KeyR")) {
          resetRound(true);
        }
        return;
      }

      if (pressed.has("KeyR")) {
        resetRound(true);
      }

      if (state.roundDelay > 0) {
        state.roundDelay = Math.max(0, state.roundDelay - dt);
        updateParticles(dt);
        if (state.roundDelay <= 0 && state.scene === "play") {
          const playerScore = player.score;
          const enemyScore = enemy.score;
          resetRound(true);
          player.score = playerScore;
          enemy.score = enemyScore;
        }
        return;
      }

      updatePlayerIntent();
      updateEnemy(dt);
      updateFighter(player, dt);
      updateFighter(enemy, dt);
      updateProjectiles(dt);
      updateGroundedSpears(dt);
      updateParticles(dt);
    }

    function drawBackdrop() {
      const sky = ctx.createLinearGradient(0, 0, 0, HEIGHT);
      sky.addColorStop(0, palette.skyTop);
      sky.addColorStop(1, palette.skyBottom);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.fillStyle = "rgba(255, 231, 177, 0.85)";
      ctx.beginPath();
      ctx.arc(1040, 118, 42, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < 10; i += 1) {
        const x = 80 + i * 132;
        const h = 100 + (i % 4) * 22;
        ctx.fillStyle = `rgba(8, 7, 10, ${0.18 + (i % 3) * 0.08})`;
        ctx.beginPath();
        ctx.moveTo(x, HEIGHT - 110);
        ctx.lineTo(x + 40, HEIGHT - 110 - h);
        ctx.lineTo(x + 90, HEIGHT - 110);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawBridgeLane(laneIndex) {
      const y = LANES[laneIndex];
      const wobble = Math.sin(state.time * 1.5 + laneIndex * 0.9) * 2;
      ctx.fillStyle = palette.laneGlow;
      ctx.fillRect(ARENA_LEFT - 18, y - 10, ARENA_RIGHT - ARENA_LEFT + 36, 20);

      ctx.fillStyle = palette.bridgeSide;
      ctx.fillRect(ARENA_LEFT, y + 12 + wobble, ARENA_RIGHT - ARENA_LEFT, 20);
      ctx.fillStyle = palette.bridgeTop;
      ctx.fillRect(ARENA_LEFT, y + wobble, ARENA_RIGHT - ARENA_LEFT, 16);

      ctx.strokeStyle = "rgba(63, 40, 25, 0.45)";
      ctx.lineWidth = 2;
      for (let x = ARENA_LEFT; x <= ARENA_RIGHT; x += 36) {
        ctx.beginPath();
        ctx.moveTo(x, y + wobble + 1);
        ctx.lineTo(x + 16, y + wobble + 16);
        ctx.stroke();
      }

      ctx.strokeStyle = palette.chain;
      ctx.lineWidth = 3;
      for (const postX of [300, 640, 980]) {
        ctx.beginPath();
        ctx.moveTo(postX, y - 74);
        ctx.lineTo(postX, y + 2);
        ctx.stroke();
      }
    }

    function drawBanner() {
      const edge = player.score > enemy.score ? palette.player : enemy.score > player.score ? palette.enemy : palette.parry;
      ctx.fillStyle = edge;
      ctx.fillRect(ARENA_RIGHT + 30, 120, 10, 190);
      ctx.beginPath();
      ctx.moveTo(ARENA_RIGHT + 40, 126);
      ctx.lineTo(ARENA_RIGHT + 110, 154);
      ctx.lineTo(ARENA_RIGHT + 40, 184);
      ctx.closePath();
      ctx.fill();
    }

    function drawFighter(fighter) {
      const y = laneY(fighter);
      const flash = fighter.flashTimer > 0 ? 1 : 0;
      ctx.save();
      ctx.translate(fighter.x, y - 2);
      ctx.scale(fighter.facing, 1);

      if (fighter.parryTimer > 0) {
        ctx.strokeStyle = palette.parry;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(18, -48, 28, -1.1, 1.1);
        ctx.stroke();
      }

      if (fighter.state === "thrust") {
        const windup = fighter.attackTimer > 0.16 ? -10 : 18;
        ctx.translate(windup, 0);
      }

      ctx.fillStyle = flash ? "#ffffff" : fighter.dark;
      ctx.fillRect(-10, -54, 20, 38);
      ctx.fillRect(-7, -10, 14, 24);
      ctx.fillStyle = flash ? "#ffffff" : fighter.color;
      ctx.beginPath();
      ctx.arc(0, -64, 14, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = flash ? "#ffffff" : fighter.dark;
      ctx.fillRect(-18, -10, 10, 36);
      ctx.fillRect(8, -10, 10, 36);

      ctx.strokeStyle = flash ? "#ffffff" : fighter.dark;
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(-2, -44);
      ctx.lineTo(-20, -16);
      ctx.moveTo(2, -44);
      ctx.lineTo(18, -26);
      ctx.stroke();

      if (fighter.hasSpear) {
        const reach = fighter.state === "thrust" && fighter.attackTimer <= 0.16 ? 92 : 66;
        ctx.strokeStyle = palette.spear;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(14, -38);
        ctx.lineTo(reach, -38);
        ctx.stroke();
        ctx.fillStyle = palette.shaft;
        ctx.fillRect(10, -40, 18, 4);
        ctx.beginPath();
        ctx.moveTo(reach, -38);
        ctx.lineTo(reach + 18, -44);
        ctx.lineTo(reach + 18, -32);
        ctx.closePath();
        ctx.fillStyle = palette.spear;
        ctx.fill();
      } else {
        ctx.fillStyle = palette.parry;
        ctx.fillRect(10, -41, 20, 8);
      }

      ctx.restore();
    }

    function drawProjectiles() {
      for (const projectile of state.projectiles) {
        const y = LANES[projectile.lane] - 40;
        ctx.strokeStyle = palette.spear;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(projectile.x - sign(projectile.vx) * 24, y);
        ctx.lineTo(projectile.x + sign(projectile.vx) * 20, y);
        ctx.stroke();
        ctx.fillStyle = palette.spear;
        ctx.beginPath();
        const tip = projectile.x + sign(projectile.vx) * 24;
        ctx.moveTo(tip, y);
        ctx.lineTo(tip - sign(projectile.vx) * 14, y - 6);
        ctx.lineTo(tip - sign(projectile.vx) * 14, y + 6);
        ctx.closePath();
        ctx.fill();

        if (projectile.glow > 0) {
          ctx.strokeStyle = `rgba(243, 203, 115, ${projectile.glow * 3})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(projectile.x - sign(projectile.vx) * 46, y);
          ctx.lineTo(projectile.x + sign(projectile.vx) * 46, y);
          ctx.stroke();
        }
      }
    }

    function drawGroundedSpears() {
      for (const spear of state.groundedSpears) {
        const y = LANES[spear.lane] - 8;
        ctx.strokeStyle = palette.spear;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(spear.x - 16, y);
        ctx.lineTo(spear.x + 16, y);
        ctx.stroke();
        ctx.fillStyle = palette.spear;
        ctx.beginPath();
        ctx.moveTo(spear.x + 16, y);
        ctx.lineTo(spear.x + 5, y - 5);
        ctx.lineTo(spear.x + 5, y + 5);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawParticles() {
      for (const particle of state.particles) {
        ctx.globalAlpha = Math.max(0, particle.life * 2);
        ctx.fillStyle = particle.color;
        ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
      }
      ctx.globalAlpha = 1;
    }

    function drawHud() {
      ctx.fillStyle = "rgba(16, 10, 14, 0.78)";
      ctx.fillRect(0, 0, WIDTH, 78);
      ctx.fillRect(0, HEIGHT - 76, WIDTH, 76);

      ctx.fillStyle = palette.ink;
      ctx.font = "700 28px Trebuchet MS";
      ctx.fillText("Nidhogg Bridge Feint", 40, 46);

      ctx.font = "700 20px Trebuchet MS";
      ctx.fillStyle = palette.player;
      ctx.fillText(`You ${player.score}`, 42, 108);
      ctx.fillStyle = palette.enemy;
      ctx.fillText(`Rival ${enemy.score}`, 170, 108);

      ctx.fillStyle = palette.muted;
      ctx.font = "600 15px Trebuchet MS";
      ctx.fillText(state.tips[state.tipIndex], 42, HEIGHT - 28);

      ctx.textAlign = "right";
      ctx.fillStyle = palette.ink;
      ctx.fillText(player.hasSpear ? "Armed" : "Recover your spear", WIDTH - 42, 46);
      ctx.fillStyle = palette.muted;
      ctx.fillText(enemy.hasSpear ? "Rival armed" : "Rival disarmed", WIDTH - 42, 108);
      ctx.textAlign = "left";

      if (state.winner) {
        ctx.fillStyle = "rgba(11, 9, 11, 0.8)";
        ctx.fillRect(WIDTH / 2 - 220, 24, 440, 44);
        ctx.fillStyle = palette.gold;
        ctx.textAlign = "center";
        ctx.fillText(state.winner, WIDTH / 2, 52);
        ctx.textAlign = "left";
      }
    }

    function drawTitleCard() {
      drawBackdrop();
      for (let i = 0; i < LANES.length; i += 1) {
        drawBridgeLane(i);
      }
      drawBanner();
      drawFighter(player);
      drawFighter(enemy);

      ctx.fillStyle = "rgba(13, 10, 15, 0.72)";
      ctx.fillRect(170, 126, 940, 470);

      ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
      ctx.lineWidth = 2;
      ctx.strokeRect(170, 126, 940, 470);

      ctx.textAlign = "center";
      ctx.fillStyle = palette.ink;
      ctx.font = "700 58px Trebuchet MS";
      ctx.fillText("Nidhogg Bridge Feint", WIDTH / 2, 232);
      ctx.font = "600 24px Trebuchet MS";
      ctx.fillStyle = palette.gold;
      ctx.fillText("Lane pressure, spear reads, and instant rematches on a hanging bridge.", WIDTH / 2, 282);

      ctx.font = "600 21px Trebuchet MS";
      ctx.fillStyle = palette.ink;
      ctx.fillText("A D move   W S swap lane   J thrust   K parry   L throw", WIDTH / 2, 380);
      ctx.fillText("Read the windup. Face the spear line. Shove if both fighters drop steel.", WIDTH / 2, 422);

      ctx.font = "700 26px Trebuchet MS";
      ctx.fillStyle = palette.success;
      ctx.fillText("Press Enter or Space to duel. R rematches instantly.", WIDTH / 2, 510);
      ctx.textAlign = "left";
    }

    function drawMatchOver() {
      drawBackdrop();
      for (let i = 0; i < LANES.length; i += 1) {
        drawBridgeLane(i);
      }
      drawBanner();
      drawParticles();
      drawHud();

      ctx.fillStyle = "rgba(13, 10, 15, 0.78)";
      ctx.fillRect(250, 190, 780, 250);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
      ctx.lineWidth = 2;
      ctx.strokeRect(250, 190, 780, 250);

      ctx.textAlign = "center";
      ctx.fillStyle = player.score > enemy.score ? palette.player : palette.enemy;
      ctx.font = "700 52px Trebuchet MS";
      ctx.fillText(player.score > enemy.score ? "Bridge Claimed" : "Rival Took The Span", WIDTH / 2, 280);
      ctx.fillStyle = palette.ink;
      ctx.font = "600 28px Trebuchet MS";
      ctx.fillText(`Final score ${player.score} - ${enemy.score}`, WIDTH / 2, 336);
      ctx.fillStyle = palette.gold;
      ctx.font = "700 24px Trebuchet MS";
      ctx.fillText("Press Enter, Space, or R for an instant rematch", WIDTH / 2, 394);
      ctx.textAlign = "left";
    }

    function render() {
      drawBackdrop();
      for (let i = 0; i < LANES.length; i += 1) {
        drawBridgeLane(i);
      }
      drawBanner();

      if (state.scene === "title") {
        drawTitleCard();
        return;
      }

      drawGroundedSpears();
      drawProjectiles();
      drawFighter(player);
      drawFighter(enemy);
      drawParticles();
      drawHud();

      if (state.scene === "match-over") {
        drawMatchOver();
      }
    }

    let lastTime = performance.now();
    function frame(now) {
      const dt = Math.min(MAX_DT, (now - lastTime) / 1000);
      lastTime = now;
      update(dt);
      render();
      pressed.clear();
      requestAnimationFrame(frame);
    }

    window.addEventListener("keydown", (event) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(event.code)) {
        event.preventDefault();
      }
      if (!keys.has(event.code)) {
        pressed.add(event.code);
      }
      keys.add(event.code);
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.code);
    });

    render();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
