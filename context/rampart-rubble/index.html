<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rampart Rubble</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="frame">
        <header class="hud" aria-label="Game status">
          <div><span>Wave</span><strong id="wave">1 / 4</strong></div>
          <div><span>Keep</span><strong id="keep">100</strong></div>
          <div><span>Stone</span><strong id="stone">0</strong></div>
          <div><span>Phase</span><strong id="phase">Menu</strong></div>
          <div><span>Score</span><strong id="score">0</strong></div>
        </header>
        <canvas id="game" width="960" height="540" aria-label="Rampart Rubble playfield"></canvas>
        <section class="panel" id="panel">
          <h1 id="title">Rampart Rubble</h1>
          <p id="message">Rebuild your wall, then break the fleet before their shells break the keep.</p>
          <p id="detail">Mouse places stone pieces in rebuild. Move mouse to aim and click in defend. `Q` / `E` rotate. `Space` starts the next phase.</p>
          <button id="action" type="button">Start</button>
        </section>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
