<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skylord Defender</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-0: #04070d;
      --bg-1: #07111d;
      --bg-2: #12273d;
      --panel: rgba(7, 12, 20, 0.74);
      --panel-strong: rgba(9, 14, 24, 0.92);
      --line: rgba(151, 208, 255, 0.16);
      --text: #f4f8ff;
      --muted: rgba(244, 248, 255, 0.72);
      --accent: #76d7ff;
      --accent-2: #9ef39d;
      --warn: #ff8f7c;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 15%, rgba(118, 215, 255, 0.16), transparent 24%),
        radial-gradient(circle at 20% 20%, rgba(158, 243, 157, 0.11), transparent 20%),
        radial-gradient(circle at 82% 18%, rgba(255, 143, 124, 0.08), transparent 18%),
        linear-gradient(180deg, var(--bg-2), var(--bg-1) 42%, var(--bg-0));
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
    }

    .shell {
      position: relative;
      width: min(100vw, 1600px);
      height: min(100vh, 900px);
      padding: 14px;
    }

    .shell::before,
    .shell::after {
      content: "";
      position: absolute;
      inset: auto;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      opacity: 0.28;
    }

    .shell::before {
      width: 30vw;
      height: 30vw;
      top: -8vh;
      left: -6vw;
      background: rgba(118, 215, 255, 0.2);
    }

    .shell::after {
      width: 26vw;
      height: 26vw;
      right: -7vw;
      bottom: -10vh;
      background: rgba(158, 243, 157, 0.16);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 30px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent),
        linear-gradient(180deg, rgba(10, 16, 24, 0.98), rgba(5, 8, 12, 0.98));
      box-shadow:
        0 32px 90px rgba(0, 0, 0, 0.48),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .chrome {
      position: absolute;
      inset: 22px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: 11px;
      color: rgba(244, 248, 255, 0.66);
    }

    .chrome span {
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(5, 8, 14, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <main class="shell">
    <canvas id="game" width="1600" height="900" aria-label="Skylord Defender"></canvas>
    <div class="chrome">
      <span>skylord defender</span>
      <span>canvas shell</span>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
