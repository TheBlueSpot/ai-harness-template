<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSX Trickstorm</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hud">
        <div class="hud__left">
          <div class="stat"><span class="label">Speed</span><span id="speedValue">0</span></div>
          <div class="stat"><span class="label">Boost</span><span id="boostValue">0%</span></div>
          <div class="stat"><span class="label">Score</span><span id="scoreValue">0</span></div>
        </div>
        <div class="hud__right">
          <div class="stat"><span class="label">Distance</span><span id="distanceValue">0 m</span></div>
          <div class="stat"><span class="label">Combo</span><span id="comboValue">None</span></div>
          <div class="stat"><span class="label">Gate</span><span id="gateValue">1 / 3</span></div>
        </div>
      </section>
      <canvas id="gameCanvas" width="1280" height="720" aria-label="SSX Trickstorm"></canvas>
      <section class="overlay" id="overlay">
        <div class="overlay__card">
          <p class="eyebrow" id="overlayEyebrow">Downhill Jam</p>
          <h1 id="overlayTitle">SSX Trickstorm</h1>
          <p id="overlayBody">
            Carve for speed, hit ramps, bank tricks on clean landings, and thread the gates before the finish.
          </p>
          <p class="controls">
            `A/D` lane shift, `W` tuck, `S` scrub, `Space` jump, `J/L` spin, `K` grab, `Shift` boost
          </p>
          <button id="overlayButton" type="button">Start Run</button>
        </div>
      </section>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
