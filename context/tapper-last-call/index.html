<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tapper Last Call</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #130d0d;
      --panel: rgba(34, 20, 18, 0.88);
      --line: rgba(255, 225, 194, 0.16);
      --text: #fff1db;
      --muted: rgba(255, 241, 219, 0.72);
      --amber: #f6ad55;
      --red: #f56565;
      --foam: #f8e8c8;
      --teal: #7dd3c7;
      --wood: #5e3423;
      --wood-dark: #2f1a14;
      font-family: Georgia, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      background:
        radial-gradient(circle at top, rgba(246, 173, 85, 0.16), transparent 28%),
        radial-gradient(circle at 20% 20%, rgba(125, 211, 199, 0.1), transparent 24%),
        linear-gradient(180deg, #251412, #130d0d 56%, #090707);
      color: var(--text);
    }

    .shell {
      width: min(100%, 1140px);
      display: grid;
      gap: 14px;
    }

    .frame {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(78, 43, 28, 0.34), rgba(22, 14, 14, 0.92)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.42);
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, #241311, #120b0b);
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
    }

    .hud strong,
    .hud span {
      display: block;
    }

    .hud strong {
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hud span {
      margin-top: 4px;
      font-size: 1.1rem;
    }

    .notes {
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(24, 15, 15, 0.82);
      color: var(--muted);
      line-height: 1.55;
    }

    .notes p {
      margin: 0;
    }

    .notes p + p {
      margin-top: 8px;
    }

    @media (max-width: 720px) {
      body {
        padding: 10px;
      }

      .frame {
        padding: 10px;
        border-radius: 20px;
      }

      .hud {
        padding: 12px 14px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="frame">
      <canvas id="game" width="1100" height="720" aria-label="Tapper Last Call"></canvas>
    </section>
    <section class="hud" aria-live="polite">
      <div><strong>Score</strong><span id="score">0</span></div>
      <div><strong>Shift</strong><span id="shift">1 / 3</span></div>
      <div><strong>Lives</strong><span id="lives">3</span></div>
      <div><strong>Served</strong><span id="served">0</span></div>
    </section>
    <section class="notes">
      <p>Move with <strong>W/S</strong> or <strong>Arrow Up/Down</strong>. Press <strong>Space</strong> to slide a fresh mug down the highlighted bar.</p>
      <p>Serve patrons before they reach the bartender, then catch the empty mugs as they come back. Clear three shifts to close the bar.</p>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreNode = document.getElementById("score");
    const shiftNode = document.getElementById("shift");
    const livesNode = document.getElementById("lives");
    const servedNode = document.getElementById("served");

    const keys = new Set();
    const laneCount = 4;
    const laneHeight = 132;
    const laneTop = 120;
    const laneGap = 16;
    const barLeft = 112;
    const barRight = 1008;
    const barLength = barRight - barLeft;
    const lastCallScore = 72;

    const state = {
      mode: "title",
      bartenderLane: 1,
      lives: 3,
      score: 0,
      shift: 1,
      served: 0,
      wavesCleared: 0,
      message: "Serve the rush.",
      patrons: [],
      mugs: [],
      empties: [],
      sparkles: [],
      laneTimers: Array.from({ length: laneCount }, () => 0),
      teaching: {
        firstServe: false,
        firstCatch: false,
      },
    };

    function laneY(index) {
      return laneTop + index * (laneHeight + laneGap);
    }

    function resetGame() {
      state.mode = "playing";
      state.bartenderLane = 1;
      state.lives = 3;
      state.score = 0;
      state.shift = 1;
      state.served = 0;
      state.wavesCleared = 0;
      state.message = "Serve the rush.";
      state.patrons = [];
      state.mugs = [];
      state.empties = [];
      state.sparkles = [];
      state.laneTimers = Array.from({ length: laneCount }, (_, index) => 1.2 + index * 0.25);
      state.teaching.firstServe = false;
      state.teaching.firstCatch = false;
      updateHud();
    }

    function updateHud() {
      scoreNode.textContent = String(state.score);
      shiftNode.textContent = `${state.shift} / 3`;
      livesNode.textContent = String(state.lives);
      servedNode.textContent = String(state.served);
    }

    function spawnPatron(lane) {
      const waveBias = state.shift - 1;
      state.patrons.push({
        lane,
        x: barRight - 32,
        speed: 92 + lane * 10 + waveBias * 18 + Math.random() * 16,
        color: ["#f6ad55", "#f56565", "#7dd3c7", "#c4b5fd"][lane],
      });
    }

    function launchMug() {
      const lane = state.bartenderLane;
      const activeMugs = state.mugs.filter((mug) => mug.lane === lane).length;
      const activeEmpties = state.empties.filter((mug) => mug.lane === lane).length;
      if (activeMugs + activeEmpties >= 2) {
        return;
      }

      state.mugs.push({
        lane,
        x: barLeft + 54,
        speed: 640,
      });

      state.teaching.firstServe = true;
    }

    function loseLife(reason, lane) {
      state.lives -= 1;
      state.message = reason;
      burstSparkles(barLeft + 50, laneY(lane) + laneHeight * 0.5, "#f56565", 14);
      if (state.lives <= 0) {
        state.mode = "lost";
        state.message = "Last call. Press Enter to run it back.";
      }
      updateHud();
    }

    function awardServe(x, lane) {
      state.score += 8;
      state.served += 1;
      state.message = state.teaching.firstCatch
        ? "Keep the empties flowing."
        : "Catch the empty mug on the way back.";
      burstSparkles(x, laneY(lane) + 30, "#f6ad55", 10);
      updateHud();

      if (state.served >= lastCallScore) {
        state.mode = "won";
        state.message = "Bar closed clean. Press Enter for another shift.";
        return;
      }

      if (state.served % 24 === 0) {
        state.shift += 1;
        state.wavesCleared += 1;
        state.message = `Shift ${state.shift}. Faster crowd.`;
        burstSparkles(canvas.width * 0.5, 96, "#7dd3c7", 18);
        updateHud();
      }
    }

    function burstSparkles(x, y, color, count) {
      for (let index = 0; index < count; index += 1) {
        const angle = (Math.PI * 2 * index) / count;
        const speed = 40 + Math.random() * 90;
        state.sparkles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.55 + Math.random() * 0.4,
          color,
        });
      }
    }

    function updatePlaying(dt) {
      if (keys.has("arrowup") || keys.has("w")) {
        state.bartenderLane = Math.max(0, state.bartenderLane - 1);
        keys.delete("arrowup");
        keys.delete("w");
      }
      if (keys.has("arrowdown") || keys.has("s")) {
        state.bartenderLane = Math.min(laneCount - 1, state.bartenderLane + 1);
        keys.delete("arrowdown");
        keys.delete("s");
      }

      const activePatrons = state.patrons.filter((patron) => patron.lane === state.bartenderLane && patron.x < barLeft + 220);
      if (activePatrons.length && !state.teaching.firstServe) {
        state.message = "Serve this lane now.";
      }

      for (let lane = 0; lane < laneCount; lane += 1) {
        state.laneTimers[lane] -= dt;
        if (state.laneTimers[lane] <= 0) {
          spawnPatron(lane);
          const shiftBias = Math.max(0.5, 1.65 - state.shift * 0.22);
          state.laneTimers[lane] = shiftBias + Math.random() * 1.2;
        }
      }

      state.patrons = state.patrons.filter((patron) => {
        patron.x -= patron.speed * dt;
        if (patron.x <= barLeft + 34) {
          loseLife("A patron reached the bar.", patron.lane);
          return false;
        }
        return true;
      });

      state.mugs = state.mugs.filter((mug) => {
        mug.x += mug.speed * dt;
        const patron = state.patrons.find((candidate) => candidate.lane === mug.lane && Math.abs(candidate.x - mug.x) < 28);
        if (patron) {
          patron.hit = true;
          state.empties.push({
            lane: mug.lane,
            x: patron.x,
            speed: 360 + state.shift * 28,
          });
          awardServe(patron.x, mug.lane);
          return false;
        }
        return mug.x < barRight - 28;
      });

      state.patrons = state.patrons.filter((patron) => !patron.hit);

      state.empties = state.empties.filter((mug) => {
        mug.x -= mug.speed * dt;
        const catchX = barLeft + 56;
        if (Math.abs(mug.x - catchX) < 24 && mug.lane === state.bartenderLane) {
          state.score += 4;
          state.teaching.firstCatch = true;
          state.message = "Clean catch. Stay ahead of the rush.";
          burstSparkles(catchX, laneY(mug.lane) + laneHeight * 0.5, "#f8e8c8", 8);
          updateHud();
          return false;
        }

        if (mug.x <= barLeft + 16) {
          loseLife("An empty mug smashed on the bar.", mug.lane);
          return false;
        }
        return true;
      });

      state.sparkles = state.sparkles.filter((spark) => {
        spark.life -= dt;
        spark.x += spark.vx * dt;
        spark.y += spark.vy * dt;
        spark.vx *= 0.98;
        spark.vy *= 0.98;
        return spark.life > 0;
      });
    }

    function drawBackdrop() {
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, "#3a201b");
      gradient.addColorStop(0.4, "#1a1111");
      gradient.addColorStop(1, "#0a0808");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(255, 224, 194, 0.08)";
      for (let index = 0; index < 5; index += 1) {
        ctx.fillRect(70 + index * 200, 58, 110, 26);
      }
    }

    function drawBars() {
      for (let lane = 0; lane < laneCount; lane += 1) {
        const y = laneY(lane);
        const active = lane === state.bartenderLane;
        ctx.fillStyle = active ? "#7a4b2c" : "#563325";
        ctx.fillRect(barLeft, y + 28, barLength, 20);
        ctx.fillStyle = active ? "rgba(246, 173, 85, 0.24)" : "rgba(255, 255, 255, 0.04)";
        ctx.fillRect(barLeft, y + 8, barLength, 64);
        ctx.strokeStyle = active ? "rgba(246, 173, 85, 0.85)" : "rgba(255, 225, 194, 0.12)";
        ctx.lineWidth = active ? 3 : 1;
        ctx.strokeRect(barLeft, y + 8, barLength, 64);

        ctx.fillStyle = "rgba(255, 241, 219, 0.12)";
        ctx.fillRect(barLeft + 16, y + 80, barLength - 32, 14);
      }
    }

    function drawBartender() {
      const y = laneY(state.bartenderLane) + laneHeight * 0.5;
      ctx.fillStyle = "#f6ad55";
      ctx.beginPath();
      ctx.arc(barLeft - 18, y - 24, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#f8e8c8";
      ctx.fillRect(barLeft - 34, y - 6, 30, 40);
      ctx.fillStyle = "#7dd3c7";
      ctx.fillRect(barLeft - 34, y + 2, 30, 12);
    }

    function drawPatrons() {
      state.patrons.forEach((patron) => {
        const y = laneY(patron.lane) + laneHeight * 0.5;
        ctx.fillStyle = patron.color;
        ctx.beginPath();
        ctx.arc(patron.x, y - 14, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f8e8c8";
        ctx.fillRect(patron.x - 13, y - 2, 26, 34);
      });
    }

    function drawMugs() {
      state.mugs.forEach((mug) => {
        const y = laneY(mug.lane) + laneHeight * 0.5;
        ctx.fillStyle = "#f6ad55";
        ctx.fillRect(mug.x - 14, y - 18, 24, 18);
        ctx.strokeStyle = "#f8e8c8";
        ctx.lineWidth = 2;
        ctx.strokeRect(mug.x - 14, y - 18, 24, 18);
      });

      state.empties.forEach((mug) => {
        const y = laneY(mug.lane) + laneHeight * 0.5;
        ctx.fillStyle = "#f8e8c8";
        ctx.fillRect(mug.x - 14, y - 16, 24, 14);
        ctx.strokeStyle = "#7a4b2c";
        ctx.lineWidth = 2;
        ctx.strokeRect(mug.x - 14, y - 16, 24, 14);
      });
    }

    function drawSparkles() {
      state.sparkles.forEach((spark) => {
        ctx.globalAlpha = Math.max(0, spark.life);
        ctx.fillStyle = spark.color;
        ctx.fillRect(spark.x, spark.y, 4, 4);
      });
      ctx.globalAlpha = 1;
    }

    function drawOverlay() {
      ctx.fillStyle = "rgba(10, 7, 7, 0.68)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = "center";
      ctx.fillStyle = "#fff1db";
      ctx.font = "700 54px Georgia";
      ctx.fillText("Tapper Last Call", canvas.width * 0.5, 182);

      ctx.font = "26px Georgia";
      ctx.fillStyle = "rgba(255, 241, 219, 0.86)";
      if (state.mode === "title") {
        ctx.fillText("Hold the lanes, serve the rush, catch the empties.", canvas.width * 0.5, 246);
        ctx.fillText("W/S or Arrow Keys move. Space serves. Press Enter to open.", canvas.width * 0.5, 292);
      } else if (state.mode === "won") {
        ctx.fillText("You closed the bar clean through all three shifts.", canvas.width * 0.5, 246);
        ctx.fillText("Press Enter to run another night.", canvas.width * 0.5, 292);
      } else if (state.mode === "lost") {
        ctx.fillText("The rush broke through.", canvas.width * 0.5, 246);
        ctx.fillText("Press Enter to restart immediately.", canvas.width * 0.5, 292);
      }
    }

    function drawPrompts() {
      ctx.textAlign = "left";
      ctx.font = "600 20px Georgia";
      ctx.fillStyle = "#fff1db";

      if (!state.teaching.firstServe) {
        const y = laneY(state.bartenderLane) + 18;
        ctx.fillText("Serve here", barLeft + 140, y);
      } else if (!state.teaching.firstCatch && state.empties.length) {
        const mug = state.empties[0];
        ctx.fillText("Catch the empty", barLeft + 138, laneY(mug.lane) + 18);
      }

      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(255, 241, 219, 0.92)";
      ctx.fillText(state.message, canvas.width * 0.5, 64);
    }

    function render() {
      drawBackdrop();
      drawBars();
      drawBartender();
      drawPatrons();
      drawMugs();
      drawSparkles();
      drawPrompts();

      ctx.textAlign = "left";
      ctx.font = "700 24px Georgia";
      ctx.fillStyle = "#fff1db";
      ctx.fillText("Last Call", 44, 52);

      if (state.mode !== "playing") {
        drawOverlay();
      }
    }

    let previous = performance.now();
    function frame(now) {
      const dt = Math.min(0.033, (now - previous) / 1000);
      previous = now;

      if (state.mode === "playing") {
        updatePlaying(dt);
      }

      render();
      requestAnimationFrame(frame);
    }

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (["arrowup", "arrowdown", "w", "s", " "].includes(key) || event.key === " ") {
        event.preventDefault();
      }

      if (event.key === "Enter" && state.mode !== "playing") {
        resetGame();
        return;
      }

      if (state.mode !== "playing") {
        return;
      }

      if (event.key === " " || key === "spacebar") {
        launchMug();
        return;
      }

      keys.add(key);
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key.toLowerCase());
    });

    updateHud();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
