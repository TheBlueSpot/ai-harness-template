<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tron Lightcycle Duel</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="frame">
        <canvas id="game" width="960" height="540" aria-label="Tron Lightcycle Duel"></canvas>
        <div class="hud" aria-live="polite">
          <div class="hud__left">
            <span id="roundLabel">Round 1</span>
            <span id="statusLabel">Cut off the rivals.</span>
          </div>
          <div class="hud__right">
            <span id="boostLabel">Boost 0</span>
            <span id="livesLabel">Lives 3</span>
          </div>
        </div>
        <div class="overlay" id="overlay" hidden>
          <div class="overlay__card">
            <h1 id="overlayTitle">Tron Lightcycle Duel</h1>
            <p id="overlayBody">Box rivals into their own light walls. Arrows steer. Hold Space to burn boost.</p>
            <p class="overlay__hint">Press Enter</p>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
