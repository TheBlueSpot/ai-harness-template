<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>velocity-grind</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-0: #05070c;
      --bg-1: #08121f;
      --bg-2: #10253a;
      --text: #f6f2ea;
      --muted: rgba(246, 242, 234, 0.72);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 179, 71, 0.15), transparent 22%),
        radial-gradient(circle at 20% 15%, rgba(126, 224, 129, 0.12), transparent 20%),
        radial-gradient(circle at 80% 30%, rgba(118, 177, 255, 0.12), transparent 18%),
        linear-gradient(180deg, var(--bg-2), var(--bg-1) 44%, var(--bg-0));
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    .shell {
      position: relative;
      width: min(100vw, 1440px);
      height: min(100vh, 900px);
      padding: 16px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent),
        linear-gradient(180deg, rgba(10, 16, 24, 0.98), rgba(5, 8, 12, 0.98));
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .chrome {
      position: absolute;
      inset: 24px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 11px;
      color: var(--muted);
    }

    .chrome span {
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(7, 10, 16, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <main class="shell">
    <canvas id="game" width="1600" height="900" aria-label="velocity-grind"></canvas>
    <div class="chrome">
      <span>velocity-grind</span>
      <span>canvas game</span>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
